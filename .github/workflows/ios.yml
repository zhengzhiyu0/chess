name: Build iOS (unsigned IPA)

# Produces an unsigned .ipa; sign & install it with Sideloadly / AltStore using a free Apple ID.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            web/.cache/nnue
          key: native-assets-${{ hashFiles('web/native-plugins/maia-native/stockfish/src/evaluate.h', 'web/scripts/prepare-native.mjs') }}
      - run: npm ci
      - name: Audio regression tests
        run: npm test -- test/sound.test.ts test/native-sound.test.ts test/coach-voice.test.ts
      - run: npm run build:native

      - name: Native audio assets and plugin smoke test
        run: swift test/sound-assets.native.swift ios/App/App/public

      # the native Stockfish (full + lite in one binary, NEON) must answer UCI, search and stop
      - name: Native Stockfish smoke test (arm64 macOS)
        run: sh native-plugins/maia-native/stockfish/test/build_smoke.sh .cache/nnue

      - name: Xcode build (no signing)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry MaiaCoach.ipa Payload
          ls -lh MaiaCoach.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MaiaCoach-ipa
          path: web/MaiaCoach.ipa
          compression-level: 0
          retention-days: 14
