name: Build iOS (unsigned IPA)

# Produces an unsigned .ipa; sign & install it with Sideloadly / AltStore using a free Apple ID.
on:
  workflow_dispatch:
    inputs:
      native_profile:
        description: 原生引擎配置
        required: true
        type: choice
        options:
          - all
          - 79m-full
        default: all
  push:
    tags: ['ios-v*']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    env:
      NATIVE_PROFILE: ${{ inputs.native_profile || 'all' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            web/.cache/nnue
          key: native-assets-${{ hashFiles('web/native-plugins/maia-native/stockfish/src/evaluate.h', 'web/scripts/prepare-native.mjs') }}
      - uses: actions/cache@v4
        id: coreml-cache
        with:
          path: |
            web/.cache/coreml-build
            web/.cache/coreml-venv
          key: coreml-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/native-models/maia3-*/manifest.json', 'web/scripts/compile-coreml.py', 'web/test/golden.json', '.github/workflows/ios.yml') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Audio regression tests
        run: npm test -- test/sound.test.ts test/native-sound.test.ts test/coach-voice.test.ts
      - run: npm run build:native
        env:
          NATIVE_PROFILE: ${{ env.NATIVE_PROFILE }}
          VITE_NATIVE_PROFILE: ${{ env.NATIVE_PROFILE }}
      - name: Compile bundled Maia CoreML models
        run: |
          set -o pipefail
          models='5m,23m,79m'
          if [ "$NATIVE_PROFILE" = '79m-full' ]; then models='79m'; fi
          if [ ! -x .cache/coreml-venv/bin/python ]; then
            python3 -m venv .cache/coreml-venv
          fi
          . .cache/coreml-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'onnx2coreml==1.1.0' 'coremltools==8.3.0' 'onnx==1.17.0' 'numpy==1.26.4' 'onnxruntime==1.20.1'
          PYTHONFAULTHANDLER=1 PYTHONUNBUFFERED=1 python scripts/compile-coreml.py --models "$models" 2>&1 | tee coreml-build.log
      - name: Upload CoreML build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-build-log
          path: web/coreml-build.log
          if-no-files-found: warn
      - name: Publish CoreML failure detail
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('coreml-build.log').read_text(errors='replace')
          detail = text[-3500:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=CoreML conversion failed::{detail}')
          PY
      - name: Verify bundled native model layout
        run: |
          models='5m 23m 79m'
          if [ "$NATIVE_PROFILE" = '79m-full' ]; then models='79m'; fi
          for model in $models; do test -d "ios/App/App/public/native/maia3-$model.mlmodelc"; done
          test -f ios/App/App/public/native/nn-1a298aa575a0.nnue
          if [ "$NATIVE_PROFILE" != '79m-full' ]; then test -f ios/App/App/public/native/nn-61e7af4bb97d.nnue; fi
          if [ "$NATIVE_PROFILE" = '79m-full' ]; then
            test ! -e ios/App/App/public/native/nn-61e7af4bb97d.nnue
            test ! -e ios/App/App/public/native/maia3-5m.mlmodelc
            test ! -e ios/App/App/public/native/maia3-23m.mlmodelc
          fi
          ! find ios/App/App/public/native -maxdepth 1 -name 'maia3-*.onnx' -print -quit | grep -q .

      - name: Native audio assets and plugin smoke test
        run: swift test/sound-assets.native.swift ios/App/App/public

      # the native Stockfish (selected flavour(s), NEON) must answer UCI, search and stop
      - name: Native Stockfish smoke test (arm64 macOS)
        run: sh native-plugins/maia-native/stockfish/test/build_smoke.sh .cache/nnue

      - name: Xcode build (no signing)
        run: |
          set -o pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode-build.log

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: web/xcode-build.log
          if-no-files-found: warn

      - name: Publish Xcode failure detail
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path('xcode-build.log')
          if log.exists():
              text = log.read_text(errors='replace')
              errors = [line for line in text.splitlines() if 'error:' in line.lower()]
              detail = '\n'.join(errors)[-3500:] if errors else text[-3500:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Xcode build failed::{detail}')
          PY

      - name: Verify CoreML resources in App bundle
        run: |
          app=build/Build/Products/Release-iphoneos/App.app
          models='5m 23m 79m'
          if [ "$NATIVE_PROFILE" = '79m-full' ]; then models='79m'; fi
          for model in $models; do
            bundle="$app/public/native/maia3-$model.mlmodelc"
            test -d "$bundle" && test -n "$(find "$bundle" -type f -print -quit)" || {
              echo "Missing or empty CoreML resource in App.app: maia3-$model.mlmodelc" >&2
              exit 1
            }
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry MaiaCoach.ipa Payload
          ls -lh MaiaCoach.ipa

      - name: Verify CoreML resources in IPA
        run: |
          models='5m 23m 79m'
          if [ "$NATIVE_PROFILE" = '79m-full' ]; then models='79m'; fi
          for model in $models; do
            unzip -Z1 MaiaCoach.ipa | grep -Eq "^Payload/App\\.app/public/native/maia3-$model\\.mlmodelc/.+" || {
              echo "Missing or empty CoreML resource in MaiaCoach.ipa: maia3-$model.mlmodelc" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MaiaCoach-ipa-${{ env.NATIVE_PROFILE }}
          path: web/MaiaCoach.ipa
          compression-level: 0
          retention-days: 14
