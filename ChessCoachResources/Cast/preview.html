<script type="application/json" id="data">{"roles": [{"id": "lia", "name": "莉亚", "style": "精准克制", "voiceLabel": "Laid-back Girl", "voice": "Chinese (Mandarin)_Laid_BackGirl", "color": "#8e7cf0", "rationale": "已确认的默认音色基准。"}, {"id": "xiaoyou", "name": "小柚", "coachIndex": 1, "style": "温柔鼓励", "voice": "Chinese (Mandarin)_Warm_Bestie", "voiceLabel": "温暖闺蜜", "color": "#ffb340", "rationale": "温柔清亮、对话自然；失误时提醒，受压时鼓励。"}, {"id": "leo", "name": "里奥", "coachIndex": 2, "style": "戏剧张力", "voice": "Chinese (Mandarin)_Radio_Host", "voiceLabel": "电台男主播", "color": "#48c6b8", "rationale": "清亮明快、略带傲气；用登场、转折与节奏表达戏剧感。"}, {"id": "victor", "name": "维克多", "coachIndex": 3, "style": "冷静沉着", "voice": "Chinese_radio_host_male_nv1", "voiceLabel": "电台主持", "color": "#7fb069", "rationale": "低沉沉稳；短句、事实判断、耐心应对。"}, {"id": "zara", "name": "扎拉", "coachIndex": 4, "style": "直接果断", "voice": "moss_audio_3dee3d0c-7ce6-11f0-8ff8-2a857e2646d2", "voiceLabel": "Wary Willow", "color": "#ff7a59", "rationale": "略沙哑、酷飒随意；表扬有力、提醒直接。"}, {"id": "ajian", "name": "阿健", "coachIndex": 5, "style": "轻松俏皮", "voice": "Chinese_playful_streamer_nv1", "voiceLabel": "游戏主播", "color": "#4aa3f0", "rationale": "明亮青春、自然随性；用小游戏式幽默缓和紧张。"}, {"id": "oscar", "name": "奥斯卡", "coachIndex": 6, "style": "学者风格", "voice": "Chinese (Mandarin)_Lyrical_Voice", "voiceLabel": "抒情男声", "color": "#f0a33a", "rationale": "温润醇厚、娓娓道来；文雅有学识，欣赏计算与构思。"}, {"id": "meiyi", "name": "梅姨", "coachIndex": 7, "style": "机智幽默", "voice": "Chinese (Mandarin)_Wise_Women", "voiceLabel": "阅历姐姐", "color": "#e886b0", "rationale": "温润厚实、成熟亲切；生活化比喻，幽默但不羞辱玩家。"}], "clips": [{"id": "lia_opening_book_entry_01", "role": "lia", "category": "opening_book_entry", "text": "这一步很熟。你走进了准备好的路。", "src": "../Audio/lia_opening_book_entry_01.m4a", "duration": 3.458}, {"id": "lia_opening_book_entry_02", "role": "lia", "category": "opening_book_entry", "text": "开局走得漂亮，至少前几页没有乱。", "src": "../Audio/lia_opening_book_entry_02.m4a", "duration": 2.732}, {"id": "lia_opening_book_entry_03", "role": "lia", "category": "opening_book_entry", "text": "熟悉的结构。真正的较量还在后面。", "src": "../Audio/lia_opening_book_entry_03.m4a", "duration": 3.116}, {"id": "lia_opening_book_entry_04", "role": "lia", "category": "opening_book_entry", "text": "第一段走得干净，别急着以为整盘都懂了。", "src": "../Audio/lia_opening_book_entry_04.m4a", "duration": 3.543}, {"id": "lia_opening_book_exit_01", "role": "lia", "category": "opening_book_exit", "text": "库里的答案到这里，接下来才轮到你思考。", "src": "../Audio/lia_opening_book_exit_01.m4a", "duration": 5.306}, {"id": "lia_opening_book_exit_02", "role": "lia", "category": "opening_book_exit", "text": "熟悉的路走完了。现在，每一步都算你的。", "src": "../Audio/lia_opening_book_exit_02.m4a", "duration": 4.751}, {"id": "lia_opening_book_exit_03", "role": "lia", "category": "opening_book_exit", "text": "理论结束。欢迎来到没有标答的地方。", "src": "../Audio/lia_opening_book_exit_03.m4a", "duration": 3.343}, {"id": "lia_opening_book_exit_04", "role": "lia", "category": "opening_book_exit", "text": "前面是准备，后面是棋力。", "src": "../Audio/lia_opening_book_exit_04.m4a", "duration": 2.434}, {"id": "lia_player_accurate_01", "role": "lia", "category": "player_accurate", "text": "很准。你没有给局面留下多余的噪音。", "src": "../Audio/lia_player_accurate_01.m4a", "duration": 3.3}, {"id": "lia_player_accurate_02", "role": "lia", "category": "player_accurate", "text": "这一步干净，像把门轻轻关上。", "src": "../Audio/lia_player_accurate_02.m4a", "duration": 3.258}, {"id": "lia_player_accurate_03", "role": "lia", "category": "player_accurate", "text": "几个候选里，你拿到了最稳的那个。", "src": "../Audio/lia_player_accurate_03.m4a", "duration": 2.988}, {"id": "lia_player_accurate_04", "role": "lia", "category": "player_accurate", "text": "没有炫技，只有准确。这样的棋最难对付。", "src": "../Audio/lia_player_accurate_04.m4a", "duration": 4.439}, {"id": "lia_player_best_01", "role": "lia", "category": "player_best", "text": "这就是答案。你找得比我想象中快。", "src": "../Audio/lia_player_best_01.m4a", "duration": 2.916}, {"id": "lia_player_best_02", "role": "lia", "category": "player_best", "text": "漂亮，局面最窄的门，被你正好推开。", "src": "../Audio/lia_player_best_02.m4a", "duration": 4.922}, {"id": "lia_player_best_03", "role": "lia", "category": "player_best", "text": "这一手有分量。我得认真回应了。", "src": "../Audio/lia_player_best_03.m4a", "duration": 3.159}, {"id": "lia_player_best_04", "role": "lia", "category": "player_best", "text": "好棋。不是因为好看，是因为它真的解决了问题。", "src": "../Audio/lia_player_best_04.m4a", "duration": 5.391}, {"id": "lia_player_brilliant_01", "role": "lia", "category": "player_brilliant", "text": "这一下，漂亮得有点过分。", "src": "../Audio/lia_player_brilliant_01.m4a", "duration": 3.044}, {"id": "lia_player_brilliant_02", "role": "lia", "category": "player_brilliant", "text": "你把一枚子放上祭坛，换来了整盘的主动。", "src": "../Audio/lia_player_brilliant_02.m4a", "duration": 3.514}, {"id": "lia_player_brilliant_03", "role": "lia", "category": "player_brilliant", "text": "好大胆。更难得的是，它是对的。", "src": "../Audio/lia_player_brilliant_03.m4a", "duration": 4.623}, {"id": "lia_player_brilliant_04", "role": "lia", "category": "player_brilliant", "text": "这不是送子，是把棋盘的秩序重新洗牌。", "src": "../Audio/lia_player_brilliant_04.m4a", "duration": 4.282}, {"id": "lia_capture_minor_01", "role": "lia", "category": "capture_minor", "text": "轻子落下。这个交换可不轻。", "src": "../Audio/lia_capture_minor_01.m4a", "duration": 2.404}, {"id": "lia_capture_minor_02", "role": "lia", "category": "capture_minor", "text": "防线少了一根骨头。", "src": "../Audio/lia_capture_minor_02.m4a", "duration": 2.063}, {"id": "lia_capture_minor_03", "role": "lia", "category": "capture_minor", "text": "这一枚不是路过，是被我准确拿走。", "src": "../Audio/lia_capture_minor_03.m4a", "duration": 3.343}, {"id": "lia_capture_minor_04", "role": "lia", "category": "capture_minor", "text": "少了一个轻子，接下来的每条线都会更窄。", "src": "../Audio/lia_capture_minor_04.m4a", "duration": 3.684}, {"id": "lia_capture_rook_01", "role": "lia", "category": "capture_rook", "text": "车倒下，开放线归我了。", "src": "../Audio/lia_capture_rook_01.m4a", "duration": 2.647}, {"id": "lia_capture_rook_02", "role": "lia", "category": "capture_rook", "text": "重子离场，局面的声音突然变大。", "src": "../Audio/lia_capture_rook_02.m4a", "duration": 3.244}, {"id": "lia_capture_rook_03", "role": "lia", "category": "capture_rook", "text": "这一车很值钱，我收得相当满意。", "src": "../Audio/lia_capture_rook_03.m4a", "duration": 3.002}, {"id": "lia_capture_rook_04", "role": "lia", "category": "capture_rook", "text": "车没了。现在，谁来守住那条线？", "src": "../Audio/lia_capture_rook_04.m4a", "duration": 3.927}, {"id": "lia_capture_queen_01", "role": "lia", "category": "capture_queen", "text": "后没了，这下可不是小问题。", "src": "../Audio/lia_capture_queen_01.m4a", "duration": 3.258}, {"id": "lia_capture_queen_02", "role": "lia", "category": "capture_queen", "text": "我拿走你的后，棋盘突然安静了。", "src": "../Audio/lia_capture_queen_02.m4a", "duration": 3.031}, {"id": "lia_capture_queen_03", "role": "lia", "category": "capture_queen", "text": "这么贵重的礼物，叫我怎么拒绝？", "src": "../Audio/lia_capture_queen_03.m4a", "duration": 3.074}, {"id": "lia_capture_queen_04", "role": "lia", "category": "capture_queen", "text": "后落袋。接下来请把残局下得体面些。", "src": "../Audio/lia_capture_queen_04.m4a", "duration": 4.58}, {"id": "lia_player_loses_minor_01", "role": "lia", "category": "player_loses_minor", "text": "我的轻子没了。很好，你终于盯到了它。", "src": "../Audio/lia_player_loses_minor_01.m4a", "duration": 4.879}, {"id": "lia_player_loses_minor_02", "role": "lia", "category": "player_loses_minor", "text": "这一口吃得漂亮，我需要换一套计划。", "src": "../Audio/lia_player_loses_minor_02.m4a", "duration": 2.874}, {"id": "lia_player_loses_minor_03", "role": "lia", "category": "player_loses_minor", "text": "一枚轻子而已？不，这里会留下回声。", "src": "../Audio/lia_player_loses_minor_03.m4a", "duration": 3.386}, {"id": "lia_player_loses_minor_04", "role": "lia", "category": "player_loses_minor", "text": "你拿得很准，局面换了重量。", "src": "../Audio/lia_player_loses_minor_04.m4a", "duration": 2.959}, {"id": "lia_player_loses_rook_01", "role": "lia", "category": "player_loses_rook", "text": "车被你收走了。这个代价，我记住了。", "src": "../Audio/lia_player_loses_rook_01.m4a", "duration": 4.098}, {"id": "lia_player_loses_rook_02", "role": "lia", "category": "player_loses_rook", "text": "重子离场，看来我得重新谈条件。", "src": "../Audio/lia_player_loses_rook_02.m4a", "duration": 3.556}, {"id": "lia_player_loses_queen_01", "role": "lia", "category": "player_loses_queen", "text": "我的后……好吧，这确实值得庆祝。", "src": "../Audio/lia_player_loses_queen_01.m4a", "duration": 4.623}, {"id": "lia_player_loses_queen_02", "role": "lia", "category": "player_loses_queen", "text": "后被你拿走。终于轮到我承认局面变了。", "src": "../Audio/lia_player_loses_queen_02.m4a", "duration": 3.714}, {"id": "lia_tactic_fork_01", "role": "lia", "category": "tactic_fork", "text": "一叉两吃。两件东西，只能保一件。", "src": "../Audio/lia_tactic_fork_01.m4a", "duration": 5.05}, {"id": "lia_tactic_fork_02", "role": "lia", "category": "tactic_fork", "text": "这一跳很坏，两个目标同时收到通知。", "src": "../Audio/lia_tactic_fork_02.m4a", "duration": 3.77}, {"id": "lia_tactic_fork_03", "role": "lia", "category": "tactic_fork", "text": "马把局面分成了两半，你算得很清楚。", "src": "../Audio/lia_tactic_fork_03.m4a", "duration": 3.471}, {"id": "lia_tactic_fork_04", "role": "lia", "category": "tactic_fork", "text": "漂亮的双捉。现在轮到你挑一件留下。", "src": "../Audio/lia_tactic_fork_04.m4a", "duration": 3.77}, {"id": "lia_tactic_pin_01", "role": "lia", "category": "tactic_pin", "text": "牵住了。前面的子一动，后面的麻烦就会露出来。", "src": "../Audio/lia_tactic_pin_01.m4a", "duration": 3.714}, {"id": "lia_tactic_pin_02", "role": "lia", "category": "tactic_pin", "text": "这条线把它钉住了，呼吸都得小心。", "src": "../Audio/lia_tactic_pin_02.m4a", "duration": 2.959}, {"id": "lia_tactic_pin_03", "role": "lia", "category": "tactic_pin", "text": "别急着动那枚子，它身后站着更贵的东西。", "src": "../Audio/lia_tactic_pin_03.m4a", "duration": 3.855}, {"id": "lia_tactic_pin_04", "role": "lia", "category": "tactic_pin", "text": "牵制成立。局面开始替你施压。", "src": "../Audio/lia_tactic_pin_04.m4a", "duration": 3.215}, {"id": "lia_tactic_sacrifice_01", "role": "lia", "category": "tactic_sacrifice", "text": "弃子？不，你是在买时间。", "src": "../Audio/lia_tactic_sacrifice_01.m4a", "duration": 3.812}, {"id": "lia_tactic_sacrifice_02", "role": "lia", "category": "tactic_sacrifice", "text": "你交出物质，换回了主动权。很有胆量。", "src": "../Audio/lia_tactic_sacrifice_02.m4a", "duration": 4.751}, {"id": "lia_tactic_sacrifice_03", "role": "lia", "category": "tactic_sacrifice", "text": "这枚子不是丢的，是被你用来开门的。", "src": "../Audio/lia_tactic_sacrifice_03.m4a", "duration": 3.343}, {"id": "lia_tactic_sacrifice_04", "role": "lia", "category": "tactic_sacrifice", "text": "我喜欢这个代价。它换来的东西更值钱。", "src": "../Audio/lia_tactic_sacrifice_04.m4a", "duration": 3.258}, {"id": "lia_missed_mate_01", "role": "lia", "category": "missed_mate", "text": "等等，这里本来有将杀。你把结尾放走了。", "src": "../Audio/lia_missed_mate_01.m4a", "duration": 4.012}, {"id": "lia_missed_mate_02", "role": "lia", "category": "missed_mate", "text": "胜负的门开过一次，可惜你没有进去。", "src": "../Audio/lia_missed_mate_02.m4a", "duration": 3.428}, {"id": "lia_blunder_into_mate_01", "role": "lia", "category": "blunder_into_mate", "text": "这一步，直接走进了结局。", "src": "../Audio/lia_blunder_into_mate_01.m4a", "duration": 2.447}, {"id": "lia_blunder_into_mate_02", "role": "lia", "category": "blunder_into_mate", "text": "王自己走进了最后一扇门。", "src": "../Audio/lia_blunder_into_mate_02.m4a", "duration": 2.148}, {"id": "lia_mate_01", "role": "lia", "category": "mate", "text": "将杀。王没有下一句了。", "src": "../Audio/lia_mate_01.m4a", "duration": 2.519}, {"id": "lia_mate_02", "role": "lia", "category": "mate", "text": "结束。所有出口都已经关上。", "src": "../Audio/lia_mate_02.m4a", "duration": 2.519}, {"id": "lia_comeback_01", "role": "lia", "category": "comeback", "text": "还没结束。你刚刚把棋盘拉回来了。", "src": "../Audio/lia_comeback_01.m4a", "duration": 2.604}, {"id": "lia_comeback_02", "role": "lia", "category": "comeback", "text": "这口气接得漂亮，劣势没有继续扩大。", "src": "../Audio/lia_comeback_02.m4a", "duration": 3.671}, {"id": "lia_player_brilliant_05", "role": "lia", "category": "player_brilliant", "text": "我得承认，这一手让我笑不出来了。", "src": "../Audio/lia_player_brilliant_05.m4a", "duration": 3.458}, {"id": "lia_lia_best_move_01", "role": "lia", "category": "lia_best_move", "text": "轮到我了。这个答案，我不会放过。", "src": "../Audio/lia_lia_best_move_01.m4a", "duration": 4.068}, {"id": "lia_lia_best_move_02", "role": "lia", "category": "lia_best_move", "text": "看见了吗？最有力的那条路，通常不吵。", "src": "../Audio/lia_lia_best_move_02.m4a", "duration": 3.556}, {"id": "lia_lia_best_move_03", "role": "lia", "category": "lia_best_move", "text": "这一手不华丽，但它把几扇门都锁上了。", "src": "../Audio/lia_lia_best_move_03.m4a", "duration": 3.415}, {"id": "lia_lia_best_move_04", "role": "lia", "category": "lia_best_move", "text": "压力回来了。现在请你找出同样准确的回应。", "src": "../Audio/lia_lia_best_move_04.m4a", "duration": 4.068}, {"id": "lia_capture_pawn_01", "role": "lia", "category": "capture_pawn", "text": "一兵落袋，别小看这种小账。", "src": "../Audio/lia_capture_pawn_01.m4a", "duration": 2.647}, {"id": "lia_capture_pawn_02", "role": "lia", "category": "capture_pawn", "text": "小小一口，先把节奏咬住。", "src": "../Audio/lia_capture_pawn_02.m4a", "duration": 3.343}, {"id": "lia_capture_pawn_03", "role": "lia", "category": "capture_pawn", "text": "这枚兵的位置太松了，我替你收拾。", "src": "../Audio/lia_capture_pawn_03.m4a", "duration": 2.86}, {"id": "lia_capture_pawn_04", "role": "lia", "category": "capture_pawn", "text": "少一兵，故事还长；但账已经记下。", "src": "../Audio/lia_capture_pawn_04.m4a", "duration": 3.458}, {"id": "lia_player_loses_rook_03", "role": "lia", "category": "player_loses_rook", "text": "你拿得很准，偏偏是最不该丢的那枚。", "src": "../Audio/lia_player_loses_rook_03.m4a", "duration": 3.812}, {"id": "lia_player_loses_rook_04", "role": "lia", "category": "player_loses_rook", "text": "这笔交换不便宜。你赢得很实在。", "src": "../Audio/lia_player_loses_rook_04.m4a", "duration": 3.983}, {"id": "lia_player_loses_queen_03", "role": "lia", "category": "player_loses_queen", "text": "这一口太重，我要把棋盘重新拼起来。", "src": "../Audio/lia_player_loses_queen_03.m4a", "duration": 3.33}, {"id": "lia_player_loses_queen_04", "role": "lia", "category": "player_loses_queen", "text": "你抓住了后。漂亮，别让这份礼物白拿。", "src": "../Audio/lia_player_loses_queen_04.m4a", "duration": 4.439}, {"id": "lia_tactic_discovered_attack_01", "role": "lia", "category": "tactic_discovered_attack", "text": "你把前面的子移开，后面的线终于开口了。", "src": "../Audio/lia_tactic_discovered_attack_01.m4a", "duration": 4.14}, {"id": "lia_tactic_discovered_attack_02", "role": "lia", "category": "tactic_discovered_attack", "text": "一道暗线醒了。棋盘比刚才锋利。", "src": "../Audio/lia_tactic_discovered_attack_02.m4a", "duration": 3.33}, {"id": "lia_tactic_discovered_attack_03", "role": "lia", "category": "tactic_discovered_attack", "text": "这不是移动，是揭幕。", "src": "../Audio/lia_tactic_discovered_attack_03.m4a", "duration": 2.092}, {"id": "lia_tactic_discovered_attack_04", "role": "lia", "category": "tactic_discovered_attack", "text": "后手的威胁，现在露面了。", "src": "../Audio/lia_tactic_discovered_attack_04.m4a", "duration": 2.732}, {"id": "lia_tactic_zwischenzug_01", "role": "lia", "category": "tactic_zwischenzug", "text": "先别急着换。你在中间塞进了一句更重要的话。", "src": "../Audio/lia_tactic_zwischenzug_01.m4a", "duration": 3.372}, {"id": "lia_tactic_zwischenzug_02", "role": "lia", "category": "tactic_zwischenzug", "text": "这一下很细。真正的顺序，被你看见了。", "src": "../Audio/lia_tactic_zwischenzug_02.m4a", "duration": 4.098}, {"id": "lia_tactic_zwischenzug_03", "role": "lia", "category": "tactic_zwischenzug", "text": "交换可以等，威胁不能。", "src": "../Audio/lia_tactic_zwischenzug_03.m4a", "duration": 2.476}, {"id": "lia_tactic_zwischenzug_04", "role": "lia", "category": "tactic_zwischenzug", "text": "好的中间手，常常只差这一拍。", "src": "../Audio/lia_tactic_zwischenzug_04.m4a", "duration": 3.13}, {"id": "lia_key_threat_01", "role": "lia", "category": "key_threat", "text": "我已经把问题摆到你面前了。", "src": "../Audio/lia_key_threat_01.m4a", "duration": 2.263}, {"id": "lia_key_threat_02", "role": "lia", "category": "key_threat", "text": "这不是普通的威胁，下一拍会更难看。", "src": "../Audio/lia_key_threat_02.m4a", "duration": 3.599}, {"id": "lia_key_threat_03", "role": "lia", "category": "key_threat", "text": "看清楚，棋盘上有一处正在倒计时。", "src": "../Audio/lia_key_threat_03.m4a", "duration": 3.343}, {"id": "lia_key_threat_04", "role": "lia", "category": "key_threat", "text": "现在轮到你决定，守哪一边。", "src": "../Audio/lia_key_threat_04.m4a", "duration": 2.831}, {"id": "lia_check_01", "role": "lia", "category": "check", "text": "将军。请把注意力收回来。", "src": "../Audio/lia_check_01.m4a", "duration": 2.562}, {"id": "lia_check_02", "role": "lia", "category": "check", "text": "王被叫住了，计划先暂停。", "src": "../Audio/lia_check_02.m4a", "duration": 2.49}, {"id": "lia_check_03", "role": "lia", "category": "check", "text": "这不是提醒，是必须回答的问题。", "src": "../Audio/lia_check_03.m4a", "duration": 3.13}, {"id": "lia_check_04", "role": "lia", "category": "check", "text": "将军落下，棋盘只给你几秒钟的选择。", "src": "../Audio/lia_check_04.m4a", "duration": 3.556}, {"id": "lia_player_check_01", "role": "lia", "category": "player_check", "text": "将军收到。很好，现在看你的后续。", "src": "../Audio/lia_player_check_01.m4a", "duration": 5.092}, {"id": "lia_player_check_02", "role": "lia", "category": "player_check", "text": "这一声有分量，我先处理王的安全。", "src": "../Audio/lia_player_check_02.m4a", "duration": 3.343}, {"id": "lia_player_check_03", "role": "lia", "category": "player_check", "text": "你把问题递过来了，我会原样还回去。", "src": "../Audio/lia_player_check_03.m4a", "duration": 2.818}, {"id": "lia_player_check_04", "role": "lia", "category": "player_check", "text": "王被你叫住一会儿，棋局还没有改判。", "src": "../Audio/lia_player_check_04.m4a", "duration": 3.202}, {"id": "lia_missed_mate_03", "role": "lia", "category": "missed_mate", "text": "这一刻少了一拍，最锋利的刀就钝了。", "src": "../Audio/lia_missed_mate_03.m4a", "duration": 3.684}, {"id": "lia_missed_mate_04", "role": "lia", "category": "missed_mate", "text": "杀棋擦肩而过。别让它影响你的下一步。", "src": "../Audio/lia_missed_mate_04.m4a", "duration": 3.727}, {"id": "lia_blunder_into_mate_03", "role": "lia", "category": "blunder_into_mate", "text": "没有回头路了。这个漏洞太深。", "src": "../Audio/lia_blunder_into_mate_03.m4a", "duration": 2.874}, {"id": "lia_blunder_into_mate_04", "role": "lia", "category": "blunder_into_mate", "text": "将杀已经写在这里，你只是替它落了笔。", "src": "../Audio/lia_blunder_into_mate_04.m4a", "duration": 3.842}, {"id": "lia_mate_03", "role": "lia", "category": "mate", "text": "这一幕到这里，确实没有续集。", "src": "../Audio/lia_mate_03.m4a", "duration": 2.618}, {"id": "lia_mate_04", "role": "lia", "category": "mate", "text": "将杀。你把最后一道门也关上了。", "src": "../Audio/lia_mate_04.m4a", "duration": 3.202}, {"id": "lia_castling_01", "role": "lia", "category": "castling", "text": "王先安顿，车再说话。", "src": "../Audio/lia_castling_01.m4a", "duration": 2.263}, {"id": "lia_castling_02", "role": "lia", "category": "castling", "text": "易位完成。安全感和进攻线一起到位。", "src": "../Audio/lia_castling_02.m4a", "duration": 3.244}, {"id": "lia_castling_03", "role": "lia", "category": "castling", "text": "这次搬家很及时，王终于有了位置。", "src": "../Audio/lia_castling_03.m4a", "duration": 3.428}, {"id": "lia_castling_04", "role": "lia", "category": "castling", "text": "王车换位，下一幕可以开始了。", "src": "../Audio/lia_castling_04.m4a", "duration": 3.031}, {"id": "lia_promotion_01", "role": "lia", "category": "promotion", "text": "升变。小兵终于拿到它应得的名字。", "src": "../Audio/lia_promotion_01.m4a", "duration": 3.031}, {"id": "lia_promotion_02", "role": "lia", "category": "promotion", "text": "走到尽头，棋子换了身份，威胁也换了形状。", "src": "../Audio/lia_promotion_02.m4a", "duration": 4.879}, {"id": "lia_promotion_03", "role": "lia", "category": "promotion", "text": "新子登场。残局突然不再谦虚。", "src": "../Audio/lia_promotion_03.m4a", "duration": 3.599}, {"id": "lia_promotion_04", "role": "lia", "category": "promotion", "text": "升变完成。别眨眼，局面已经换频道。", "src": "../Audio/lia_promotion_04.m4a", "duration": 4.226}, {"id": "lia_queen_early_01", "role": "lia", "category": "queen_early", "text": "后出得很早。希望你已经替它安排好回程。", "src": "../Audio/lia_queen_early_01.m4a", "duration": 3.586}, {"id": "lia_queen_early_02", "role": "lia", "category": "queen_early", "text": "别急着让后单独工作，它会被棋盘追问。", "src": "../Audio/lia_queen_early_02.m4a", "duration": 3.386}, {"id": "lia_queen_early_03", "role": "lia", "category": "queen_early", "text": "贵客提前登场，可惜全场都在盯着它。", "src": "../Audio/lia_queen_early_03.m4a", "duration": 3.458}, {"id": "lia_queen_early_04", "role": "lia", "category": "queen_early", "text": "出后太早，节奏先交了一半。", "src": "../Audio/lia_queen_early_04.m4a", "duration": 2.434}, {"id": "lia_defense_found_01", "role": "lia", "category": "defense_found", "text": "守住了。你没有被第一眼的威胁骗走。", "src": "../Audio/lia_defense_found_01.m4a", "duration": 3.628}, {"id": "lia_defense_found_02", "role": "lia", "category": "defense_found", "text": "好防守，最危险的地方被你封住了。", "src": "../Audio/lia_defense_found_02.m4a", "duration": 4.14}, {"id": "lia_defense_found_03", "role": "lia", "category": "defense_found", "text": "这一手不抢戏，却救了整盘棋。", "src": "../Audio/lia_defense_found_03.m4a", "duration": 3.471}, {"id": "lia_defense_found_04", "role": "lia", "category": "defense_found", "text": "你找到了唯一不崩的办法。", "src": "../Audio/lia_defense_found_04.m4a", "duration": 1.879}, {"id": "lia_player_missed_tactic_01", "role": "lia", "category": "player_missed_tactic", "text": "机会来过，只是停得太短。", "src": "../Audio/lia_player_missed_tactic_01.m4a", "duration": 2.476}, {"id": "lia_player_missed_tactic_02", "role": "lia", "category": "player_missed_tactic", "text": "这条线本来可以更锋利。", "src": "../Audio/lia_player_missed_tactic_02.m4a", "duration": 1.922}, {"id": "lia_player_missed_tactic_03", "role": "lia", "category": "player_missed_tactic", "text": "你看见了棋子，没看见它们之间的关系。", "src": "../Audio/lia_player_missed_tactic_03.m4a", "duration": 4.794}, {"id": "lia_player_missed_tactic_04", "role": "lia", "category": "player_missed_tactic", "text": "好的战术不会一直等人，下一次要快半拍。", "src": "../Audio/lia_player_missed_tactic_04.m4a", "duration": 3.471}, {"id": "lia_comeback_03", "role": "lia", "category": "comeback", "text": "绝境里找到这一步，难得。现在重新开始。", "src": "../Audio/lia_comeback_03.m4a", "duration": 4.239}, {"id": "lia_comeback_04", "role": "lia", "category": "comeback", "text": "局面翻回来了。别浪费第二次机会。", "src": "../Audio/lia_comeback_04.m4a", "duration": 2.788}, {"id": "xiaoyou_opening_book_entry_01", "role": "xiaoyou", "category": "opening_book_entry", "text": "这段开局我也很喜欢，走得稳稳的。", "src": "Audio/xiaoyou/xiaoyou_opening_book_entry_01.m4a", "duration": 2.988}, {"id": "xiaoyou_opening_book_entry_02", "role": "xiaoyou", "category": "opening_book_entry", "text": "熟悉的路呀，你准备得不错。", "src": "Audio/xiaoyou/xiaoyou_opening_book_entry_02.m4a", "duration": 2.348}, {"id": "xiaoyou_opening_book_entry_03", "role": "xiaoyou", "category": "opening_book_entry", "text": "棋子都到舒服的位置了，真好。", "src": "Audio/xiaoyou/xiaoyou_opening_book_entry_03.m4a", "duration": 2.753}, {"id": "xiaoyou_opening_book_entry_04", "role": "xiaoyou", "category": "opening_book_entry", "text": "开局功课做得很认真嘛。", "src": "Audio/xiaoyou/xiaoyou_opening_book_entry_04.m4a", "duration": 2.052}, {"id": "xiaoyou_opening_book_exit_01", "role": "xiaoyou", "category": "opening_book_exit", "text": "走出棋谱啦，慢慢想就好。", "src": "Audio/xiaoyou/xiaoyou_opening_book_exit_01.m4a", "duration": 2.478}, {"id": "xiaoyou_opening_book_exit_02", "role": "xiaoyou", "category": "opening_book_exit", "text": "接下来没有现成答案，我们一起算。", "src": "Audio/xiaoyou/xiaoyou_opening_book_exit_02.m4a", "duration": 2.66}, {"id": "xiaoyou_opening_book_exit_03", "role": "xiaoyou", "category": "opening_book_exit", "text": "熟悉的路到这里，后面靠你的判断。", "src": "Audio/xiaoyou/xiaoyou_opening_book_exit_03.m4a", "duration": 3.186}, {"id": "xiaoyou_opening_book_exit_04", "role": "xiaoyou", "category": "opening_book_exit", "text": "新局面也别紧张，先看看双方威胁。", "src": "Audio/xiaoyou/xiaoyou_opening_book_exit_04.m4a", "duration": 3.3}, {"id": "xiaoyou_player_accurate_01", "role": "xiaoyou", "category": "player_accurate", "text": "这一手很细心，我看到了。", "src": "Audio/xiaoyou/xiaoyou_player_accurate_01.m4a", "duration": 2.363}, {"id": "xiaoyou_player_accurate_02", "role": "xiaoyou", "category": "player_accurate", "text": "你把那个小问题照顾好了。", "src": "Audio/xiaoyou/xiaoyou_player_accurate_02.m4a", "duration": 1.955}, {"id": "xiaoyou_player_accurate_03", "role": "xiaoyou", "category": "player_accurate", "text": "走得踏实，心里是不是也有底了？", "src": "Audio/xiaoyou/xiaoyou_player_accurate_03.m4a", "duration": 2.853}, {"id": "xiaoyou_player_accurate_04", "role": "xiaoyou", "category": "player_accurate", "text": "没漏掉细节，真不错。", "src": "Audio/xiaoyou/xiaoyou_player_accurate_04.m4a", "duration": 2.03}, {"id": "xiaoyou_player_best_01", "role": "xiaoyou", "category": "player_best", "text": "就是这一步，你找到了！", "src": "Audio/xiaoyou/xiaoyou_player_best_01.m4a", "duration": 1.976}, {"id": "xiaoyou_player_best_02", "role": "xiaoyou", "category": "player_best", "text": "这题被你解开啦。", "src": "Audio/xiaoyou/xiaoyou_player_best_02.m4a", "duration": 1.426}, {"id": "xiaoyou_player_best_03", "role": "xiaoyou", "category": "player_best", "text": "好棋，重要的地方一点都没放松。", "src": "Audio/xiaoyou/xiaoyou_player_best_03.m4a", "duration": 3.122}, {"id": "xiaoyou_player_best_04", "role": "xiaoyou", "category": "player_best", "text": "你选对了，我得好好想想。", "src": "Audio/xiaoyou/xiaoyou_player_best_04.m4a", "duration": 2.302}, {"id": "xiaoyou_player_brilliant_01", "role": "xiaoyou", "category": "player_brilliant", "text": "哇，这个想法真漂亮！", "src": "Audio/xiaoyou/xiaoyou_player_brilliant_01.m4a", "duration": 2.03}, {"id": "xiaoyou_player_brilliant_02", "role": "xiaoyou", "category": "player_brilliant", "text": "我刚明白过来，你已经算到这里啦。", "src": "Audio/xiaoyou/xiaoyou_player_brilliant_02.m4a", "duration": 2.814}, {"id": "xiaoyou_player_brilliant_03", "role": "xiaoyou", "category": "player_brilliant", "text": "舍得付出，又算得清楚，真棒。", "src": "Audio/xiaoyou/xiaoyou_player_brilliant_03.m4a", "duration": 3.104}, {"id": "xiaoyou_player_brilliant_04", "role": "xiaoyou", "category": "player_brilliant", "text": "这一步值得你为自己开心一下。", "src": "Audio/xiaoyou/xiaoyou_player_brilliant_04.m4a", "duration": 2.427}, {"id": "xiaoyou_player_brilliant_05", "role": "xiaoyou", "category": "player_brilliant", "text": "这么难的想法也被你找到了呀。", "src": "Audio/xiaoyou/xiaoyou_player_brilliant_05.m4a", "duration": 2.576}, {"id": "xiaoyou_lia_best_move_01", "role": "xiaoyou", "category": "lia_best_move", "text": "这回我找到一个好办法啦。", "src": "Audio/xiaoyou/xiaoyou_lia_best_move_01.m4a", "duration": 2.173}, {"id": "xiaoyou_lia_best_move_02", "role": "xiaoyou", "category": "lia_best_move", "text": "我先把这个问题留给你。", "src": "Audio/xiaoyou/xiaoyou_lia_best_move_02.m4a", "duration": 1.97}, {"id": "xiaoyou_lia_best_move_03", "role": "xiaoyou", "category": "lia_best_move", "text": "我的棋子也配合起来了，小心接招。", "src": "Audio/xiaoyou/xiaoyou_lia_best_move_03.m4a", "duration": 3.068}, {"id": "xiaoyou_lia_best_move_04", "role": "xiaoyou", "category": "lia_best_move", "text": "这一手我想得挺认真哦。", "src": "Audio/xiaoyou/xiaoyou_lia_best_move_04.m4a", "duration": 1.958}, {"id": "xiaoyou_capture_pawn_01", "role": "xiaoyou", "category": "capture_pawn", "text": "你的小兵，我先收下啦。", "src": "Audio/xiaoyou/xiaoyou_capture_pawn_01.m4a", "duration": 1.876}, {"id": "xiaoyou_capture_pawn_02", "role": "xiaoyou", "category": "capture_pawn", "text": "这一兵很小，也要记在账上。", "src": "Audio/xiaoyou/xiaoyou_capture_pawn_02.m4a", "duration": 2.209}, {"id": "xiaoyou_capture_pawn_03", "role": "xiaoyou", "category": "capture_pawn", "text": "我拿到一枚兵，咱们继续。", "src": "Audio/xiaoyou/xiaoyou_capture_pawn_03.m4a", "duration": 2.13}, {"id": "xiaoyou_capture_pawn_04", "role": "xiaoyou", "category": "capture_pawn", "text": "小兵掉队了，下次记得照顾它。", "src": "Audio/xiaoyou/xiaoyou_capture_pawn_04.m4a", "duration": 2.871}, {"id": "xiaoyou_capture_minor_01", "role": "xiaoyou", "category": "capture_minor", "text": "这枚轻子暂时交给我吧。", "src": "Audio/xiaoyou/xiaoyou_capture_minor_01.m4a", "duration": 2.245}, {"id": "xiaoyou_capture_minor_02", "role": "xiaoyou", "category": "capture_minor", "text": "我吃到一个轻子，下一步更要细心。", "src": "Audio/xiaoyou/xiaoyou_capture_minor_02.m4a", "duration": 3.046}, {"id": "xiaoyou_capture_minor_03", "role": "xiaoyou", "category": "capture_minor", "text": "你少了一员帮手，别再漏看保护啦。", "src": "Audio/xiaoyou/xiaoyou_capture_minor_03.m4a", "duration": 3.046}, {"id": "xiaoyou_capture_minor_04", "role": "xiaoyou", "category": "capture_minor", "text": "这次我拿到了马或象，慢慢稳住。", "src": "Audio/xiaoyou/xiaoyou_capture_minor_04.m4a", "duration": 3.028}, {"id": "xiaoyou_capture_rook_01", "role": "xiaoyou", "category": "capture_rook", "text": "你的车被我拿到了，要小心啦。", "src": "Audio/xiaoyou/xiaoyou_capture_rook_01.m4a", "duration": 2.638}, {"id": "xiaoyou_capture_rook_02", "role": "xiaoyou", "category": "capture_rook", "text": "这一车分量不轻呢。", "src": "Audio/xiaoyou/xiaoyou_capture_rook_02.m4a", "duration": 1.858}, {"id": "xiaoyou_capture_rook_03", "role": "xiaoyou", "category": "capture_rook", "text": "我先收下这辆车，别急着乱了节奏。", "src": "Audio/xiaoyou/xiaoyou_capture_rook_03.m4a", "duration": 2.832}, {"id": "xiaoyou_capture_rook_04", "role": "xiaoyou", "category": "capture_rook", "text": "重子少了一枚，咱们重新看局面。", "src": "Audio/xiaoyou/xiaoyou_capture_rook_04.m4a", "duration": 2.774}, {"id": "xiaoyou_capture_queen_01", "role": "xiaoyou", "category": "capture_queen", "text": "你的后被吃啦，先别慌。", "src": "Audio/xiaoyou/xiaoyou_capture_queen_01.m4a", "duration": 2.224}, {"id": "xiaoyou_capture_queen_02", "role": "xiaoyou", "category": "capture_queen", "text": "后交给我了，剩下的棋也认真下。", "src": "Audio/xiaoyou/xiaoyou_capture_queen_02.m4a", "duration": 2.856}, {"id": "xiaoyou_capture_queen_03", "role": "xiaoyou", "category": "capture_queen", "text": "这一口有点重，深呼吸再继续。", "src": "Audio/xiaoyou/xiaoyou_capture_queen_03.m4a", "duration": 2.932}, {"id": "xiaoyou_capture_queen_04", "role": "xiaoyou", "category": "capture_queen", "text": "我拿到后了，这个教训记住就好。", "src": "Audio/xiaoyou/xiaoyou_capture_queen_04.m4a", "duration": 2.747}, {"id": "xiaoyou_player_loses_minor_01", "role": "xiaoyou", "category": "player_loses_minor", "text": "我的轻子被你抓到了呀。", "src": "Audio/xiaoyou/xiaoyou_player_loses_minor_01.m4a", "duration": 1.919}, {"id": "xiaoyou_player_loses_minor_02", "role": "xiaoyou", "category": "player_loses_minor", "text": "这一枚你拿得很仔细。", "src": "Audio/xiaoyou/xiaoyou_player_loses_minor_02.m4a", "duration": 1.916}, {"id": "xiaoyou_player_loses_minor_03", "role": "xiaoyou", "category": "player_loses_minor", "text": "哎，我少了一个帮手，你抓得准。", "src": "Audio/xiaoyou/xiaoyou_player_loses_minor_03.m4a", "duration": 2.735}, {"id": "xiaoyou_player_loses_minor_04", "role": "xiaoyou", "category": "player_loses_minor", "text": "这回轮到我重新想办法啦。", "src": "Audio/xiaoyou/xiaoyou_player_loses_minor_04.m4a", "duration": 2.678}, {"id": "xiaoyou_player_loses_rook_01", "role": "xiaoyou", "category": "player_loses_rook", "text": "我的车让你拿走了，真有一套。", "src": "Audio/xiaoyou/xiaoyou_player_loses_rook_01.m4a", "duration": 2.753}, {"id": "xiaoyou_player_loses_rook_02", "role": "xiaoyou", "category": "player_loses_rook", "text": "你抓到了重子，做得好。", "src": "Audio/xiaoyou/xiaoyou_player_loses_rook_02.m4a", "duration": 2.03}, {"id": "xiaoyou_player_loses_rook_03", "role": "xiaoyou", "category": "player_loses_rook", "text": "这辆车没守住，我得补补防线。", "src": "Audio/xiaoyou/xiaoyou_player_loses_rook_03.m4a", "duration": 2.442}, {"id": "xiaoyou_player_loses_rook_04", "role": "xiaoyou", "category": "player_loses_rook", "text": "这一口吃得实在，我记住啦。", "src": "Audio/xiaoyou/xiaoyou_player_loses_rook_04.m4a", "duration": 2.363}, {"id": "xiaoyou_player_loses_queen_01", "role": "xiaoyou", "category": "player_loses_queen", "text": "我的后呀，你真的抓到了！", "src": "Audio/xiaoyou/xiaoyou_player_loses_queen_01.m4a", "duration": 2.284}, {"id": "xiaoyou_player_loses_queen_02", "role": "xiaoyou", "category": "player_loses_queen", "text": "这次是我漏看了，你抓得很准。", "src": "Audio/xiaoyou/xiaoyou_player_loses_queen_02.m4a", "duration": 2.792}, {"id": "xiaoyou_player_loses_queen_03", "role": "xiaoyou", "category": "player_loses_queen", "text": "少了后，我得认真想想怎么下。", "src": "Audio/xiaoyou/xiaoyou_player_loses_queen_03.m4a", "duration": 2.499}, {"id": "xiaoyou_player_loses_queen_04", "role": "xiaoyou", "category": "player_loses_queen", "text": "这么大的机会你没放过，真好。", "src": "Audio/xiaoyou/xiaoyou_player_loses_queen_04.m4a", "duration": 2.732}, {"id": "xiaoyou_tactic_fork_01", "role": "xiaoyou", "category": "tactic_fork", "text": "两个目标一起被盯上了呢。", "src": "Audio/xiaoyou/xiaoyou_tactic_fork_01.m4a", "duration": 2.001}, {"id": "xiaoyou_tactic_fork_02", "role": "xiaoyou", "category": "tactic_fork", "text": "双捉出现啦，不能只看一边。", "src": "Audio/xiaoyou/xiaoyou_tactic_fork_02.m4a", "duration": 2.463}, {"id": "xiaoyou_tactic_fork_03", "role": "xiaoyou", "category": "tactic_fork", "text": "这一手同时问了两个问题。", "src": "Audio/xiaoyou/xiaoyou_tactic_fork_03.m4a", "duration": 2.088}, {"id": "xiaoyou_tactic_fork_04", "role": "xiaoyou", "category": "tactic_fork", "text": "两枚棋子都要照顾，有点难办啦。", "src": "Audio/xiaoyou/xiaoyou_tactic_fork_04.m4a", "duration": 3.418}, {"id": "xiaoyou_tactic_pin_01", "role": "xiaoyou", "category": "tactic_pin", "text": "这枚子被牵住了，动之前想一想。", "src": "Audio/xiaoyou/xiaoyou_tactic_pin_01.m4a", "duration": 3.028}, {"id": "xiaoyou_tactic_pin_02", "role": "xiaoyou", "category": "tactic_pin", "text": "前后连在一起，这里不能随便挪。", "src": "Audio/xiaoyou/xiaoyou_tactic_pin_02.m4a", "duration": 2.892}, {"id": "xiaoyou_tactic_pin_03", "role": "xiaoyou", "category": "tactic_pin", "text": "牵制的线拉紧啦。", "src": "Audio/xiaoyou/xiaoyou_tactic_pin_03.m4a", "duration": 1.701}, {"id": "xiaoyou_tactic_pin_04", "role": "xiaoyou", "category": "tactic_pin", "text": "身后还有重要棋子，它得留下来保护。", "src": "Audio/xiaoyou/xiaoyou_tactic_pin_04.m4a", "duration": 3.344}, {"id": "xiaoyou_tactic_discovered_attack_01", "role": "xiaoyou", "category": "tactic_discovered_attack", "text": "前面的子一走，后面的力量就出来啦。", "src": "Audio/xiaoyou/xiaoyou_tactic_discovered_attack_01.m4a", "duration": 3.068}, {"id": "xiaoyou_tactic_discovered_attack_02", "role": "xiaoyou", "category": "tactic_discovered_attack", "text": "藏着的那条线被打开了。", "src": "Audio/xiaoyou/xiaoyou_tactic_discovered_attack_02.m4a", "duration": 2.148}, {"id": "xiaoyou_tactic_discovered_attack_03", "role": "xiaoyou", "category": "tactic_discovered_attack", "text": "原来真正的帮手一直站在后面呀。", "src": "Audio/xiaoyou/xiaoyou_tactic_discovered_attack_03.m4a", "duration": 3.007}, {"id": "xiaoyou_tactic_discovered_attack_04", "role": "xiaoyou", "category": "tactic_discovered_attack", "text": "两枚棋子配合得更好了。", "src": "Audio/xiaoyou/xiaoyou_tactic_discovered_attack_04.m4a", "duration": 2.07}, {"id": "xiaoyou_tactic_zwischenzug_01", "role": "xiaoyou", "category": "tactic_zwischenzug", "text": "你先插了这一手，真细心。", "src": "Audio/xiaoyou/xiaoyou_tactic_zwischenzug_01.m4a", "duration": 2.224}, {"id": "xiaoyou_tactic_zwischenzug_02", "role": "xiaoyou", "category": "tactic_zwischenzug", "text": "先处理更重要的事，顺序找对啦。", "src": "Audio/xiaoyou/xiaoyou_tactic_zwischenzug_02.m4a", "duration": 3.068}, {"id": "xiaoyou_tactic_zwischenzug_03", "role": "xiaoyou", "category": "tactic_zwischenzug", "text": "交换不急，你还看到了别的机会。", "src": "Audio/xiaoyou/xiaoyou_tactic_zwischenzug_03.m4a", "duration": 2.753}, {"id": "xiaoyou_tactic_zwischenzug_04", "role": "xiaoyou", "category": "tactic_zwischenzug", "text": "中间多想一步，收获就不同了。", "src": "Audio/xiaoyou/xiaoyou_tactic_zwischenzug_04.m4a", "duration": 3.007}, {"id": "xiaoyou_tactic_sacrifice_01", "role": "xiaoyou", "category": "tactic_sacrifice", "text": "这枚子付出去，是有打算的呀。", "src": "Audio/xiaoyou/xiaoyou_tactic_sacrifice_01.m4a", "duration": 2.753}, {"id": "xiaoyou_tactic_sacrifice_02", "role": "xiaoyou", "category": "tactic_sacrifice", "text": "你用一点子力换来了机会。", "src": "Audio/xiaoyou/xiaoyou_tactic_sacrifice_02.m4a", "duration": 2.288}, {"id": "xiaoyou_tactic_sacrifice_03", "role": "xiaoyou", "category": "tactic_sacrifice", "text": "敢舍也算得清，这就漂亮啦。", "src": "Audio/xiaoyou/xiaoyou_tactic_sacrifice_03.m4a", "duration": 2.756}, {"id": "xiaoyou_tactic_sacrifice_04", "role": "xiaoyou", "category": "tactic_sacrifice", "text": "这次付出有回报，你看得很远。", "src": "Audio/xiaoyou/xiaoyou_tactic_sacrifice_04.m4a", "duration": 2.409}, {"id": "xiaoyou_key_threat_01", "role": "xiaoyou", "category": "key_threat", "text": "我这边有个威胁，你要认真看看。", "src": "Audio/xiaoyou/xiaoyou_key_threat_01.m4a", "duration": 2.753}, {"id": "xiaoyou_key_threat_02", "role": "xiaoyou", "category": "key_threat", "text": "这一处不能再拖啦。", "src": "Audio/xiaoyou/xiaoyou_key_threat_02.m4a", "duration": 1.758}, {"id": "xiaoyou_key_threat_03", "role": "xiaoyou", "category": "key_threat", "text": "先处理这个问题，再想自己的计划。", "src": "Audio/xiaoyou/xiaoyou_key_threat_03.m4a", "duration": 2.853}, {"id": "xiaoyou_key_threat_04", "role": "xiaoyou", "category": "key_threat", "text": "我的下一步有点凶，留心哦。", "src": "Audio/xiaoyou/xiaoyou_key_threat_04.m4a", "duration": 3.068}, {"id": "xiaoyou_check_01", "role": "xiaoyou", "category": "check", "text": "将军啦，先照顾你的王。", "src": "Audio/xiaoyou/xiaoyou_check_01.m4a", "duration": 2.424}, {"id": "xiaoyou_check_02", "role": "xiaoyou", "category": "check", "text": "你的王被点到了，找个好回答。", "src": "Audio/xiaoyou/xiaoyou_check_02.m4a", "duration": 2.56}, {"id": "xiaoyou_check_03", "role": "xiaoyou", "category": "check", "text": "这一手要先应将哦。", "src": "Audio/xiaoyou/xiaoyou_check_03.m4a", "duration": 1.934}, {"id": "xiaoyou_check_04", "role": "xiaoyou", "category": "check", "text": "我将军了，别急，看看能怎么挡。", "src": "Audio/xiaoyou/xiaoyou_check_04.m4a", "duration": 3.003}, {"id": "xiaoyou_player_check_01", "role": "xiaoyou", "category": "player_check", "text": "你将军了，我来想办法。", "src": "Audio/xiaoyou/xiaoyou_player_check_01.m4a", "duration": 2.091}, {"id": "xiaoyou_player_check_02", "role": "xiaoyou", "category": "player_check", "text": "这一下把我的王叫醒啦。", "src": "Audio/xiaoyou/xiaoyou_player_check_02.m4a", "duration": 2.638}, {"id": "xiaoyou_player_check_03", "role": "xiaoyou", "category": "player_check", "text": "王要先躲一躲，后面再说。", "src": "Audio/xiaoyou/xiaoyou_player_check_03.m4a", "duration": 2.188}, {"id": "xiaoyou_player_check_04", "role": "xiaoyou", "category": "player_check", "text": "收到这个将军，我认真接着。", "src": "Audio/xiaoyou/xiaoyou_player_check_04.m4a", "duration": 2.463}, {"id": "xiaoyou_missed_mate_01", "role": "xiaoyou", "category": "missed_mate", "text": "刚才其实有将杀，可惜错过啦。", "src": "Audio/xiaoyou/xiaoyou_missed_mate_01.m4a", "duration": 2.735}, {"id": "xiaoyou_missed_mate_02", "role": "xiaoyou", "category": "missed_mate", "text": "胜利就差一点点，先别懊恼。", "src": "Audio/xiaoyou/xiaoyou_missed_mate_02.m4a", "duration": 2.692}, {"id": "xiaoyou_missed_mate_03", "role": "xiaoyou", "category": "missed_mate", "text": "那条杀棋走掉了，下次多看一眼。", "src": "Audio/xiaoyou/xiaoyou_missed_mate_03.m4a", "duration": 2.986}, {"id": "xiaoyou_missed_mate_04", "role": "xiaoyou", "category": "missed_mate", "text": "本来能结束的，咱们记住这个机会。", "src": "Audio/xiaoyou/xiaoyou_missed_mate_04.m4a", "duration": 2.656}, {"id": "xiaoyou_blunder_into_mate_01", "role": "xiaoyou", "category": "blunder_into_mate", "text": "这一步让王陷进必杀了。", "src": "Audio/xiaoyou/xiaoyou_blunder_into_mate_01.m4a", "duration": 2.17}, {"id": "xiaoyou_blunder_into_mate_02", "role": "xiaoyou", "category": "blunder_into_mate", "text": "哎，退路被关上了。", "src": "Audio/xiaoyou/xiaoyou_blunder_into_mate_02.m4a", "duration": 2.188}, {"id": "xiaoyou_blunder_into_mate_03", "role": "xiaoyou", "category": "blunder_into_mate", "text": "这个漏洞会通向将杀，记住它吧。", "src": "Audio/xiaoyou/xiaoyou_blunder_into_mate_03.m4a", "duration": 3.222}, {"id": "xiaoyou_blunder_into_mate_04", "role": "xiaoyou", "category": "blunder_into_mate", "text": "王走进了危险的结尾，可惜啦。", "src": "Audio/xiaoyou/xiaoyou_blunder_into_mate_04.m4a", "duration": 3.043}, {"id": "xiaoyou_mate_01", "role": "xiaoyou", "category": "mate", "text": "将杀啦，我们复盘看看吧。", "src": "Audio/xiaoyou/xiaoyou_mate_01.m4a", "duration": 2.402}, {"id": "xiaoyou_mate_02", "role": "xiaoyou", "category": "mate", "text": "这盘结束了，谢谢你认真下完。", "src": "Audio/xiaoyou/xiaoyou_mate_02.m4a", "duration": 2.871}, {"id": "xiaoyou_mate_03", "role": "xiaoyou", "category": "mate", "text": "你的王没有路了，下局再试。", "src": "Audio/xiaoyou/xiaoyou_mate_03.m4a", "duration": 2.732}, {"id": "xiaoyou_mate_04", "role": "xiaoyou", "category": "mate", "text": "最后这步完成了将杀。", "src": "Audio/xiaoyou/xiaoyou_mate_04.m4a", "duration": 2.03}, {"id": "xiaoyou_castling_01", "role": "xiaoyou", "category": "castling", "text": "易位完成，王先住稳啦。", "src": "Audio/xiaoyou/xiaoyou_castling_01.m4a", "duration": 2.871}, {"id": "xiaoyou_castling_02", "role": "xiaoyou", "category": "castling", "text": "王安顿好，车也能帮忙了。", "src": "Audio/xiaoyou/xiaoyou_castling_02.m4a", "duration": 2.345}, {"id": "xiaoyou_castling_03", "role": "xiaoyou", "category": "castling", "text": "这次搬家很及时呢。", "src": "Audio/xiaoyou/xiaoyou_castling_03.m4a", "duration": 1.722}, {"id": "xiaoyou_castling_04", "role": "xiaoyou", "category": "castling", "text": "王和车一起就位，继续加油。", "src": "Audio/xiaoyou/xiaoyou_castling_04.m4a", "duration": 2.576}, {"id": "xiaoyou_promotion_01", "role": "xiaoyou", "category": "promotion", "text": "升变啦，小兵终于长大了。", "src": "Audio/xiaoyou/xiaoyou_promotion_01.m4a", "duration": 2.656}, {"id": "xiaoyou_promotion_02", "role": "xiaoyou", "category": "promotion", "text": "一路走到底，换来新的力量。", "src": "Audio/xiaoyou/xiaoyou_promotion_02.m4a", "duration": 2.463}, {"id": "xiaoyou_promotion_03", "role": "xiaoyou", "category": "promotion", "text": "这枚兵没白努力呀。", "src": "Audio/xiaoyou/xiaoyou_promotion_03.m4a", "duration": 1.701}, {"id": "xiaoyou_promotion_04", "role": "xiaoyou", "category": "promotion", "text": "新的棋子来了，要重新算一算。", "src": "Audio/xiaoyou/xiaoyou_promotion_04.m4a", "duration": 2.424}, {"id": "xiaoyou_queen_early_01", "role": "xiaoyou", "category": "queen_early", "text": "后跑得有点早，其他棋子还没跟上。", "src": "Audio/xiaoyou/xiaoyou_queen_early_01.m4a", "duration": 2.968}, {"id": "xiaoyou_queen_early_02", "role": "xiaoyou", "category": "queen_early", "text": "别让后一个人忙呀。", "src": "Audio/xiaoyou/xiaoyou_queen_early_02.m4a", "duration": 1.58}, {"id": "xiaoyou_queen_early_03", "role": "xiaoyou", "category": "queen_early", "text": "先出后丢了节奏，可惜啦。", "src": "Audio/xiaoyou/xiaoyou_queen_early_03.m4a", "duration": 2.79}, {"id": "xiaoyou_queen_early_04", "role": "xiaoyou", "category": "queen_early", "text": "这位大帮手出来太早，容易被追呢。", "src": "Audio/xiaoyou/xiaoyou_queen_early_04.m4a", "duration": 2.735}, {"id": "xiaoyou_defense_found_01", "role": "xiaoyou", "category": "defense_found", "text": "守住啦，这一手很重要。", "src": "Audio/xiaoyou/xiaoyou_defense_found_01.m4a", "duration": 2.442}, {"id": "xiaoyou_defense_found_02", "role": "xiaoyou", "category": "defense_found", "text": "你没有慌，把最危险的地方挡住了。", "src": "Audio/xiaoyou/xiaoyou_defense_found_02.m4a", "duration": 3.107}, {"id": "xiaoyou_defense_found_03", "role": "xiaoyou", "category": "defense_found", "text": "这样的防守，也值得好好表扬。", "src": "Audio/xiaoyou/xiaoyou_defense_found_03.m4a", "duration": 2.499}, {"id": "xiaoyou_defense_found_04", "role": "xiaoyou", "category": "defense_found", "text": "能在压力下找到出路，真不容易。", "src": "Audio/xiaoyou/xiaoyou_defense_found_04.m4a", "duration": 2.871}, {"id": "xiaoyou_player_missed_tactic_01", "role": "xiaoyou", "category": "player_missed_tactic", "text": "这里有个战术机会，被你漏过啦。", "src": "Audio/xiaoyou/xiaoyou_player_missed_tactic_01.m4a", "duration": 2.599}, {"id": "xiaoyou_player_missed_tactic_02", "role": "xiaoyou", "category": "player_missed_tactic", "text": "别只看一枚子，想想它们的配合。", "src": "Audio/xiaoyou/xiaoyou_player_missed_tactic_02.m4a", "duration": 3.064}, {"id": "xiaoyou_player_missed_tactic_03", "role": "xiaoyou", "category": "player_missed_tactic", "text": "机会没等住，下次咱们看仔细些。", "src": "Audio/xiaoyou/xiaoyou_player_missed_tactic_03.m4a", "duration": 3.146}, {"id": "xiaoyou_player_missed_tactic_04", "role": "xiaoyou", "category": "player_missed_tactic", "text": "这一手本来还能多收获一点呢。", "src": "Audio/xiaoyou/xiaoyou_player_missed_tactic_04.m4a", "duration": 2.638}, {"id": "xiaoyou_comeback_01", "role": "xiaoyou", "category": "comeback", "text": "你一点点把局面追回来啦。", "src": "Audio/xiaoyou/xiaoyou_comeback_01.m4a", "duration": 2.732}, {"id": "xiaoyou_comeback_02", "role": "xiaoyou", "category": "comeback", "text": "还好没放弃，机会真的回来了。", "src": "Audio/xiaoyou/xiaoyou_comeback_02.m4a", "duration": 2.599}, {"id": "xiaoyou_comeback_03", "role": "xiaoyou", "category": "comeback", "text": "这段走得很有韧劲。", "src": "Audio/xiaoyou/xiaoyou_comeback_03.m4a", "duration": 1.816}, {"id": "xiaoyou_comeback_04", "role": "xiaoyou", "category": "comeback", "text": "从难处撑回来，真值得开心。", "src": "Audio/xiaoyou/xiaoyou_comeback_04.m4a", "duration": 2.491}, {"id": "leo_opening_book_entry_01", "role": "leo", "category": "opening_book_entry", "text": "开场的脚步很漂亮！", "src": "Audio/leo/leo_opening_book_entry_01.m4a", "duration": 1.538}, {"id": "leo_opening_book_entry_02", "role": "leo", "category": "opening_book_entry", "text": "熟悉的序曲，你踩准节奏了。", "src": "Audio/leo/leo_opening_book_entry_02.m4a", "duration": 2.309}, {"id": "leo_opening_book_entry_03", "role": "leo", "category": "opening_book_entry", "text": "这一段理论，演得很稳。", "src": "Audio/leo/leo_opening_book_entry_03.m4a", "duration": 2.112}, {"id": "leo_opening_book_entry_04", "role": "leo", "category": "opening_book_entry", "text": "好开局，舞台已经准备好了。", "src": "Audio/leo/leo_opening_book_entry_04.m4a", "duration": 2.563}, {"id": "leo_opening_book_exit_01", "role": "leo", "category": "opening_book_exit", "text": "剧本到此，接下来即兴！", "src": "Audio/leo/leo_opening_book_exit_01.m4a", "duration": 2.134}, {"id": "leo_opening_book_exit_02", "role": "leo", "category": "opening_book_exit", "text": "理论谢幕，真正的较量登场。", "src": "Audio/leo/leo_opening_book_exit_02.m4a", "duration": 2.517}, {"id": "leo_opening_book_exit_03", "role": "leo", "category": "opening_book_exit", "text": "没有提示词了，亮出你的主意吧。", "src": "Audio/leo/leo_opening_book_exit_03.m4a", "duration": 2.774}, {"id": "leo_opening_book_exit_04", "role": "leo", "category": "opening_book_exit", "text": "熟路走完，精彩现在开始。", "src": "Audio/leo/leo_opening_book_exit_04.m4a", "duration": 3.164}, {"id": "leo_player_accurate_01", "role": "leo", "category": "player_accurate", "text": "这一拍，准得漂亮。", "src": "Audio/leo/leo_player_accurate_01.m4a", "duration": 2.052}, {"id": "leo_player_accurate_02", "role": "leo", "category": "player_accurate", "text": "你把节奏拿捏住了。", "src": "Audio/leo/leo_player_accurate_02.m4a", "duration": 1.414}, {"id": "leo_player_accurate_03", "role": "leo", "category": "player_accurate", "text": "看似平静，细节全在。", "src": "Audio/leo/leo_player_accurate_03.m4a", "duration": 2.019}, {"id": "leo_player_accurate_04", "role": "leo", "category": "player_accurate", "text": "干净！没给我留多余的戏。", "src": "Audio/leo/leo_player_accurate_04.m4a", "duration": 1.98}, {"id": "leo_player_best_01", "role": "leo", "category": "player_best", "text": "正解登场！", "src": "Audio/leo/leo_player_best_01.m4a", "duration": 1.018}, {"id": "leo_player_best_02", "role": "leo", "category": "player_best", "text": "这一步，值得单独打一束光。", "src": "Audio/leo/leo_player_best_02.m4a", "duration": 2.088}, {"id": "leo_player_best_03", "role": "leo", "category": "player_best", "text": "漂亮，你找到了关键的落点。", "src": "Audio/leo/leo_player_best_03.m4a", "duration": 2.635}, {"id": "leo_player_best_04", "role": "leo", "category": "player_best", "text": "好棋！该轮到我接戏了。", "src": "Audio/leo/leo_player_best_04.m4a", "duration": 2.466}, {"id": "leo_player_brilliant_01", "role": "leo", "category": "player_brilliant", "text": "精彩！这一幕我愿意再看一遍。", "src": "Audio/leo/leo_player_brilliant_01.m4a", "duration": 2.556}, {"id": "leo_player_brilliant_02", "role": "leo", "category": "player_brilliant", "text": "等等，你竟然算到了这一层！", "src": "Audio/leo/leo_player_brilliant_02.m4a", "duration": 2.399}, {"id": "leo_player_brilliant_03", "role": "leo", "category": "player_brilliant", "text": "这一手，配得上一声喝彩。", "src": "Audio/leo/leo_player_brilliant_03.m4a", "duration": 2.17}, {"id": "leo_player_brilliant_04", "role": "leo", "category": "player_brilliant", "text": "大胆又准确，难得的好戏！", "src": "Audio/leo/leo_player_brilliant_04.m4a", "duration": 2.094}, {"id": "leo_player_brilliant_05", "role": "leo", "category": "player_brilliant", "text": "我得收起笑容，认真欣赏了。", "src": "Audio/leo/leo_player_brilliant_05.m4a", "duration": 2.448}, {"id": "leo_lia_best_move_01", "role": "leo", "category": "lia_best_move", "text": "我的答案，现在揭晓。", "src": "Audio/leo/leo_lia_best_move_01.m4a", "duration": 2.13}, {"id": "leo_lia_best_move_02", "role": "leo", "category": "lia_best_move", "text": "这一手，请看完整。", "src": "Audio/leo/leo_lia_best_move_02.m4a", "duration": 2.23}, {"id": "leo_lia_best_move_03", "role": "leo", "category": "lia_best_move", "text": "安静的落子，也能压住全场。", "src": "Audio/leo/leo_lia_best_move_03.m4a", "duration": 2.327}, {"id": "leo_lia_best_move_04", "role": "leo", "category": "lia_best_move", "text": "好，轮到我把节奏带起来。", "src": "Audio/leo/leo_lia_best_move_04.m4a", "duration": 2.04}, {"id": "leo_capture_pawn_01", "role": "leo", "category": "capture_pawn", "text": "一枚兵退场！", "src": "Audio/leo/leo_capture_pawn_01.m4a", "duration": 1.083}, {"id": "leo_capture_pawn_02", "role": "leo", "category": "capture_pawn", "text": "先拿一兵，为后面铺路。", "src": "Audio/leo/leo_capture_pawn_02.m4a", "duration": 1.962}, {"id": "leo_capture_pawn_03", "role": "leo", "category": "capture_pawn", "text": "小角色的离场，也算一笔账。", "src": "Audio/leo/leo_capture_pawn_03.m4a", "duration": 2.309}, {"id": "leo_capture_pawn_04", "role": "leo", "category": "capture_pawn", "text": "这枚兵，我先收入后台。", "src": "Audio/leo/leo_capture_pawn_04.m4a", "duration": 2.048}, {"id": "leo_capture_minor_01", "role": "leo", "category": "capture_minor", "text": "轻子落幕，戏份归我了。", "src": "Audio/leo/leo_capture_minor_01.m4a", "duration": 2.288}, {"id": "leo_capture_minor_02", "role": "leo", "category": "capture_minor", "text": "一员主力被我请下了台。", "src": "Audio/leo/leo_capture_minor_02.m4a", "duration": 1.737}, {"id": "leo_capture_minor_03", "role": "leo", "category": "capture_minor", "text": "这次取子，干净利落！", "src": "Audio/leo/leo_capture_minor_03.m4a", "duration": 2.402}, {"id": "leo_capture_minor_04", "role": "leo", "category": "capture_minor", "text": "你的阵容少了一位演员。", "src": "Audio/leo/leo_capture_minor_04.m4a", "duration": 1.562}, {"id": "leo_capture_rook_01", "role": "leo", "category": "capture_rook", "text": "车退场了，这一幕够重。", "src": "Audio/leo/leo_capture_rook_01.m4a", "duration": 2.116}, {"id": "leo_capture_rook_02", "role": "leo", "category": "capture_rook", "text": "重子被我拿下！", "src": "Audio/leo/leo_capture_rook_02.m4a", "duration": 1.175}, {"id": "leo_capture_rook_03", "role": "leo", "category": "capture_rook", "text": "这一车，足够让你重排阵容。", "src": "Audio/leo/leo_capture_rook_03.m4a", "duration": 2.442}, {"id": "leo_capture_rook_04", "role": "leo", "category": "capture_rook", "text": "你的车离场，接下来怎么接？", "src": "Audio/leo/leo_capture_rook_04.m4a", "duration": 2.309}, {"id": "leo_capture_queen_01", "role": "leo", "category": "capture_queen", "text": "后退场！全场的目光都变了。", "src": "Audio/leo/leo_capture_queen_01.m4a", "duration": 2.463}, {"id": "leo_capture_queen_02", "role": "leo", "category": "capture_queen", "text": "这一口，收走了你的主角。", "src": "Audio/leo/leo_capture_queen_02.m4a", "duration": 2.517}, {"id": "leo_capture_queen_03", "role": "leo", "category": "capture_queen", "text": "后被我拿到了，结局得重写。", "src": "Audio/leo/leo_capture_queen_03.m4a", "duration": 3.025}, {"id": "leo_capture_queen_04", "role": "leo", "category": "capture_queen", "text": "这么贵的戏票，我就收下了。", "src": "Audio/leo/leo_capture_queen_04.m4a", "duration": 2.15}, {"id": "leo_player_loses_minor_01", "role": "leo", "category": "player_loses_minor", "text": "我的轻子退场，反转来了。", "src": "Audio/leo/leo_player_loses_minor_01.m4a", "duration": 2.56}, {"id": "leo_player_loses_minor_02", "role": "leo", "category": "player_loses_minor", "text": "你吃得漂亮，这幕我认。", "src": "Audio/leo/leo_player_loses_minor_02.m4a", "duration": 2.073}, {"id": "leo_player_loses_minor_03", "role": "leo", "category": "player_loses_minor", "text": "好家伙，我的配角被你截走了。", "src": "Audio/leo/leo_player_loses_minor_03.m4a", "duration": 2.581}, {"id": "leo_player_loses_minor_04", "role": "leo", "category": "player_loses_minor", "text": "阵容受损，我得换个演法。", "src": "Audio/leo/leo_player_loses_minor_04.m4a", "duration": 2.173}, {"id": "leo_player_loses_rook_01", "role": "leo", "category": "player_loses_rook", "text": "我的车倒了，这下有分量！", "src": "Audio/leo/leo_player_loses_rook_01.m4a", "duration": 2.055}, {"id": "leo_player_loses_rook_02", "role": "leo", "category": "player_loses_rook", "text": "你拿下重子，我可不能再轻松了。", "src": "Audio/leo/leo_player_loses_rook_02.m4a", "duration": 3.11}, {"id": "leo_player_loses_rook_03", "role": "leo", "category": "player_loses_rook", "text": "这一车，让剧情急转直下。", "src": "Audio/leo/leo_player_loses_rook_03.m4a", "duration": 2.07}, {"id": "leo_player_loses_rook_04", "role": "leo", "category": "player_loses_rook", "text": "吃得好，我的防线该重新排了。", "src": "Audio/leo/leo_player_loses_rook_04.m4a", "duration": 2.606}, {"id": "leo_player_loses_queen_01", "role": "leo", "category": "player_loses_queen", "text": "我的后！这可真是大反转。", "src": "Audio/leo/leo_player_loses_queen_01.m4a", "duration": 2.62}, {"id": "leo_player_loses_queen_02", "role": "leo", "category": "player_loses_queen", "text": "你把我的主角请下去了。", "src": "Audio/leo/leo_player_loses_queen_02.m4a", "duration": 1.55}, {"id": "leo_player_loses_queen_03", "role": "leo", "category": "player_loses_queen", "text": "后被拿走，我承认这幕够狠。", "src": "Audio/leo/leo_player_loses_queen_03.m4a", "duration": 2.874}, {"id": "leo_player_loses_queen_04", "role": "leo", "category": "player_loses_queen", "text": "这一口，你吃出了压轴的气势。", "src": "Audio/leo/leo_player_loses_queen_04.m4a", "duration": 2.345}, {"id": "leo_tactic_fork_01", "role": "leo", "category": "tactic_fork", "text": "双捉！两个目标同时亮灯。", "src": "Audio/leo/leo_tactic_fork_01.m4a", "duration": 2.732}, {"id": "leo_tactic_fork_02", "role": "leo", "category": "tactic_fork", "text": "一手，两道难题！", "src": "Audio/leo/leo_tactic_fork_02.m4a", "duration": 1.744}, {"id": "leo_tactic_fork_03", "role": "leo", "category": "tactic_fork", "text": "两个角色抢同一条退路。", "src": "Audio/leo/leo_tactic_fork_03.m4a", "duration": 2.07}, {"id": "leo_tactic_fork_04", "role": "leo", "category": "tactic_fork", "text": "左右都要保，偏偏顾不过来。", "src": "Audio/leo/leo_tactic_fork_04.m4a", "duration": 3.046}, {"id": "leo_tactic_pin_01", "role": "leo", "category": "tactic_pin", "text": "牵制！这枚子有了不能离场的理由。", "src": "Audio/leo/leo_tactic_pin_01.m4a", "duration": 3.651}, {"id": "leo_tactic_pin_02", "role": "leo", "category": "tactic_pin", "text": "前面的不能走，后面的可很重要。", "src": "Audio/leo/leo_tactic_pin_02.m4a", "duration": 3.068}, {"id": "leo_tactic_pin_03", "role": "leo", "category": "tactic_pin", "text": "一条线，把两个角色绑住了。", "src": "Audio/leo/leo_tactic_pin_03.m4a", "duration": 2.373}, {"id": "leo_tactic_pin_04", "role": "leo", "category": "tactic_pin", "text": "它被钉在了自己的戏份里。", "src": "Audio/leo/leo_tactic_pin_04.m4a", "duration": 1.936}, {"id": "leo_tactic_discovered_attack_01", "role": "leo", "category": "tactic_discovered_attack", "text": "让开一枚，亮出整条线！", "src": "Audio/leo/leo_tactic_discovered_attack_01.m4a", "duration": 2.134}, {"id": "leo_tactic_discovered_attack_02", "role": "leo", "category": "tactic_discovered_attack", "text": "真正的威胁，现在登场。", "src": "Audio/leo/leo_tactic_discovered_attack_02.m4a", "duration": 2.638}, {"id": "leo_tactic_discovered_attack_03", "role": "leo", "category": "tactic_discovered_attack", "text": "前景撤开，伏笔露出来了。", "src": "Audio/leo/leo_tactic_discovered_attack_03.m4a", "duration": 2.638}, {"id": "leo_tactic_discovered_attack_04", "role": "leo", "category": "tactic_discovered_attack", "text": "这一挪，揭开了后面的锋芒。", "src": "Audio/leo/leo_tactic_discovered_attack_04.m4a", "duration": 2.638}, {"id": "leo_tactic_zwischenzug_01", "role": "leo", "category": "tactic_zwischenzug", "text": "先等等！你还有一手插进来。", "src": "Audio/leo/leo_tactic_zwischenzug_01.m4a", "duration": 2.273}, {"id": "leo_tactic_zwischenzug_02", "role": "leo", "category": "tactic_zwischenzug", "text": "中间这一拍，抢得妙。", "src": "Audio/leo/leo_tactic_zwischenzug_02.m4a", "duration": 2.424}, {"id": "leo_tactic_zwischenzug_03", "role": "leo", "category": "tactic_zwischenzug", "text": "你打乱了交换的出场顺序。", "src": "Audio/leo/leo_tactic_zwischenzug_03.m4a", "duration": 2.034}, {"id": "leo_tactic_zwischenzug_04", "role": "leo", "category": "tactic_zwischenzug", "text": "该回吃时先出招，漂亮的转折。", "src": "Audio/leo/leo_tactic_zwischenzug_04.m4a", "duration": 2.578}, {"id": "leo_tactic_sacrifice_01", "role": "leo", "category": "tactic_sacrifice", "text": "弃子开场，主动权压轴！", "src": "Audio/leo/leo_tactic_sacrifice_01.m4a", "duration": 2.614}, {"id": "leo_tactic_sacrifice_02", "role": "leo", "category": "tactic_sacrifice", "text": "你舍掉一枚，却赢来整段节奏。", "src": "Audio/leo/leo_tactic_sacrifice_02.m4a", "duration": 2.778}, {"id": "leo_tactic_sacrifice_03", "role": "leo", "category": "tactic_sacrifice", "text": "这枚子，是为后面的好戏铺路。", "src": "Audio/leo/leo_tactic_sacrifice_03.m4a", "duration": 3.2}, {"id": "leo_tactic_sacrifice_04", "role": "leo", "category": "tactic_sacrifice", "text": "代价付得大胆，补偿拿得漂亮。", "src": "Audio/leo/leo_tactic_sacrifice_04.m4a", "duration": 2.996}, {"id": "leo_key_threat_01", "role": "leo", "category": "key_threat", "text": "下一幕会很危险，准备好了？", "src": "Audio/leo/leo_key_threat_01.m4a", "duration": 2.56}, {"id": "leo_key_threat_02", "role": "leo", "category": "key_threat", "text": "我把威胁推到台前了。", "src": "Audio/leo/leo_key_threat_02.m4a", "duration": 1.78}, {"id": "leo_key_threat_03", "role": "leo", "category": "key_threat", "text": "现在得回答，不能等散场。", "src": "Audio/leo/leo_key_threat_03.m4a", "duration": 2.055}, {"id": "leo_key_threat_04", "role": "leo", "category": "key_threat", "text": "这个问题，你躲不开的。", "src": "Audio/leo/leo_key_threat_04.m4a", "duration": 1.894}, {"id": "leo_check_01", "role": "leo", "category": "check", "text": "将军！镜头转向你的王。", "src": "Audio/leo/leo_check_01.m4a", "duration": 2.324}, {"id": "leo_check_02", "role": "leo", "category": "check", "text": "王被点名，先别忙别的。", "src": "Audio/leo/leo_check_02.m4a", "duration": 2.36}, {"id": "leo_check_03", "role": "leo", "category": "check", "text": "你的王，该接这一句了！", "src": "Audio/leo/leo_check_03.m4a", "duration": 1.901}, {"id": "leo_check_04", "role": "leo", "category": "check", "text": "将军落下，节奏归我。", "src": "Audio/leo/leo_check_04.m4a", "duration": 2.278}, {"id": "leo_player_check_01", "role": "leo", "category": "player_check", "text": "你将军？好，紧张起来了。", "src": "Audio/leo/leo_player_check_01.m4a", "duration": 2.055}, {"id": "leo_player_check_02", "role": "leo", "category": "player_check", "text": "我的王也有被抢镜的时候。", "src": "Audio/leo/leo_player_check_02.m4a", "duration": 1.916}, {"id": "leo_player_check_03", "role": "leo", "category": "player_check", "text": "这一声将军，我接下了。", "src": "Audio/leo/leo_player_check_03.m4a", "duration": 2.509}, {"id": "leo_player_check_04", "role": "leo", "category": "player_check", "text": "压力到我这边，看看怎么化解。", "src": "Audio/leo/leo_player_check_04.m4a", "duration": 2.366}, {"id": "leo_missed_mate_01", "role": "leo", "category": "missed_mate", "text": "刚才可以将杀！你放走了高潮。", "src": "Audio/leo/leo_missed_mate_01.m4a", "duration": 1.955}, {"id": "leo_missed_mate_02", "role": "leo", "category": "missed_mate", "text": "终幕近在眼前，可惜没落下。", "src": "Audio/leo/leo_missed_mate_02.m4a", "duration": 2.52}, {"id": "leo_missed_mate_03", "role": "leo", "category": "missed_mate", "text": "杀棋擦过，这幕得记下来。", "src": "Audio/leo/leo_missed_mate_03.m4a", "duration": 2.273}, {"id": "leo_missed_mate_04", "role": "leo", "category": "missed_mate", "text": "你把本该结束的故事续上了。", "src": "Audio/leo/leo_missed_mate_04.m4a", "duration": 2.034}, {"id": "leo_blunder_into_mate_01", "role": "leo", "category": "blunder_into_mate", "text": "这一步，把结局提前了。", "src": "Audio/leo/leo_blunder_into_mate_01.m4a", "duration": 2.735}, {"id": "leo_blunder_into_mate_02", "role": "leo", "category": "blunder_into_mate", "text": "你的王走进了必杀的终幕。", "src": "Audio/leo/leo_blunder_into_mate_02.m4a", "duration": 1.722}, {"id": "leo_blunder_into_mate_03", "role": "leo", "category": "blunder_into_mate", "text": "出口已闭，剧情收束。", "src": "Audio/leo/leo_blunder_into_mate_03.m4a", "duration": 2.012}, {"id": "leo_blunder_into_mate_04", "role": "leo", "category": "blunder_into_mate", "text": "将杀的路线，被你亲手接通了。", "src": "Audio/leo/leo_blunder_into_mate_04.m4a", "duration": 2.896}, {"id": "leo_mate_01", "role": "leo", "category": "mate", "text": "将杀！幕布落下。", "src": "Audio/leo/leo_mate_01.m4a", "duration": 1.722}, {"id": "leo_mate_02", "role": "leo", "category": "mate", "text": "终场，所有出口都关了。", "src": "Audio/leo/leo_mate_02.m4a", "duration": 2.384}, {"id": "leo_mate_03", "role": "leo", "category": "mate", "text": "王已经没有下一场戏。", "src": "Audio/leo/leo_mate_03.m4a", "duration": 1.698}, {"id": "leo_mate_04", "role": "leo", "category": "mate", "text": "这一盘，以将杀收尾。", "src": "Audio/leo/leo_mate_04.m4a", "duration": 2.034}, {"id": "leo_castling_01", "role": "leo", "category": "castling", "text": "易位换景，王车就位！", "src": "Audio/leo/leo_castling_01.m4a", "duration": 2.034}, {"id": "leo_castling_02", "role": "leo", "category": "castling", "text": "王退到安全处，车准备接班。", "src": "Audio/leo/leo_castling_02.m4a", "duration": 2.56}, {"id": "leo_castling_03", "role": "leo", "category": "castling", "text": "两枚棋子，一起换了部署。", "src": "Audio/leo/leo_castling_03.m4a", "duration": 2.309}, {"id": "leo_castling_04", "role": "leo", "category": "castling", "text": "这次易位，像一次利落的转场。", "src": "Audio/leo/leo_castling_04.m4a", "duration": 2.064}, {"id": "leo_promotion_01", "role": "leo", "category": "promotion", "text": "升变！小兵拿到主演的位置。", "src": "Audio/leo/leo_promotion_01.m4a", "duration": 2.524}, {"id": "leo_promotion_02", "role": "leo", "category": "promotion", "text": "一路到底，新角色登场！", "src": "Audio/leo/leo_promotion_02.m4a", "duration": 2.252}, {"id": "leo_promotion_03", "role": "leo", "category": "promotion", "text": "兵走完远路，换来了全新戏份。", "src": "Audio/leo/leo_promotion_03.m4a", "duration": 2.702}, {"id": "leo_promotion_04", "role": "leo", "category": "promotion", "text": "升变落定，舞台的重量变了。", "src": "Audio/leo/leo_promotion_04.m4a", "duration": 2.817}, {"id": "leo_queen_early_01", "role": "leo", "category": "queen_early", "text": "后登场太早，节奏可要付钱。", "src": "Audio/leo/leo_queen_early_01.m4a", "duration": 2.491}, {"id": "leo_queen_early_02", "role": "leo", "category": "queen_early", "text": "主角跑得快，配角还没出门。", "src": "Audio/leo/leo_queen_early_02.m4a", "duration": 2.402}, {"id": "leo_queen_early_03", "role": "leo", "category": "queen_early", "text": "你急着出后，反倒被追着跑。", "src": "Audio/leo/leo_queen_early_03.m4a", "duration": 2.366}, {"id": "leo_queen_early_04", "role": "leo", "category": "queen_early", "text": "这么早亮主角，容易被抢戏啊。", "src": "Audio/leo/leo_queen_early_04.m4a", "duration": 2.434}, {"id": "leo_defense_found_01", "role": "leo", "category": "defense_found", "text": "守得漂亮！这一幕没有垮。", "src": "Audio/leo/leo_defense_found_01.m4a", "duration": 2.052}, {"id": "leo_defense_found_02", "role": "leo", "category": "defense_found", "text": "最窄的退路，你还是找到了。", "src": "Audio/leo/leo_defense_found_02.m4a", "duration": 2.488}, {"id": "leo_defense_found_03", "role": "leo", "category": "defense_found", "text": "这次防守，足够换来掌声。", "src": "Audio/leo/leo_defense_found_03.m4a", "duration": 2.406}, {"id": "leo_defense_found_04", "role": "leo", "category": "defense_found", "text": "压力越大，这一手越有价值。", "src": "Audio/leo/leo_defense_found_04.m4a", "duration": 2.753}, {"id": "leo_player_missed_tactic_01", "role": "leo", "category": "player_missed_tactic", "text": "战术伏笔在那儿，你没接住。", "src": "Audio/leo/leo_player_missed_tactic_01.m4a", "duration": 2.309}, {"id": "leo_player_missed_tactic_02", "role": "leo", "category": "player_missed_tactic", "text": "机会登场，又悄悄退场了。", "src": "Audio/leo/leo_player_missed_tactic_02.m4a", "duration": 2.484}, {"id": "leo_player_missed_tactic_03", "role": "leo", "category": "player_missed_tactic", "text": "别只看眼前，后面还有连招。", "src": "Audio/leo/leo_player_missed_tactic_03.m4a", "duration": 2.81}, {"id": "leo_player_missed_tactic_04", "role": "leo", "category": "player_missed_tactic", "text": "可惜，这里本来能演得更精彩。", "src": "Audio/leo/leo_player_missed_tactic_04.m4a", "duration": 2.366}, {"id": "leo_comeback_01", "role": "leo", "category": "comeback", "text": "反转！你把局面救回来了。", "src": "Audio/leo/leo_comeback_01.m4a", "duration": 2.509}, {"id": "leo_comeback_02", "role": "leo", "category": "comeback", "text": "还没散场，你又抢回了节奏。", "src": "Audio/leo/leo_comeback_02.m4a", "duration": 2.466}, {"id": "leo_comeback_03", "role": "leo", "category": "comeback", "text": "这段逆风戏，演得有韧劲。", "src": "Audio/leo/leo_comeback_03.m4a", "duration": 2.309}, {"id": "leo_comeback_04", "role": "leo", "category": "comeback", "text": "劣势追回，好戏重新开场！", "src": "Audio/leo/leo_comeback_04.m4a", "duration": 3.088}, {"id": "victor_opening_book_entry_01", "role": "victor", "category": "opening_book_entry", "text": "开局合乎章法。", "src": "Audio/victor/victor_opening_book_entry_01.m4a", "duration": 1.495}, {"id": "victor_opening_book_entry_02", "role": "victor", "category": "opening_book_entry", "text": "这一段准备得很充分。", "src": "Audio/victor/victor_opening_book_entry_02.m4a", "duration": 1.798}, {"id": "victor_opening_book_entry_03", "role": "victor", "category": "opening_book_entry", "text": "熟悉的结构，保持耐心。", "src": "Audio/victor/victor_opening_book_entry_03.m4a", "duration": 2.448}, {"id": "victor_opening_book_entry_04", "role": "victor", "category": "opening_book_entry", "text": "理论之内，走得稳妥。", "src": "Audio/victor/victor_opening_book_entry_04.m4a", "duration": 2.245}, {"id": "victor_opening_book_exit_01", "role": "victor", "category": "opening_book_exit", "text": "离开理论了，重新判断。", "src": "Audio/victor/victor_opening_book_exit_01.m4a", "duration": 2.148}, {"id": "victor_opening_book_exit_02", "role": "victor", "category": "opening_book_exit", "text": "接下来靠计算，不靠记忆。", "src": "Audio/victor/victor_opening_book_exit_02.m4a", "duration": 2.635}, {"id": "victor_opening_book_exit_03", "role": "victor", "category": "opening_book_exit", "text": "棋谱到这里，局面还很长。", "src": "Audio/victor/victor_opening_book_exit_03.m4a", "duration": 2.619}, {"id": "victor_opening_book_exit_04", "role": "victor", "category": "opening_book_exit", "text": "新局面，先把双方资源看清。", "src": "Audio/victor/victor_opening_book_exit_04.m4a", "duration": 3.003}, {"id": "victor_player_accurate_01", "role": "victor", "category": "player_accurate", "text": "这一手考虑周全。", "src": "Audio/victor/victor_player_accurate_01.m4a", "duration": 1.619}, {"id": "victor_player_accurate_02", "role": "victor", "category": "player_accurate", "text": "处理得很稳。", "src": "Audio/victor/victor_player_accurate_02.m4a", "duration": 1.057}, {"id": "victor_player_accurate_03", "role": "victor", "category": "player_accurate", "text": "细节没有遗漏。", "src": "Audio/victor/victor_player_accurate_03.m4a", "duration": 1.393}, {"id": "victor_player_accurate_04", "role": "victor", "category": "player_accurate", "text": "准确，也是耐心的结果。", "src": "Audio/victor/victor_player_accurate_04.m4a", "duration": 2.656}, {"id": "victor_player_best_01", "role": "victor", "category": "player_best", "text": "你找到了最好的办法。", "src": "Audio/victor/victor_player_best_01.m4a", "duration": 1.422}, {"id": "victor_player_best_02", "role": "victor", "category": "player_best", "text": "这一步判断正确。", "src": "Audio/victor/victor_player_best_02.m4a", "duration": 1.54}, {"id": "victor_player_best_03", "role": "victor", "category": "player_best", "text": "好棋，问题解决得很彻底。", "src": "Audio/victor/victor_player_best_03.m4a", "duration": 2.538}, {"id": "victor_player_best_04", "role": "victor", "category": "player_best", "text": "关键之处，你没有犹豫。", "src": "Audio/victor/victor_player_best_04.m4a", "duration": 2.342}, {"id": "victor_player_brilliant_01", "role": "victor", "category": "player_brilliant", "text": "值得赞赏，计算得很深。", "src": "Audio/victor/victor_player_brilliant_01.m4a", "duration": 2.127}, {"id": "victor_player_brilliant_02", "role": "victor", "category": "player_brilliant", "text": "这手棋，勇气和判断都有。", "src": "Audio/victor/victor_player_brilliant_02.m4a", "duration": 2.656}, {"id": "victor_player_brilliant_03", "role": "victor", "category": "player_brilliant", "text": "我需要重新审视你的计划。", "src": "Audio/victor/victor_player_brilliant_03.m4a", "duration": 1.876}, {"id": "victor_player_brilliant_04", "role": "victor", "category": "player_brilliant", "text": "不容易，这样的想法很难找到。", "src": "Audio/victor/victor_player_brilliant_04.m4a", "duration": 2.853}, {"id": "victor_player_brilliant_05", "role": "victor", "category": "player_brilliant", "text": "这一步的价值，在后面才看得清。", "src": "Audio/victor/victor_player_brilliant_05.m4a", "duration": 3.003}, {"id": "victor_lia_best_move_01", "role": "victor", "category": "lia_best_move", "text": "我的选择，是这一手。", "src": "Audio/victor/victor_lia_best_move_01.m4a", "duration": 1.991}, {"id": "victor_lia_best_move_02", "role": "victor", "category": "lia_best_move", "text": "我先把这里收紧。", "src": "Audio/victor/victor_lia_best_move_02.m4a", "duration": 1.35}, {"id": "victor_lia_best_move_03", "role": "victor", "category": "lia_best_move", "text": "这一手会让你多算一算。", "src": "Audio/victor/victor_lia_best_move_03.m4a", "duration": 1.955}, {"id": "victor_lia_best_move_04", "role": "victor", "category": "lia_best_move", "text": "不求热闹，先求有效。", "src": "Audio/victor/victor_lia_best_move_04.m4a", "duration": 2.192}, {"id": "victor_capture_pawn_01", "role": "victor", "category": "capture_pawn", "text": "一兵在手，慢慢积累。", "src": "Audio/victor/victor_capture_pawn_01.m4a", "duration": 2.091}, {"id": "victor_capture_pawn_02", "role": "victor", "category": "capture_pawn", "text": "这枚兵，我收下了。", "src": "Audio/victor/victor_capture_pawn_02.m4a", "duration": 1.976}, {"id": "victor_capture_pawn_03", "role": "victor", "category": "capture_pawn", "text": "小的收益，也值得兑现。", "src": "Audio/victor/victor_capture_pawn_03.m4a", "duration": 2.302}, {"id": "victor_capture_pawn_04", "role": "victor", "category": "capture_pawn", "text": "兵少了一枚，别再分心。", "src": "Audio/victor/victor_capture_pawn_04.m4a", "duration": 2.491}, {"id": "victor_capture_minor_01", "role": "victor", "category": "capture_minor", "text": "一个轻子到手。", "src": "Audio/victor/victor_capture_minor_01.m4a", "duration": 1.422}, {"id": "victor_capture_minor_02", "role": "victor", "category": "capture_minor", "text": "这次取子有实际收益。", "src": "Audio/victor/victor_capture_minor_02.m4a", "duration": 2.324}, {"id": "victor_capture_minor_03", "role": "victor", "category": "capture_minor", "text": "轻子损失，需要认真对待。", "src": "Audio/victor/victor_capture_minor_03.m4a", "duration": 2.617}, {"id": "victor_capture_minor_04", "role": "victor", "category": "capture_minor", "text": "我拿到了这枚轻子，继续算吧。", "src": "Audio/victor/victor_capture_minor_04.m4a", "duration": 2.463}, {"id": "victor_capture_rook_01", "role": "victor", "category": "capture_rook", "text": "你的车被吃了。", "src": "Audio/victor/victor_capture_rook_01.m4a", "duration": 1.329}, {"id": "victor_capture_rook_02", "role": "victor", "category": "capture_rook", "tex  {"id": "victor_promotion_03", "role": "victor", "category": "promotion", "text": "新的力量已经加入。", "src": "Audio/victor/victor_promotion_03.m4a", "duration": 1.758}, {"id": "victor_promotion_04", "role": "victor", "category": "promotion", "text": "残局的资源发生了变化。", "src": "Audio/victor/victor_promotion_04.m4a", "duration": 1.912}, {"id": "victor_queen_early_01", "role": "victor", "category": "queen_early", "text": "后出动太早，损失了节奏。", "src": "Audio/victor/victor_queen_early_01.m4a", "duration": 2.56}, {"id": "victor_queen_early_02", "role": "victor", "category": "queen_early", "text": "其他棋子还没跟上。", "src": "Audio/victor/victor_queen_early_02.m4a", "duration": 1.583}, {"id": "victor_queen_early_03", "role": "victor", "category": "queen_early", "text": "过早出后，容易反复受攻。", "src": "Audio/victor/victor_queen_early_03.m4a", "duration": 2.81}, {"id": "victor_queen_early_04", "role": "victor", "category": "queen_early", "text": "先发展轻子，会更从容。", "src": "Audio/victor/victor_queen_early_04.m4a", "duration": 2.678}, {"id": "victor_defense_found_01", "role": "victor", "category": "defense_found", "text": "防守找对了，局面稳住。", "src": "Audio/victor/victor_defense_found_01.m4a", "duration": 2.266}, {"id": "victor_defense_found_02", "role": "victor", "category": "defense_found", "text": "你没有放弃最重要的位置。", "src": "Audio/victor/victor_defense_found_02.m4a", "duration": 1.683}, {"id": "victor_defense_found_03", "role": "victor", "category": "defense_found", "text": "这一手承受住了压力。", "src": "Audio/victor/victor_defense_found_03.m4a", "duration": 1.876}, {"id": "victor_defense_found_04", "role": "victor", "category": "defense_found", "text": "关键的防线保住了。", "src": "Audio/victor/victor_defense_found_04.m4a", "duration": 1.662}, {"id": "victor_player_missed_tactic_01", "role": "victor", "category": "player_missed_tactic", "text": "这里有一处战术没有被利用。", "src": "Audio/victor/victor_player_missed_tactic_01.m4a", "duration": 1.976}, {"id": "victor_player_missed_tactic_02", "role": "victor", "category": "player_missed_tactic", "text": "机会稍纵即逝，需要复核。", "src": "Audio/victor/victor_player_missed_tactic_02.m4a", "duration": 2.747}, {"id": "victor_player_missed_tactic_03", "role": "victor", "category": "player_missed_tactic", "text": "你漏看了棋子间的联系。", "src": "Audio/victor/victor_player_missed_tactic_03.m4a", "duration": 2.15}, {"id": "victor_player_missed_tactic_04", "role": "victor", "category": "player_missed_tactic", "text": "这一步本来能争取更多。", "src": "Audio/victor/victor_player_missed_tactic_04.m4a", "duration": 2.022}, {"id": "victor_comeback_01", "role": "victor", "category": "comeback", "text": "你把劣势逐步扳回来了。", "src": "Audio/victor/victor_comeback_01.m4a", "duration": 1.944}, {"id": "victor_comeback_02", "role": "victor", "category": "comeback", "text": "坚持准确，局面确实会改变。", "src": "Audio/victor/victor_comeback_02.m4a", "duration": 2.946}, {"id": "victor_comeback_03", "role": "victor", "category": "comeback", "text": "这段防守之后，机会回到了你手里。", "src": "Audio/victor/victor_comeback_03.m4a", "duration": 3.086}, {"id": "victor_comeback_04", "role": "victor", "category": "comeback", "text": "重新站稳了，继续保持耐心。", "src": "Audio/victor/victor_comeback_04.m4a", "duration": 2.662}, {"id": "zara_opening_book_entry_01", "role": "zara", "category": "opening_book_entry", "text": "开局走对了，接着来。", "src": "Audio/zara/zara_opening_book_entry_01.m4a", "duration": 2.22}, {"id": "zara_opening_book_entry_02", "role": "zara", "category": "opening_book_entry", "text": "这段你准备过，有底子。", "src": "Audio/zara/zara_opening_book_entry_02.m4a", "duration": 2.284}, {"id": "zara_opening_book_entry_03", "role": "zara", "category": "opening_book_entry", "text": "发展很利索。", "src": "Audio/zara/zara_opening_book_entry_03.m4a", "duration": 1.365}, {"id": "zara_opening_book_entry_04", "role": "zara", "category": "opening_book_entry", "text": "理论走得熟，实战见真章。", "src": "Audio/zara/zara_opening_book_entry_04.m4a", "duration": 2.828}, {"id": "zara_opening_book_exit_01", "role": "zara", "category": "opening_book_exit", "text": "出书了，现在自己算。", "src": "Audio/zara/zara_opening_book_exit_01.m4a", "duration": 1.936}, {"id": "zara_opening_book_exit_02", "role": "zara", "category": "opening_book_exit", "text": "记忆用完，判断上场。", "src": "Audio/zara/zara_opening_book_exit_02.m4a", "duration": 2.491}, {"id": "zara_opening_book_exit_03", "role": "zara", "category": "opening_book_exit", "text": "接下来靠本事，走吧。", "src": "Audio/zara/zara_opening_book_exit_03.m4a", "duration": 3.028}, {"id": "zara_opening_book_exit_04", "role": "zara", "category": "opening_book_exit", "text": "新局面到了，别靠惯性下。", "src": "Audio/zara/zara_opening_book_exit_04.m4a", "duration": 2.747}, {"id": "zara_player_accurate_01", "role": "zara", "category": "player_accurate", "text": "准，没留软肋。", "src": "Audio/zara/zara_player_accurate_01.m4a", "duration": 2.022}, {"id": "zara_player_accurate_02", "role": "zara", "category": "player_accurate", "text": "这一手干脆。", "src": "Audio/zara/zara_player_accurate_02.m4a", "duration": 1.286}, {"id": "zara_player_accurate_03", "role": "zara", "category": "player_accurate", "text": "细节抓得牢。", "src": "Audio/zara/zara_player_accurate_03.m4a", "duration": 1.54}, {"id": "zara_player_accurate_04", "role": "zara", "category": "player_accurate", "text": "走得稳，也够硬。", "src": "Audio/zara/zara_player_accurate_04.m4a", "duration": 1.794}, {"id": "zara_player_best_01", "role": "zara", "category": "player_best", "text": "就这手，找得准。", "src": "Audio/zara/zara_player_best_01.m4a", "duration": 2.088}, {"id": "zara_player_best_02", "role": "zara", "category": "player_best", "text": "答案拿到了，漂亮。", "src": "Audio/zara/zara_player_best_02.m4a", "duration": 2.088}, {"id": "zara_player_best_03", "role": "zara", "category": "player_best", "text": "好棋，我得换招。", "src": "Audio/zara/zara_player_best_03.m4a", "duration": 1.934}, {"id": "zara_player_best_04", "role": "zara", "category": "player_best", "text": "这一步有力，我认。", "src": "Audio/zara/zara_player_best_04.m4a", "duration": 1.855}, {"id": "zara_player_brilliant_01", "role": "zara", "category": "player_brilliant", "text": "这手够狠，而且算对了。", "src": "Audio/zara/zara_player_brilliant_01.m4a", "duration": 2.968}, {"id": "zara_player_brilliant_02", "role": "zara", "category": "player_brilliant", "text": "漂亮！不是莽，是看得深。", "src": "Audio/zara/zara_player_brilliant_02.m4a", "duration": 2.828}, {"id": "zara_player_brilliant_03", "role": "zara", "category": "player_brilliant", "text": "你敢这样下，确实有东西。", "src": "Audio/zara/zara_player_brilliant_03.m4a", "duration": 2.853}, {"id": "zara_player_brilliant_04", "role": "zara", "category": "player_brilliant", "text": "好家伙，这个想法够锋利。", "src": "Audio/zara/zara_player_brilliant_04.m4a", "duration": 2.828}, {"id": "zara_player_brilliant_05", "role": "zara", "category": "player_brilliant", "text": "这一手让我重新看你了。", "src": "Audio/zara/zara_player_brilliant_05.m4a", "duration": 1.979}, {"id": "zara_lia_best_move_01", "role": "zara", "category": "lia_best_move", "text": "我找到突破口了。", "src": "Audio/zara/zara_lia_best_move_01.m4a", "duration": 1.411}, {"id": "zara_lia_best_move_02", "role": "zara", "category": "lia_best_move", "text": "这手接好，别松。", "src": "Audio/zara/zara_lia_best_move_02.m4a", "duration": 1.855}, {"id": "zara_lia_best_move_03", "role": "zara", "category": "lia_best_move", "text": "现在换我出题。", "src": "Audio/zara/zara_lia_best_move_03.m4a", "duration": 1.365}, {"id": "zara_lia_best_move_04", "role": "zara", "category": "lia_best_move", "text": "我这一步，奔着要害去。", "src": "Audio/zara/zara_lia_best_move_04.m4a", "duration": 2.614}, {"id": "zara_capture_pawn_01", "role": "zara", "category": "capture_pawn", "text": "这一兵归我。", "src": "Audio/zara/zara_capture_pawn_01.m4a", "duration": 1.168}, {"id": "zara_capture_pawn_02", "role": "zara", "category": "capture_pawn", "text": "小利先拿，没必要客气。", "src": "Audio/zara/zara_capture_pawn_02.m4a", "duration": 2.735}, {"id": "zara_capture_pawn_03", "role": "zara", "category": "capture_pawn", "text": "兵掉了，记住保护。", "src": "Audio/zara/zara_capture_pawn_03.m4a", "duration": 2.42}, {"id": "zara_capture_pawn_04", "role": "zara", "category": "capture_pawn", "text": "这份小账，我收了。", "src": "Audio/zara/zara_capture_pawn_04.m4a", "duration": 2.363}, {"id": "zara_capture_minor_01", "role": "zara", "category": "capture_minor", "text": "轻子拿下。", "src": "Audio/zara/zara_capture_minor_01.m4a", "duration": 1.15}, {"id": "zara_capture_minor_02", "role": "zara", "category": "capture_minor", "text": "这枚子守得太松。", "src": "Audio/zara/zara_capture_minor_02.m4a", "duration": 1.698}, {"id": "zara_capture_minor_03", "role": "zara", "category": "capture_minor", "text": "我吃到了，防线该补了。", "src": "Audio/zara/zara_capture_minor_03.m4a", "duration": 3.125}, {"id": "zara_capture_minor_04", "role": "zara", "category": "capture_minor", "text": "少了个轻子，接下来更难受。", "src": "Audio/zara/zara_capture_minor_04.m4a", "duration": 2.832}, {"id": "zara_capture_rook_01", "role": "zara", "category": "capture_rook", "text": "车拿下了。", "src": "Audio/zara/zara_capture_rook_01.m4a", "duration": 1.154}, {"id": "zara_capture_rook_02", "role": "zara", "category": "capture_rook", "text": "重子丢了，得付代价。", "src": "Audio/zara/zara_capture_rook_02.m4a", "duration": 2.284}, {"id": "zara_capture_rook_03", "role": "zara", "category": "capture_rook", "text": "这一车，我不客气。", "src": "Audio/zara/zara_capture_rook_03.m4a", "duration": 2.127}, {"id": "zara_capture_rook_04", "role": "zara", "category": "capture_rook", "text": "你的车到手，压力加码。", "src": "Audio/zara/zara_capture_rook_04.m4a", "duration": 2.306}, {"id": "zara_capture_queen_01", "role": "zara", "category": "capture_queen", "text": "后没了，代价够大。", "src": "Audio/zara/zara_capture_queen_01.m4a", "duration": 2.302}, {"id": "zara_capture_queen_02", "role": "zara", "category": "capture_queen", "text": "这枚后，我收下。", "src": "Audio/zara/zara_capture_queen_02.m4a", "duration": 2.148}, {"id": "zara_capture_queen_03", "role": "zara", "category": "capture_queen", "text": "你给了大机会，我当然要抓。", "src": "Audio/zara/zara_capture_queen_03.m4a", "duration": 2.324}, {"id": "zara_capture_queen_04", "role": "zara", "category": "capture_queen", "text": "后被我拿下，局面得重算。", "src": "Audio/zara/zara_capture
