_queen_04.m4a", "duration": 2.662}, {"id": "zara_player_loses_minor_01", "role": "zara", "category": "player_loses_minor", "text": "我的轻子丢了，你抓得准。", "src": "Audio/zara/zara_player_loses_minor_01.m4a", "duration": 2.635}, {"id": "zara_player_loses_minor_02", "role": "zara", "category": "player_loses_minor", "text": "这下吃得硬，我服。", "src": "Audio/zara/zara_player_loses_minor_02.m4a", "duration": 2.192}, {"id": "zara_player_loses_minor_03", "role": "zara", "category": "player_loses_minor", "text": "你拿到了，别把优势送回来。", "src": "Audio/zara/zara_player_loses_minor_03.m4a", "duration": 2.774}, {"id": "zara_player_loses_minor_04", "role": "zara", "category": "player_loses_minor", "text": "轻子没守住，这笔我认。", "src": "Audio/zara/zara_player_loses_minor_04.m4a", "duration": 2.538}, {"id": "zara_player_loses_rook_01", "role": "zara", "category": "player_loses_rook", "text": "我的车被你拿走了。", "src": "Audio/zara/zara_player_loses_rook_01.m4a", "duration": 1.912}, {"id": "zara_player_loses_rook_02", "role": "zara", "category": "player_loses_rook", "text": "这一口够重。", "src": "Audio/zara/zara_player_loses_rook_02.m4a", "duration": 1.365}, {"id": "zara_player_loses_rook_03", "role": "zara", "category": "player_loses_rook", "text": "重子亏了，我得追回来。", "src": "Audio/zara/zara_player_loses_rook_03.m4a", "duration": 2.384}, {"id": "zara_player_loses_rook_04", "role": "zara", "category": "player_loses_rook", "text": "你抓到车，算你这手狠。", "src": "Audio/zara/zara_player_loses_rook_04.m4a", "duration": 2.402}, {"id": "zara_player_loses_queen_01", "role": "zara", "category": "player_loses_queen", "text": "我的后？这一下真重。", "src": "Audio/zara/zara_player_loses_queen_01.m4a", "duration": 2.324}, {"id": "zara_player_loses_queen_02", "role": "zara", "category": "player_loses_queen", "text": "后没守住，是我漏算。", "src": "Audio/zara/zara_player_loses_queen_02.m4a", "duration": 2.556}, {"id": "zara_player_loses_queen_03", "role": "zara", "category": "player_loses_queen", "text": "你拿到了大头，够准。", "src": "Audio/zara/zara_player_loses_queen_03.m4a", "duration": 2.42}, {"id": "zara_player_loses_queen_04", "role": "zara", "category": "player_loses_queen", "text": "这次优势到你那边了。", "src": "Audio/zara/zara_player_loses_queen_04.m4a", "duration": 2.012}, {"id": "zara_tactic_fork_01", "role": "zara", "category": "tactic_fork", "text": "双捉到了，两边顾不过来。", "src": "Audio/zara/zara_tactic_fork_01.m4a", "duration": 2.81}, {"id": "zara_tactic_fork_02", "role": "zara", "category": "tactic_fork", "text": "一手打两处，够直接。", "src": "Audio/zara/zara_tactic_fork_02.m4a", "duration": 2.662}, {"id": "zara_tactic_fork_03", "role": "zara", "category": "tactic_fork", "text": "两个目标，都在攻击里。", "src": "Audio/zara/zara_tactic_fork_03.m4a", "duration": 2.402}, {"id": "zara_tactic_fork_04", "role": "zara", "category": "tactic_fork", "text": "这一叉，必须割舍一个。", "src": "Audio/zara/zara_tactic_fork_04.m4a", "duration": 2.656}, {"id": "zara_tactic_pin_01", "role": "zara", "category": "tactic_pin", "text": "牵住了，它动不了那么轻松。", "src": "Audio/zara/zara_tactic_pin_01.m4a", "duration": 2.96}, {"id": "zara_tactic_pin_02", "role": "zara", "category": "tactic_pin", "text": "身后有要害，先别乱挪。", "src": "Audio/zara/zara_tactic_pin_02.m4a", "duration": 2.499}, {"id": "zara_tactic_pin_03", "role": "zara", "category": "tactic_pin", "text": "一条线压住两个目标。", "src": "Audio/zara/zara_tactic_pin_03.m4a", "duration": 2.088}, {"id": "zara_tactic_pin_04", "role": "zara", "category": "tactic_pin", "text": "这枚子被钉上了。", "src": "Audio/zara/zara_tactic_pin_04.m4a", "duration": 1.851}, {"id": "zara_tactic_discovered_attack_01", "role": "zara", "category": "tactic_discovered_attack", "text": "让开！后面的攻击到了。", "src": "Audio/zara/zara_tactic_discovered_attack_01.m4a", "duration": 2.635}, {"id": "zara_tactic_discovered_attack_02", "role": "zara", "category": "tactic_discovered_attack", "text": "暗线打开，真招在后面。", "src": "Audio/zara/zara_tactic_discovered_attack_02.m4a", "duration": 2.596}, {"id": "zara_tactic_discovered_attack_03", "role": "zara", "category": "tactic_discovered_attack", "text": "前面的走，后面的发力。", "src": "Audio/zara/zara_tactic_discovered_attack_03.m4a", "duration": 2.499}, {"id": "zara_tactic_discovered_attack_04", "role": "zara", "category": "tactic_discovered_attack", "text": "这一下把埋着的威胁放出来了。", "src": "Audio/zara/zara_tactic_discovered_attack_04.m4a", "duration": 3.6}, {"id": "zara_tactic_zwischenzug_01", "role": "zara", "category": "tactic_zwischenzug", "text": "你先插这一手，够机灵。", "src": "Audio/zara/zara_tactic_zwischenzug_01.m4a", "duration": 2.402}, {"id": "zara_tactic_zwischenzug_02", "role": "zara", "category": "tactic_zwischenzug", "text": "回吃先等等，强招在前。", "src": "Audio/zara/zara_tactic_zwischenzug_02.m4a", "duration": 2.946}, {"id": "zara_tactic_zwischenzug_03", "role": "zara", "category": "tactic_zwischenzug", "text": "顺序打乱，收益就变了。", "src": "Audio/zara/zara_tactic_zwischenzug_03.m4a", "duration": 2.596}, {"id": "zara_tactic_zwischenzug_04", "role": "zara", "category": "tactic_zwischenzug", "text": "这记中间手，抓得狠。", "src": "Audio/zara/zara_tactic_zwischenzug_04.m4a", "duration": 2.402}, {"id": "zara_tactic_sacrifice_01", "role": "zara", "category": "tactic_sacrifice", "text": "舍得这枚子，就为抢主动。", "src": "Audio/zara/zara_tactic_sacrifice_01.m4a", "duration": 2.85}, {"id": "zara_tactic_sacrifice_02", "role": "zara", "category": "tactic_sacrifice", "text": "你不是送，是有补偿。", "src": "Audio/zara/zara_tactic_sacrifice_02.m4a", "duration": 2.619}, {"id": "zara_tactic_sacrifice_03", "role": "zara", "category": "tactic_sacrifice", "text": "弃得够果断，后面也算清了。", "src": "Audio/zara/zara_tactic_sacrifice_03.m4a", "duration": 2.692}, {"id": "zara_tactic_sacrifice_04", "role": "zara", "category": "tactic_sacrifice", "text": "子力让出去，攻势拿回来。", "src": "Audio/zara/zara_tactic_sacrifice_04.m4a", "duration": 3.512}, {"id": "zara_key_threat_01", "role": "zara", "category": "key_threat", "text": "别看别处，威胁在这。", "src": "Audio/zara/zara_key_threat_01.m4a", "duration": 2.499}, {"id": "zara_key_threat_02", "role": "zara", "category": "key_threat", "text": "这个问题，马上处理。", "src": "Audio/zara/zara_key_threat_02.m4a", "duration": 2.366}, {"id": "zara_key_threat_03", "role": "zara", "category": "key_threat", "text": "我下一手会更狠。", "src": "Audio/zara/zara_key_threat_03.m4a", "duration": 1.486}, {"id": "zara_key_threat_04", "role": "zara", "category": "key_threat", "text": "现在必须接招。", "src": "Audio/zara/zara_key_threat_04.m4a", "duration": 1.329}, {"id": "zara_check_01", "role": "zara", "category": "check", "text": "将军，先管你的王。", "src": "Audio/zara/zara_check_01.m4a", "duration": 2.32}, {"id": "zara_check_02", "role": "zara", "category": "check", "text": "王被盯上了，回话。", "src": "Audio/zara/zara_check_02.m4a", "duration": 2.732}, {"id": "zara_check_03", "role": "zara", "category": "check", "text": "这一将，逼你改计划。", "src": "Audio/zara/zara_check_03.m4a", "duration": 2.399}, {"id": "zara_check_04", "role": "zara", "category": "check", "text": "将军到了，别分神。", "src": "Audio/zara/zara_check_04.m4a", "duration": 2.235}, {"id": "zara_player_check_01", "role": "zara", "category": "player_check", "text": "你将军了？来，我接。", "src": "Audio/zara/zara_player_check_01.m4a", "duration": 2.363}, {"id": "zara_player_check_02", "role": "zara", "category": "player_check", "text": "压力给到我了。", "src": "Audio/zara/zara_player_check_02.m4a", "duration": 1.447}, {"id": "zara_player_check_03", "role": "zara", "category": "player_check", "text": "我的王得动一动。", "src": "Audio/zara/zara_player_check_03.m4a", "duration": 1.622}, {"id": "zara_player_check_04", "role": "zara", "category": "player_check", "text": "这一将有劲，继续算。", "src": "Audio/zara/zara_player_check_04.m4a", "duration": 2.556}, {"id": "zara_missed_mate_01", "role": "zara", "category": "missed_mate", "text": "有杀棋没下，亏了。", "src": "Audio/zara/zara_missed_mate_01.m4a", "duration": 2.188}, {"id": "zara_missed_mate_02", "role": "zara", "category": "missed_mate", "text": "刚才本来能结束。", "src": "Audio/zara/zara_missed_mate_02.m4a", "duration": 1.723}, {"id": "zara_missed_mate_03", "role": "zara", "category": "missed_mate", "text": "杀棋机会错过了，记住这一下。", "src": "Audio/zara/zara_missed_mate_03.m4a", "duration": 3.558}, {"id": "zara_missed_mate_04", "role": "zara", "category": "missed_mate", "text": "你把最狠的招漏掉了。", "src": "Audio/zara/zara_missed_mate_04.m4a", "duration": 1.855}, {"id": "zara_blunder_into_mate_01", "role": "zara", "category": "blunder_into_mate", "text": "这步走进必杀了。", "src": "Audio/zara/zara_blunder_into_mate_01.m4a", "duration": 1.737}, {"id": "zara_blunder_into_mate_02", "role": "zara", "category": "blunder_into_mate", "text": "王的出口全封了。", "src": "Audio/zara/zara_blunder_into_mate_02.m4a", "duration": 1.601}, {"id": "zara_blunder_into_mate_03", "role": "zara", "category": "blunder_into_mate", "text": "这个漏洞，直接到终点。", "src": "Audio/zara/zara_blunder_into_mate_03.m4a", "duration": 2.245}, {"id": "zara_blunder_into_mate_04", "role": "zara", "category": "blunder_into_mate", "text": "你把将杀的路让出来了。", "src": "Audio/zara/zara_blunder_into_mate_04.m4a", "duration": 2.263}, {"id": "zara_mate_01", "role": "zara", "category": "mate", "text": "将杀，结束。", "src": "Audio/zara/zara_mate_01.m4a", "duration": 2.064}, {"id": "zara_mate_02", "role": "zara", "category": "mate", "text": "王没地方走了。", "src": "Audio/zara/zara_mate_02.m4a", "duration": 1.638}, {"id": "zara_mate_03", "role": "zara", "category": "mate", "text": "这盘到此，复盘再战。", "src": "Audio/zara/zara_mate_03.m4a", "duration": 2.617}, {"id": "zara_mate_04", "role": "zara", "category": "mate", "text": "将杀落地，胜负已定。", "src": "Audio/zara/zara_mate_04.m4a", "duration": 2.792}, {"id": "zara_castling_01", "role": "zara", "category": "castling", "text": "易位，王先站稳。", "src": "Audio/zara/zara_castling_01.m4a", "duration": 1.916}, {"id": "zara_castling_02", "role": "zara", "category": "castling", "text": "王安全了，车能干活。", "src": "Audio/zara/zara_castling_02.m4a", "duration": 2.224}, {"id": "zara_castling_03", "role": "zara", "category": "castling", "text": "这次调整够及时。", "src": "Audio/zara/zara_castling_03.m4a", "duration": 1.808}, {"id": "zara_castling_04", "role": "zara", "category": "castling", "text": "王车就位，下一步来硬的。", "src": "Audio/zara/zara_castling_04.m4a", "duration": 2.875}, {"id": "zara_promotion_01", "role": "zara", "category": "promotion", "text": "升变，兵冲到底了。", "src": "Audio/zara/zara_promotion_01.m4a", "duration": 2.188}, {"id": "zara_promotion_02", "role": "zara", "category": "promotion", "text": "新战力到位。", "src": "Audio/zara/zara_promotion_02.m4a", "duration": 1.365}, {"id": "zara_promotion_03", "role": "zara", "category": "promotion", "text": "这枚兵没白拼。", "src": "Audio/zara/zara_promotion_03.m4a", "duration": 1.404}, {"id": "zara_promotion_04", "role": "zara", "category": "promotion", "text": "底线到了，换个更狠的身份。", "src": "Audio/zara/zara_promotion_04.m4a", "duration": 2.946}, {"id": "zara_queen_early_01", "role": "zara", "category": "queen_early", "text": "后出早了，被人追着走。", "src": "Audio/zara/zara_queen_early_01.m4a", "duration": 2.42}, {"id": "zara_queen_early_02", "role": "zara", "category": "queen_early", "text": "队友没出门，后先冲了。", "src": "Audio/zara/zara_queen_early_02.m4a", "duration": 2.662}, {"id": "zara_queen_early_03", "role": "zara", "category": "queen_early", "text": "这步出后丢节奏。", "src": "Audio/zara/zara_queen_early_03.m4a", "duration": 2.192}, {"id": "zara_queen_early_04", "role": "zara", "category": "queen_early", "text": "别拿后当开局的独行侠。", "src": "Audio/zara/zara_queen_early_04.m4a", "duration": 2.42}, {"id": "zara_defense_found_01", "role": "zara", "category": "defense_found", "text": "扛住了，这手够硬。", "src": "Audio/zara/zara_defense_found_01.m4a", "duration": 2.166}, {"id": "zara_defense_found_02", "role": "zara", "category": "defense_found", "text": "最难的防守你找到了。", "src": "Audio/zara/zara_defense_found_02.m4a", "duration": 2.088}, {"id": "zara_defense_found_03", "role": "zara", "category": "defense_found", "text": "这一下，把漏口堵死了。", "src": "Audio/zara/zara_defense_found_03.m4a", "duration": 2.542}, {"id": "zara_defense_found_04", "role": "zara", "category": "defense_found", "text": "压力这么大，你没乱。", "src": "Audio/zara/zara_defense_found_04.m4a", "duration": 2.32}, {"id": "zara_player_missed_tactic_01", "role": "zara", "category": "player_missed_tactic", "text": "战术就在这，你漏了。", "src": "Audio/zara/zara_player_missed_tactic_01.m4a", "duration": 1.912}, {"id": "zara_player_missed_tactic_02", "role": "zara", "category": "player_missed_tactic", "text": "棋子之间的关系，再看一眼。", "src": "Audio/zara/zara_player_missed_tactic_02.m4a", "duration": 2.62}, {"id": "zara_player_missed_tactic_03", "role": "zara", "category": "player_missed_tactic", "text": "这个机会没抓住，可惜。", "src": "Audio/zara/zara_player_missed_tactic_03.m4a", "duration": 2.235}, {"id": "zara_player_missed_tactic_04", "role": "zara", "category": "player_missed_tactic", "text": "本来能赢得更多。", "src": "Audio/zara/zara_player_missed_tactic_04.m4a", "duration": 1.51}, {"id": "zara_comeback_01", "role": "zara", "category": "comeback", "text": "追回来了，别松劲。", "src": "Audio/zara/zara_comeback_01.m4a", "duration": 2.278}, {"id": "zara_comeback_02", "role": "zara", "category": "comeback", "text": "劣势也能打回来，就是这样。", "src": "Audio/zara/zara_comeback_02.m4a", "duration": 2.699}, {"id": "zara_comeback_03", "role": "zara", "category": "comeback", "text": "你这一段挺得够硬。", "src": "Audio/zara/zara_comeback_03.m4a", "duration": 1.737}, {"id": "zara_comeback_04", "role": "zara", "category": "comeback", "text": "重新有得打了，继续！", "src": "Audio/zara/zara_comeback_04.m4a", "duration": 2.107}, {"id": "ajian_opening_book_entry_01", "role": "ajian", "category": "opening_book_entry", "text": "这段开局，你是熟练工啊。", "src": "Audio/ajian/ajian_opening_book_entry_01.m4a", "duration": 2.434}, {"id": "ajian_opening_book_entry_02", "role": "ajian", "category": "opening_book_entry", "text": "开局路线选得挺顺。", "src": "Audio/ajian/ajian_opening_book_entry_02.m4a", "duration": 1.544}, {"id": "ajian_opening_book_entry_03", "role": "ajian", "category": "opening_book_entry", "text": "准备工作过关，继续闯。", "src": "Audio/ajian/ajian_opening_book_entry_03.m4a", "duration": 2.064}, {"id": "ajian_opening_book_entry_04", "role": "ajian", "category": "opening_book_entry", "text": "这几步像是偷偷练过。", "src": "Audio/ajian/ajian_opening_book_entry_04.m4a", "duration": 2.448}, {"id": "ajian_opening_book_exit_01", "role": "ajian", "category": "opening_book_exit", "text": "攻略翻完啦，开始自由发挥。", "src": "Audio/ajian/ajian_opening_book_exit_01.m4a", "duration": 2.574}, {"id": "ajian_opening_book_exit_02", "role": "ajian", "category": "opening_book_exit", "text": "没现成答案了，靠脑子开图。", "src": "Audio/ajian/ajian_opening_book_exit_02.m4a", "duration": 2.747}, {"id": "ajian_opening_book_exit_03", "role": "ajian", "category": "opening_book_exit", "text": "熟路到头，新关卡来了。", "src": "Audio/ajian/ajian_opening_book_exit_03.m4a", "duration": 2.602}, {"id": "ajian_opening_book_exit_04", "role": "ajian", "category": "opening_book_exit", "text": "接下来可不能闭着眼走啦。", "src": "Audio/ajian/ajian_opening_book_exit_04.m4a", "duration": 2.109}, {"id": "ajian_player_accurate_01", "role": "ajian", "category": "player_accurate", "text": "这手很细，没露馅。", "src": "Audio/ajian/ajian_player_accurate_01.m4a", "duration": 2.022}, {"id": "ajian_player_accurate_02", "role": "ajian", "category": "player_accurate", "text": "稳稳的，没给我捡便宜。", "src": "Audio/ajian/ajian_player_accurate_02.m4a", "duration": 2.635}, {"id": "ajian_player_accurate_03", "role": "ajian", "category": "player_accurate", "text": "细节控上线了。", "src": "Audio/ajian/ajian_player_accurate_03.m4a", "duration": 1.386}, {"id": "ajian_player_accurate_04", "role": "ajian", "category": "player_accurate", "text": "这一落子，挺讲究嘛。", "src": "Audio/ajian/ajian_player_accurate_04.m4a", "duration": 2.517}, {"id": "ajian_player_best_01", "role": "ajian", "category": "player_best", "text": "找到了，标准答案。", "src": "Audio/ajian/ajian_player_best_01.m4a", "duration": 2.406}, {"id": "ajian_player_best_02", "role": "ajian", "category": "player_best", "text": "好棋，我的小算盘得重打。", "src": "Audio/ajian/ajian_player_best_02.m4a", "duration": 2.828}, {"id": "ajian_player_best_03", "role": "ajian", "category": "player_best", "text": "这一手，我没法挑毛病。", "src": "Audio/ajian/ajian_player_best_03.m4a", "duration": 2.381}, {"id": "ajian_player_best_04", "role": "ajian", "category": "player_best", "text": "你把最合适的招挑出来了。", "src": "Audio/ajian/ajian_player_best_04.m4a", "duration": 1.976}, {"id": "ajian_player_brilliant_01", "role": "ajian", "category": "player_brilliant", "text": "哇，这招不是随手能整出来的。", "src": "Audio/ajian/ajian_player_brilliant_01.m4a", "duration": 2.832}, {"id": "ajian_player_brilliant_02", "role": "ajian", "category": "player_brilliant", "text": "漂亮！我的小聪明不够用了。", "src": "Audio/ajian/ajian_player_brilliant_02.m4a", "duration": 2.81}, {"id": "ajian_player_brilliant_03", "role": "ajian", "category": "player_brilliant", "text": "这么敢下，还真让你算对了。", "src": "Audio/ajian/ajian_player_brilliant_03.m4a", "duration": 2.499}, {"id": "ajian_player_brilliant_04", "role": "ajian", "category": "player_brilliant", "text": "这一手，值得存个回放。", "src": "Audio/ajian/ajian_player_brilliant_04.m4a", "duration": 2.342}, {"id": "ajian_player_brilliant_05", "role": "ajian", "category": "player_brilliant", "text": "你这是把隐藏关卡打通了啊。", "src": "Audio/ajian/ajian_player_brilliant_05.m4a", "duration": 2.406}, {"id": "ajian_lia_best_move_01", "role": "ajian", "category": "lia_best_move", "text": "该我出点小花样了。", "src": "Audio/ajian/ajian_lia_best_move_01.m4a", "duration": 1.622}, {"id": "ajian_lia_best_move_02", "role": "ajian", "category": "lia_best_move", "text": "这一手，送你个小难题。", "src": "Audio/ajian/ajian_lia_best_move_02.m4a", "duration": 2.42}, {"id": "ajian_lia_best_move_03", "role": "ajian", "category": "lia_best_move", "text": "我也找到好路子啦。", "src": "Audio/ajian/ajian_lia_best_move_03.m4a", "duration": 1.619}, {"id": "ajian_lia_best_move_04", "role": "ajian", "category": "lia_best_move", "text": "接招吧，这次我算过了。", "src": "Audio/ajian/ajian_lia_best_move_04.m4a", "duration": 2.306}, {"id": "ajian_capture_pawn_01", "role": "ajian", "category": "capture_pawn", "text": "一枚小兵，先揣兜里。", "src": "Audio/ajian/ajian_capture_pawn_01.m4a", "duration": 2.348}, {"id": "ajian_capture_pawn_02", "role": "ajian", "category": "capture_pawn", "text": "这颗兵，被我捡到啦。", "src": "Audio/ajian/ajian_capture_pawn_02.m4a", "duration": 2.048}, {"id": "ajian_capture_pawn_03", "role": "ajian", "category": "capture_pawn", "text": "先赚个小零头。", "src": "Audio/ajian/ajian_capture_pawn_03.m4a", "duration": 1.51}, {"id": "ajian_capture_pawn_04", "role": "ajian", "category": "capture_pawn", "text": "小兵掉队，我顺手接走。", "src": "Audio/ajian/ajian_capture_pawn_04.m4a", "duration": 2.288}, {"id": "ajian_capture_minor_01", "role": "ajian", "category": "capture_minor", "text": "轻子到账，嘿。", "src": "Audio/ajian/ajian_capture_minor_01.m4a", "duration": 1.604}, {"id": "ajian_capture_minor_02", "role": "ajian", "category": "capture_minor", "text": "你这枚子，没跟上大部队。", "src": "Audio/ajian/ajian_capture_minor_02.m4a", "duration": 2.478}, {"id": "ajian_capture_minor_03", "role": "ajian", "category": "capture_minor", "text": "我先拿个帮手走啦。", "src": "Audio/ajian/ajian_capture_minor_03.m4a", "duration": 1.619}, {"id": "ajian_capture_minor_04", "role": "ajian", "category": "capture_minor", "text": "马象少一员，可别继续送呀。", "src": "Audio/ajian/ajian_capture_minor_04.m4a", "duration": 3.125}, {"id": "ajian_capture_rook_01", "role": "ajian", "category": "capture_rook", "text": "你的车，被我开走了。", "src": "Audio/ajian/ajian_capture_rook_01.m4a", "duration": 2.012}, {"id": "ajian_capture_rook_02", "role": "ajian", "category": "capture_rook", "text": "这一车，载着不少分呢。", "src": "Audio/ajian/ajian_capture_rook_02.m4a", "duration": 1.979}, {"id": "ajian_capture_rook_03", "role": "ajian", "category": "capture_rook", "text": "重子到手，小赚可算不上。", "src": "Audio/ajian/ajian_capture_rook_03.m4a", "duration": 2.306}, {"id": "ajian_capture_rook_04", "role": "ajian", "category": "capture_rook", "text": "车让我拿到了，下次看紧点。", "src": "Audio/ajian/ajian_capture_rook_04.m4a", "duration": 2.366}, {"id": "ajian_capture_queen_01", "role": "ajian", "category": "capture_queen", "text": "你的后，怎么跑我这儿来了？", "src": "Audio/ajian/ajian_capture_queen_01.m4a", "duration": 2.484}, {"id": "ajian_capture_queen_02", "role": "ajian", "category": "capture_queen", "text": "这么大的礼物，我有点受宠若惊。", "src": "Audio/ajian/ajian_capture_queen_02.m4a", "duration": 2.491}, {"id": "ajian_capture_queen_03", "role": "ajian", "category": "capture_queen", "text": "后被我吃了，玩笑开大了。", "src": "Audio/ajian/ajian_capture_queen_03.m4a", "duration": 2.814}, {"id": "ajian_capture_queen_04", "role": "ajian", "category": "capture_queen", "text": "这一口，直接吃到大头啦。", "src": "Audio/ajian/ajian_capture_queen_04.m4a", "duration": 2.192}, {"id": "ajian_player_loses_minor_01", "role": "ajian", "category": "player_loses_minor", "text": "哎，我的轻子被你拐走了。", "src": "Audio/ajian/ajian_player_loses_minor_01.m4a", "duration": 2.012}, {"id": "ajian_player_loses_minor_02", "role": "ajian", "category": "player_loses_minor", "text": "这回轮到你捡便宜了。", "src": "Audio/ajian/ajian_player_loses_minor_02.m4a", "duration": 2.03}, {"id": "ajian_player_loses_minor_03", "role": "ajian", "category": "player_loses_minor", "text": "拿得挺准，我的小伙伴没了。", "src": "Audio/ajian/ajian_player_loses_minor_03.m4a", "duration": 2.918}, {"id": "ajian_player_loses_minor_04", "role": "ajian", "category": "player_loses_minor", "text": "轻子被抓，我得换个玩法。", "src": "Audio/ajian/ajian_player_loses_minor_04.m4a", "duration": 2.478}, {"id": "ajian_player_loses_rook_01", "role": "ajian", "category": "player_loses_rook", "text": "我的车呀，你开得挺顺手。", "src": "Audio/ajian/ajian_player_loses_rook_01.m4a", "duration": 2.517}, {"id": "ajian_player_loses_rook_02", "role": "ajian", "category": "player_loses_rook", "text": "你这一下，赚得不少。", "src": "Audio/ajian/ajian_player_loses_rook_02.m4a", "duration": 1.934}, {"id": "ajian_player_loses_rook_03", "role": "ajian", "category": "player_loses_rook", "text": "重子没看住，这回算我亏。", "src": "Audio/ajian/ajian_player_loses_rook_03.m4a", "duration": 3.064}, {"id": "ajian_player_loses_rook_04", "role": "ajian", "category": "player_loses_rook", "text": "车被你拿下，我得另找路子。", "src": "Audio/ajian/ajian_player_loses_rook_04.m4a", "duration": 2.499}, {"id": "ajian_player_loses_queen_01", "role": "ajian", "category": "player_loses_queen", "text": "我的后！这事可不小。", "src": "Audio/ajian/ajian_player_loses_queen_01.m4a", "duration": 2.235}, {"id": "ajian_player_loses_queen_02", "role": "ajian", "category": "player_loses_queen", "text": "被你抓到大漏勺了。", "src": "Audio/ajian/ajian_player_loses_queen_02.m4a", "duration": 1.658}, {"id": "ajian_player_loses_queen_03", "role": "ajian", "category": "player_loses_queen", "text": "后没了，我得把笑容收一收。", "src": "Audio/ajian/ajian_player_loses_queen_03.m4a", "duration": 2.753}, {"id": "ajian_player_loses_queen_04", "role": "ajian", "category": "player_loses_queen", "text": "这么大一口，真让你吃着了。", "src": "Audio/ajian/ajian_player_loses_queen_04.m4a", "duration": 2.789}, {"id": "ajian_tactic_fork_01", "role": "ajian", "category": "tactic_fork", "text": "一手双捉，两边都喊救命。", "src": "Audio/ajian/ajian_tactic_fork_01.m4a", "duration": 2.72}, {"id": "ajian_tactic_fork_02", "role": "ajian", "category": "tactic_fork", "text": "这叉下去，得选一个保。", "src": "Audio/ajian/ajian_tactic_fork_02.m4a", "duration": 2.36}, {"id": "ajian_tactic_fork_03", "role": "ajian", "category": "tactic_fork", "text": "两个目标一起亮红灯啦。", "src": "Audio/ajian/ajian_tactic_fork_03.m4a", "duration": 1.78}, {"id": "ajian_tactic_fork_04", "role": "ajian", "category": "tactic_fork", "text": "一招两用，可真会省事。", "src": "Audio/ajian/ajian_tactic_fork_04.m4a", "duration": 2.342}, {"id": "ajian_tactic_pin_01", "role": "ajian", "category": "tactic_pin", "text": "这枚子被按住了，别乱蹦。", "src": "Audio/ajian/ajian_tactic_pin_01.m4a", "duration": 2.188}, {"id": "ajian_tactic_pin_02", "role": "ajian", "category": "tactic_pin", "text": "它身后还有大人物，走不开呀。", "src": "Audio/ajian/ajian_tactic_pin_02.m4a", "duration": 3.24}, {"id": "ajian_tactic_pin_03", "role": "ajian", "category": "tactic_pin", "text": "牵制拉住了它的小尾巴。", "src": "Audio/ajian/ajian_tactic_pin_03.m4a", "duration": 1.936}, {"id": "ajian_tactic_pin_04", "role": "ajian", "category": "tactic_pin", "text": "前面不敢动，后面还得护着。", "src": "Audio/ajian/ajian_tactic_pin_04.m4a", "duration": 2.704}, {"id": "ajian_tactic_discovered_attack_01", "role": "ajian", "category": "tactic_discovered_attack", "text": "挡路的挪开，后面的招出来了。", "src": "Audio/ajian/ajian_tactic_discovered_attack_01.m4a", "duration": 2.502}, {"id": "ajian_tactic_discovered_attack_02", "role": "ajian", "category": "tactic_discovered_attack", "text": "原来你还藏了这一层。", "src": "Audio/ajian/ajian_tactic_discovered_attack_02.m4a", "duration": 1.595}, {"id": "ajian_tactic_discovered_attack_03", "role": "ajian", "category": "tactic_discovered_attack", "text": "暗线一开，事情好玩了。", "src": "Audio/ajian/ajian_tactic_discovered_attack_03.m4a", "duration": 2.747}, {"id": "ajian_tactic_discovered_attack_04", "role": "ajian", "category": "tactic_discovered_attack", "text": "前面的走一步，后面的来真的。", "src": "Audio/ajian/ajian_tactic_discovered_attack_04.m4a", "duration": 2.32}, {"id": "ajian_tactic_zwischenzug_01", "role": "ajian", "category": "tactic_zwischenzug", "text": "先不回吃？你还会插个队。", "src": "Audio/ajian/ajian_tactic_zwischenzug_01.m4a", "duration": 2.363}, {"id": "ajian_tactic_zwischenzug_02", "role": "ajian", "category": "tactic_zwischenzug", "text": "这记中间手，差点让我接不上。", "src": "Audio/ajian/ajian_tactic_zwischenzug_02.m4a", "duration": 2.556}, {"id": "ajian_tactic_zwischenzug_03", "role": "ajian", "category": "tactic_zwischenzug", "text": "交换排后边，狠招先来。", "src": "Audio/ajian/ajian_tactic_zwischenzug_03.m4a", "duration": 2.638}, {"id": "ajian_tactic_zwischenzug_04", "role": "ajian", "category": "tactic_zwischenzug", "text": "你把次序玩明白了。", "src": "Audio/ajian/ajian_tactic_zwischenzug_04.m4a", "duration": 1.604}, {"id": "ajian_tactic_sacrifice_01", "role": "ajian", "category": "tactic_sacrifice", "text": "舍一枚，换个大动静。", "src": "Audio/ajian/ajian_tactic_sacrifice_01.m4a", "duration": 2.052}, {"id": "ajian_tactic_sacrifice_02", "role": "ajian", "category": "tactic_sacrifice", "text": "你这不是送，是算过的买卖。", "src": "Audio/ajian/ajian_tactic_sacrifice_02.m4a", "duration": 2.463}, {"id": "ajian_tactic_sacrifice_03", "role": "ajian", "category": "tactic_sacrifice", "text": "棋子先借出去，主动权收回来。", "src": "Audio/ajian/ajian_tactic_sacrifice_03.m4a", "duration": 3.243}, {"id": "ajian_tactic_sacrifice_04", "role": "ajian", "category": "tactic_sacrifice", "text": "敢弃也敢算，有点东西。", "src": "Audio/ajian/ajian_tactic_sacrifice_04.m4a", "duration": 2.832}, {"id": "ajian_key_threat_01", "role": "ajian", "category": "key_threat", "text": "我有个小计划，你最好现在看。", "src": "Audio/ajian/ajian_key_threat_01.m4a", "duration": 2.599}, {"id": "ajian_key_threat_02", "role": "ajian", "category": "key_threat", "text": "这威胁，可别当彩蛋漏了。", "src": "Audio/ajian/ajian_key_threat_02.m4a", "duration": 2.946}, {"id": "ajian_key_threat_03", "role": "ajian", "category": "key_threat", "text": "先处理这儿，别忙着逛棋盘。", "src": "Audio/ajian/ajian_key_threat_03.m4a", "duration": 2.278}, {"id": "ajian_key_threat_04", "role": "ajian", "category": "key_threat", "text": "我下一招，可能不太客气哦。", "src": "Audio/ajian/ajian_key_threat_04.m4a", "duration": 2.62}, {"id": "ajian_check_01", "role": "ajian", "category": "check", "text": "将军！你的王接到通知啦。", "src": "Audio/ajian/ajian_check_01.m4a", "duration": 2.402}, {"id": "ajian_check_02", "role": "ajian", "category": "check", "text": "王先忙别的？不行，得应将。", "src": "Audio/ajian/ajian_check_02.m4a", "duration": 2.871}, {"id": "ajian_check_03", "role": "ajian", "category": "check", "text": "这一将，叫你暂停一下。", "src": "Audio/ajian/ajian_check_03.m4a", "duration": 2.091}, {"id": "ajian_check_04", "role": "ajian", "category": "check", "text": "你的王，轮到它答题啦。", "src": "Audio/ajian/ajian_check_04.m4a", "duration": 2.235}, {"id": "ajian_player_check_01", "role": "ajian", "category": "player_check", "text": "你也将军？有来有回嘛。", "src": "Audio/ajian/ajian_player_check_01.m4a", "duration": 2.245}, {"id": "ajian_player_check_02", "role": "ajian", "category": "player_check", "text": "我的王被你点到名了。", "src": "Audio/ajian/ajian_player_check_02.m4a", "duration": 1.658}, {"id": "ajian_player_check_03", "role": "ajian", "category": "player_check", "text": "这将军收到了，我来解题。", "src": "Audio/ajian/ajian_player_check_03.m4a", "duration": 2.614}, {"id": "ajian_player_check_04", "role": "ajian", "category": "player_check", "text": "哎，这回是我先躲一躲。", "src": "Audio/ajian/ajian_player_check_04.m4a", "duration": 2.599}, {"id": "ajian_missed_mate_01", "role": "ajian", "category": "missed_mate", "text": "刚才有杀棋，你没捡到。", "src": "Audio/ajian/ajian_missed_mate_01.m4a", "duration": 2.266}, {"id": "ajian_missed_mate_02", "role": "ajian", "category": "missed_mate", "text": "通关按钮亮过，可惜漏按了。", "src": "Audio/ajian/ajian_missed_mate_02.m4a", "duration": 2.56}, {"id": "ajian_missed_mate_03", "role": "ajian", "category": "missed_mate", "text": "差点就能结束，你拐了个弯。", "src": "Audio/ajian/ajian_missed_mate_03.m4a", "duration": 2.946}, {"id": "ajian_missed_mate_04", "role": "ajian", "category": "missed_mate", "text": "杀棋从眼皮底下溜走啦。", "src": "Audio/ajian/ajian_missed_mate_04.m4a", "duration": 2.188}, {"id": "ajian_blunder_into_mate_01", "role": "ajian", "category": "blunder_into_mate", "text": "这步直接踩到必杀了。", "src": "Audio/ajian/ajian_blunder_into_mate_01.m4a", "duration": 2.596}, {"id": "ajian_blunder_into_mate_02", "role": "ajian", "category": "blunder_into_mate", "text": "王走进死胡同，没地方转弯啦。", "src": "Audio/ajian/ajian_blunder_into_mate_02.m4a", "duration": 3.122}, {"id": "ajian_blunder_into_mate_03", "role": "ajian", "category": "blunder_into_mate", "text": "糟糕，出口被你自己绕没了。", "src": "Audio/ajian/ajian_blunder_into_mate_03.m4a", "duration": 2.986}, {"id": "ajian_blunder_into_mate_04", "role": "ajian", "category": "blunder_into_mate", "text": "这一手，把结尾给接上了。", "src": "Audio/ajian/ajian_blunder_into_mate_04.m4a", "duration": 2.617}, {"id": "ajian_mate_01", "role": "ajian", "category": "mate", "text": "将杀，闯关到此啦。", "src": "Audio/ajian/ajian_mate_01.m4a", "duration": 2.704}, {"id": "ajian_mate_02", "role": "ajian", "category": "mate", "text": "王没路了，这盘结束。", "src": "Audio/ajian/ajian_mate_02.m4a", "duration": 2.073}, {"id": "ajian_mate_03", "role": "ajian", "category": "mate", "text": "这一局玩完，下一局再斗。", "src": "Audio/ajian/ajian_mate_03.m4a", "duration": 2.188}, {"id": "ajian_mate_04", "role": "ajian", "category": "mate", "text": "将杀成立，收棋啦。", "src": "Audio/ajian/ajian_mate_04.m4a", "duration": 2.399}, {"id": "ajian_castling_01", "role": "ajian", "category": "castling", "text": "易位搬家，王的包都收好了。", "src": "Audio/ajian/ajian_castling_01.m4a", "duration": 2.499}, {"id": "ajian_castling_02", "role": "ajian", "category": "castling", "text": "王住稳了，车终于能出门。", "src": "Audio/ajian/ajian_castling_02.m4a", "duration": 2.302}, {"id": "ajian_castling_03", "role": "ajian", "category": "castling", "text": "这次搬家，效率挺高。", "src": "Audio/ajian/ajian_castling_03.m4a", "duration": 2.491}, {"id": "ajian_castling_04", "role": "ajian", "category": "castling", "text": "王车一起换位置，配合上线。", "src": "Audio/ajian/ajian_castling_04.m4a", "duration": 2.278}, {"id": "ajian_promotion_01", "role": "ajian", "category": "promotion", "text": "小兵通关，领取新身份！", "src": "Audio/ajian/ajian_promotion_01.m4a", "duration": 2.248}, {"id": "ajian_promotion_02", "role": "ajian", "category": "promotion", "text": "兵到底啦，升级成功。", "src": "Audio/ajian/ajian_promotion_02.m4a", "duration": 2.424}, {"id": "ajian_promotion_03", "role": "ajian", "category": "promotion", "text": "小个子走出了大出息。", "src": "Audio/ajian/ajian_promotion_03.m4a", "duration": 2.388}, {"id": "ajian_promotion_04", "role": "ajian", "category": "promotion", "text": "新棋子加入，玩法又变啦。", "src": "Audio/ajian/ajian_promotion_04.m4a", "duration": 2.448}, {"id": "ajian_queen_early_01", "role": "ajian", "category": "queen_early", "text": "后出来遛早了，被人追呀。", "src": "Audio/ajian/ajian_queen_early_01.m4a", "duration": 2.442}, {"id": "ajian_queen_early_02", "role": "ajian", "category": "queen_early", "text": "其他子还宅着，后先跑啦。", "src": "Audio/ajian/ajian_queen_early_02.m4a", "duration": 2.302}, {"id": "ajian_queen_early_03", "role": "ajian", "category": "queen_early", "text": "这次出后，节奏有点亏。", "src": "Audio/ajian/ajian_queen_early_03.m4a", "duration": 2.278}, {"id": "ajian_queen_early_04", "role": "ajian", "category": "queen_early", "text": "别让后一个人开全图啊。", "src": "Audio/ajian/ajian_queen_early_04.m4a", "duration": 1.991}, {"id": "ajian_defense_found_01", "role": "ajian", "category": "defense_found", "text": "守住了，差点以为你要翻车。", "src": "Audio/ajian/ajian_defense_found_01.m4a", "duration": 2.402}, {"id": "ajian_defense_found_02", "role": "ajian", "category": "defense_found", "text": "你把那个坑绕过去啦。", "src": "Audio/ajian/ajian_defense_found_02.m4a", "duration": 1.68}, {"id": "ajian_defense_found_03", "role": "ajian", "category": "defense_found", "text": "这防守，真能救场。", "src": "Audio/ajian/ajian_defense_found_03.m4a", "duration": 2.022}, {"id": "ajian_defense_found_04", "role": "ajian", "category": "defense_found", "text": "最难的一下，你还接住了。", "src": "Audio/ajian/ajian_defense_found_04.m4a", "duration": 2.288}, {"id": "ajian_player_missed_tactic_01", "role": "ajian", "category": "player_missed_tactic", "text": "这儿有小机关，你没发现。", "src": "Audio/ajian/ajian_player_missed_tactic_01.m4a", "duration": 2.32}, {"id": "ajian_player_missed_tactic_02", "role": "ajian", "category": "player_missed_tactic", "text": "战术彩蛋被你跳过啦。", "src": "Audio/ajian/ajian_player_missed_tactic_02.m4a", "duration": 1.64}, {"id": "ajian_player_missed_tactic_03", "role": "ajian", "category": "player_missed_tactic", "text": "再连着看两步，就不一样了。", "src": "Audio/ajian/ajian_player_missed_tactic_03.m4a", "duration": 2.366}, {"id": "ajian_player_missed_tactic_04", "role": "ajian", "category": "player_missed_tactic", "text": "有机会没抓，亏个小惊喜。", "src": "Audio/ajian/ajian_player_missed_tactic_04.m4a", "duration": 2.263}, {"id": "ajian_comeback_01", "role": "ajian", "category": "comeback", "text": "这都让你追回来了，有韧劲。", "src": "Audio/ajian/ajian_comeback_01.m4a", "duration": 2.517}, {"id": "ajian_comeback_02", "role": "ajian", "category": "comeback", "text": "原来你还留着复活的本事。", "src": "Audio/ajian/ajian_comeback_02.m4a", "duration": 1.934}, {"id": "ajian_comeback_03", "role": "ajian", "category": "comeback", "text": "局面又能玩了，别再掉坑。", "src": "Audio/ajian/ajian_comeback_03.m4a", "duration": 2.792}, {"id": "ajian_comeback_04", "role": "ajian", "category": "comeback", "text": "你把逆风局打回来了嘛。", "src": "Audio/ajian/ajian_comeback_04.m4a", "duration": 1.851}, {"id": "oscar_opening_book_entry_01", "role": "oscar", "category": "opening_book_entry", "text": "这段开局，有清楚的章法。", "src": "Audio/oscar/oscar_opening_book_entry_01.m4a", "duration": 3.244}, {"id": "oscar_opening_book_entry_02", "role": "oscar", "category": "opening_book_entry", "text": "经典的结构，值得细品。", "src": "Audio/oscar/oscar_opening_book_entry_02.m4a", "duration": 2.463}, {"id": "oscar_opening_book_entry_03", "role": "oscar", "category": "opening_book_entry", "text": "你熟悉这页棋谱。", "src": "Audio/oscar/oscar_opening_book_entry_03.m4a", "duration": 1.638}, {"id": "oscar_opening_book_entry_04", "role": "oscar", "category": "opening_book_entry", "text": "开篇写得端正，我很欣赏。", "src": "Audio/oscar/oscar_opening_book_entry_04.m4a", "duration": 2.735}, {"id": "oscar_opening_book_exit_01", "role": "oscar", "category": "opening_book_exit", "text": "书页到此，思考才刚展开。", "src": "Audio/oscar/oscar_opening_book_exit_01.m4a", "duration": 3.572}, {"id": "oscar_opening_book_exit_02", "role": "oscar", "category": "opening_book_exit", "text": "走出理论，检验的是理解。", "src": "Audio/oscar/oscar_opening_book_exit_02.m4a", "duration": 2.91}, {"id": "oscar_opening_book_exit_03", "role": "oscar", "category": "opening_book_exit", "text": "记住变化之外，还要理解缘由。", "src": "Audio/oscar/oscar_opening_book_exit_03.m4a", "duration": 3.458}, {"id": "oscar_opening_book_exit_04", "role": "oscar", "category": "opening_book_exit", "text": "现成的句子用尽，该写自己的棋了。", "src": "Audio/oscar/oscar_opening_book_exit_04.m4a", "duration": 3.772}, {"id": "oscar_player_accurate_01", "role": "oscar", "category": "player_accurate", "text": "这一手，经得起推敲。", "src": "Audio/oscar/oscar_player_accurate_01.m4a", "duration": 2.478}, {"id": "oscar_player_accurate_02", "role": "oscar", "category": "player_accurate", "text": "细微处见功夫。", "src": "Audio/oscar/oscar_player_accurate_02.m4a", "duration": 2.534}, {"id": "oscar_player_accurate_03", "role": "oscar", "category": "player_accurate", "text": "准确，往往比喧闹更有力量。", "src": "Audio/oscar/oscar_player_accurate_03.m4a", "duration": 3.815}, {"id": "oscar_player_accurate_04", "role": "oscar", "category": "player_accurate", "text": "你把局面的分寸拿住了。", "src": "Audio/oscar/oscar_player_accurate_04.m4a", "duration": 3.071}, {"id": "oscar_player_best_01", "role": "oscar", "category": "player_best", "text": "答案正是如此，漂亮。", "src": "Audio/oscar/oscar_player_best_01.m4a", "duration": 2.617}, {"id": "oscar_player_best_02", "role": "oscar", "category": "player_best", "text": "这一着切中了问题的核心。", "src": "Audio/oscar/oscar_player_best_02.m4a", "duration": 2.747}, {"id": "oscar_player_best_03", "role": "oscar", "category": "player_best", "text": "好棋，理由十分充分。", "src": "Audio/oscar/oscar_player_best_03.m4a", "duration": 2.424}, {"id": "oscar_player_best_04", "role": "oscar", "category": "player_best", "text": "你找到了最合乎局面的选择。", "src": "Audio/oscar/oscar_player_best_04.m4a", "duration": 3.472}, {"id": "oscar_player_brilliant_01", "role": "oscar", "category": "player_brilliant", "text": "妙极，这一着有真正的想象力。", "src": "Audio/oscar/oscar_player_brilliant_01.m4a", "duration": 3.848}, {"id": "oscar_player_brilliant_02", "role": "oscar", "category": "player_brilliant", "text": "我得承认，这是很高明的构思。", "src": "Audio/oscar/oscar_player_brilliant_02.m4a", "duration": 3.472}, {"id": "oscar_player_brilliant_03", "role": "oscar", "category": "player_brilliant", "text": "看似冒险，实则有理有据。", "src": "Audio/oscar/oscar_player_brilliant_03.m4a", "duration": 3.082}, {"id": "oscar_player_brilliant_04", "role": "oscar", "category": "player_brilliant", "text": "这枚落子，值得写进笔记。", "src": "Audio/oscar/oscar_player_brilliant_04.m4a", "duration": 2.91}, {"id": "oscar_player_brilliant_05", "role": "oscar", "category": "player_brilliant", "text": "漂亮的计算，让大胆有了根基。", "src": "Audio/oscar/oscar_player_brilliant_05.m4a", "duration": 3.771}, {"id": "oscar_lia_best_move_01", "role": "oscar", "category": "lia_best_move", "text": "我的应对，请你细看。", "src": "Audio/oscar/oscar_lia_best_move_01.m4a", "duration": 2.324}, {"id": "oscar_lia_best_move_02", "role": "oscar", "category": "lia_best_move", "text": "这一手，也许值得慢慢琢磨。", "src": "Audio/oscar/oscar_lia_best_move_02.m4a", "duration": 3.522}, {"id": "oscar_lia_best_move_03", "role": "oscar", "category": "lia_best_move", "text": "我选择先处理局面的要点。", "src": "Audio/oscar/oscar_lia_best_move_03.m4a", "duration": 2.814}, {"id": "oscar_lia_best_move_04", "role": "oscar", "category": "lia_best_move", "text": "现在，换我提出一个问题。", "src": "Audio/oscar/oscar_lia_best_move_04.m4a", "duration": 2.478}, {"id": "oscar_capture_pawn_01", "role": "oscar", "category": "capture_pawn", "text": "一兵之利，也不可轻忽。", "src": "Audio/oscar/oscar_capture_pawn_01.m4a", "duration": 2.692}, {"id": "oscar_capture_pawn_02", "role": "oscar", "category": "capture_pawn", "text": "这枚兵，我便收下了。", "src": "Audio/oscar/oscar_capture_pawn_02.m4a", "duration": 2.424}, {"id": "oscar_capture_pawn_03", "role": "oscar", "category": "capture_pawn", "text": "细小的积累，终会有分量。", "src": "Audio/oscar/oscar_capture_pawn_03.m4a", "duration": 3.146}, {"id": "oscar_capture_pawn_04", "role": "oscar", "category": "capture_pawn", "text": "这一笔收益，已经落定。", "src": "Audio/oscar/oscar_capture_pawn_04.m4a", "duration": 2.638}, {"id": "oscar_capture_minor_01", "role": "oscar", "category": "capture_minor", "text": "轻子离场，配合便少了一环。", "src": "Audio/oscar/oscar_capture_minor_01.m4a", "duration": 3.515}, {"id": "oscar_capture_minor_02", "role": "oscar", "category": "capture_minor", "text": "这枚轻子，我拿到了。", "src": "Audio/oscar/oscar_capture_minor_02.m4a", "duration": 2.173}, {"id": "oscar_capture_minor_03", "role": "oscar", "category": "capture_minor", "text": "损失虽称轻子，分量却不轻。", "src": "Audio/oscar/oscar_capture_minor_03.m4a", "duration": 4.752}, {"id": "oscar_capture_minor_04", "role": "oscar", "category": "capture_minor", "text": "你少了一位重要的参与者。", "src": "Audio/oscar/oscar_capture_minor_04.m4a", "duration": 2.696}, {"id": "oscar_capture_rook_01", "role": "oscar", "category": "capture_rook", "text": "车已被取走，局面需重新审视。", "src": "Audio/oscar/oscar_capture_rook_01.m4a", "duration": 4.002}, {"id": "oscar_capture_rook_02", "role": "oscar", "category": "capture_rook", "text": "重子之失，不能轻描淡写。", "src": "Audio/oscar/oscar_capture_rook_02.m4a", "duration": 2.832}, {"id": "oscar_capture_rook_03", "role": "oscar", "category": "capture_rook", "text": "这一车，让我的资源充裕不少。", "src": "Audio/oscar/oscar_capture_rook_03.m4a", "duration": 3.104}, {"id": "oscar_capture_rook_04", "role": "oscar", "category": "capture_rook", "text": "你的车离场了，这笔账不小。", "src": "Audio/oscar/oscar_capture_rook_04.m4a", "duration": 3.515}, {"id": "oscar_capture_queen_01", "role": "oscar", "category": "capture_queen", "text": "你的后，已经不在棋盘上了。", "src": "Audio/oscar/oscar_capture_queen_01.m4a", "duration": 3.092}, {"id": "oscar_capture_queen_02", "role": "oscar", "category": "capture_queen", "text": "最有力的棋子，也需要保护。", "src": "Audio/oscar/oscar_capture_queen_02.m4a", "duration": 2.91}, {"id": "oscar_capture_queen_03", "role": "oscar", "category": "capture_queen", "text": "我收下这枚后，棋局的重心变了。", "src": "Audio/oscar/oscar_capture_queen_03.m4a", "duration": 3.933}, {"id": "oscar_capture_queen_04", "role": "oscar", "category": "capture_queen", "text": "如此昂贵的疏忽，值得牢记。", "src": "Audio/oscar/oscar_capture_queen_04.m4a", "duration": 3.43}, {"id": "oscar_player_loses_minor_01", "role": "oscar", "category": "player_loses_minor", "text": "我的轻子被你准确地取走了。", "src": "Audio/oscar/oscar_player_loses_minor_01.m4a", "duration": 3.4}, {"id": "oscar_player_loses_minor_02", "role": "oscar", "category": "player_loses_minor", "text": "你找到了这个小小的破绽。", "src": "Audio/oscar/oscar_player_loses_minor_02.m4a", "duration": 2.152}, {"id": "oscar_player_loses_minor_03", "role": "oscar", "category": "player_loses_minor", "text": "这份收益，确实属于你。", "src": "Audio/oscar/oscar_player_loses_minor_03.m4a", "duration": 2.747}, {"id": "oscar_player_loses_minor_04", "role": "oscar", "category": "player_loses_minor", "text": "少了一枚轻子，我需重整思路。", "src": "Audio/oscar/oscar_player_loses_minor_04.m4a", "duration": 4.066}, {"id": "oscar_player_loses_rook_01", "role": "oscar", "category": "player_loses_rook", "text": "我的车被你拿下，眼光不错。", "src": "Audio/oscar/oscar_player_loses_rook_01.m4a", "duration": 3.007}, {"id": "oscar_player_loses_rook_02", "role": "oscar", "category": "player_loses_rook", "text": "这一损失，足以改变部署。", "src": "Audio/oscar/oscar_player_loses_rook_02.m4a", "duration": 2.681}, {"id": "oscar_player_loses_rook_03", "role": "oscar", "category": "player_loses_rook", "text": "你赢得重子，我当认真应对。", "src": "Audio/oscar/oscar_player_loses_rook_03.m4a", "duration": 2.932}, {"id": "oscar_player_loses_rook_04", "role": "oscar", "category": "player_loses_rook", "text": "车没守好，是我考虑欠周。", "src": "Audio/oscar/oscar_player_loses_rook_04.m4a", "duration": 3.2}, {"id": "oscar_player_loses_queen_01", "role": "oscar", "category": "player_loses_queen", "text": "我的后竟被你取走了。", "src": "Audio/oscar/oscar_player_loses_queen_01.m4a", "duration": 1.937}, {"id": "oscar_player_loses_queen_02", "role": "oscar", "category": "player_loses_queen", "text": "这处大疏忽，你没有错过。", "src": "Audio/oscar/oscar_player_loses_queen_02.m4a", "duration": 2.856}, {"id": "oscar_player_loses_queen_03", "role": "oscar", "category": "player_loses_queen", "text": "后已离场，我须重新谋篇。", "src": "Audio/oscar/oscar_player_loses_queen_03.m4a", "duration": 3.6}, {"id": "oscar_player_loses_queen_04", "role": "oscar", "category": "player_loses_queen", "text": "这次交锋，你拿到了最重要的收获。", "src": "Audio/oscar/oscar_player_loses_queen_04.m4a", "duration": 3.98}, {"id": "oscar_tactic_fork_01", "role": "oscar", "category": "tactic_fork", "text": "一着双问，双捉的道理正在此。", "src": "Audio/oscar/oscar_tactic_fork_01.m4a", "duration": 4.12}, {"id": "oscar_tactic_fork_02", "role": "oscar", "category": "tactic_fork", "text": "两个目标，同受一个威胁。", "src": "Audio/oscar/oscar_tactic_fork_02.m4a", "duration": 2.792}, {"id": "oscar_tactic_fork_03", "role": "oscar", "category": "tactic_fork", "text": "顾此失彼，是双捉的力量。", "src": "Audio/oscar/oscar_tactic_fork_03.m4a", "duration": 2.856}, {"id": "oscar_tactic_fork_04", "role": "oscar", "category": "tactic_fork", "text": "这一步，让防守有了两难。", "src": "Audio/oscar/oscar_tactic_fork_04.m4a", "duration": 3.344}, {"id": "oscar_tactic_pin_01", "role": "oscar", "category": "tactic_pin", "text": "牵制成立，责任限制了自由。", "src": "Audio/oscar/oscar_tactic_pin_01.m4a", "duration": 4.334}, {"id": "oscar_tactic_pin_02", "role": "oscar", "category": "tactic_pin", "text": "身后的价值，让前面的子难以动弹。", "src": "Audio/oscar/oscar_tactic_pin_02.m4a", "duration": 4.066}, {"id": "oscar_tactic_pin_03", "role": "oscar", "category": "tactic_pin", "text": "这条线，连起了两个命运。", "src": "Audio/oscar/oscar_tactic_pin_03.m4a", "duration": 3.007}, {"id": "oscar_tactic_pin_04", "role": "oscar", "category": "tactic_pin", "text": "移动之前，得先想身后的后果。", "src": "Audio/oscar/oscar_tactic_pin_04.m4a", "duration": 3.814}, {"id": "oscar_tactic_discovered_attack_01", "role": "oscar", "category": "tactic_discovered_attack", "text": "前子移开，后方之力得以显现。", "src": "Audio/oscar/oscar_tactic_discovered_attack_01.m4a", "duration": 3.672}, {"id": "oscar_tactic_discovered_attack_02", "role": "oscar", "category": "tactic_discovered_attack", "text": "藏着的线路，终于露出锋芒。", "src": "Audio/oscar/oscar_tactic_discovered_attack_02.m4a", "duration": 3.104}, {"id": "oscar_tactic_discovered_attack_03", "role": "oscar", "category": "tactic_discovered_attack", "text": "这一步的意义，在它身后。", "src": "Audio/oscar/oscar_tactic_discovered_attack_03.m4a", "duration": 2.714}, {"id": "oscar_tactic_discovered_attack_04", "role": "oscar", "category": "tactic_discovered_attack", "text": "发现攻击，讲究的正是配合。", "src": "Audio/oscar/oscar_tactic_discovered_attack_04.m4a", "duration": 3.948}, {"id": "oscar_tactic_zwischenzug_01", "role": "oscar", "category": "tactic_zwischenzug", "text": "先插这一着，次序便有了文章。", "src": "Audio/oscar/oscar_tactic_zwischenzug_01.m4a", "duration": 3.494}, {"id": "oscar_tactic_zwischenzug_02", "role": "oscar", "category": "tactic_zwischenzug", "text": "你没有急于回吃，难得的细致。", "src": "Audio/oscar/oscar_tactic_zwischenzug_02.m4a", "duration": 3.472}, {"id": "oscar_tactic_zwischenzug_03", "role": "oscar", "category": "tactic_zwischenzug", "text": "同样的交换，顺序不同便全然不同。", "src": "Audio/oscar/oscar_tactic_zwischenzug_03.m4a", "duration": 4.334}, {"id": "oscar_tactic_zwischenzug_04", "role": "oscar", "category": "tactic_zwischenzug", "text": "这一记中间手，颇见功力。", "src": "Audio/oscar/oscar_tactic_zwischenzug_04.m4a", "duration": 3.125}, {"id": "oscar_tactic_sacrifice_01", "role": "oscar", "category": "tactic_sacrifice", "text": "舍去子力，是为了更重要的补偿。", "src": "Audio/oscar/oscar_tactic_sacrifice_01.m4a", "duration": 3.572}, {"id": "oscar_tactic_sacrifice_02", "role": "oscar", "category": "tactic_sacrifice", "text": "弃子有据，才称得上胆识。", "src": "Audio/oscar/oscar_tactic_sacrifice_02.m4a", "duration": 3.216}, {"id": "oscar_tactic_sacrifice_03", "role": "oscar", "category": "tactic_sacrifice", "text": "你以物质换取主动，很有见地。", "src": "Audio/oscar/oscar_tactic_sacrifice_03.m4a", "duration": 3.686}, {"id": "oscar_tactic_sacrifice_04", "role": "oscar", "category": "tactic_sacrifice", "text": "这枚子的价值，在它换来的机会中。", "src": "Audio/oscar/oscar_tactic_sacrifice_04.m4a", "duration": 3.551}, {"id": "oscar_key_threat_01", "role": "oscar", "category": "key_threat", "text": "这个威胁，需要一个严谨的回答。", "src": "Audio/oscar/oscar_key_threat_01.m4a", "duration": 3.73}, {"id": "oscar_key_threat_02", "role": "oscar", "category": "key_threat", "text": "棋盘提出的问题，不宜拖延。", "src": "Audio/oscar/oscar_key_threat_02.m4a", "duration": 2.835}, {"id": "oscar_key_threat_03", "role": "oscar", "category": "key_threat", "text": "请先审视这里的危险。", "src": "Audio/oscar/oscar_key_threat_03.m4a", "duration": 2.381}, {"id": "oscar_key_threat_04", "role": "oscar", "category": "key_threat", "text": "我已把局面的矛盾摆在这里。", "src": "Audio/oscar/oscar_key_threat_04.m4a", "duration": 2.584}, {"id": "oscar_check_01", "role": "oscar", "category": "check", "text": "将军，王必须先作答。", "src": "Audio/oscar/oscar_check_01.m4a", "duration": 2.542}, {"id": "oscar_check_02", "role": "oscar", "category": "check", "text": "这一将，暂时打断你的构思。", "src": "Audio/oscar/oscar_check_02.m4a", "duration": 3.344}, {"id": "oscar_check_03", "role": "oscar", "category": "check", "text": "你的王受到直接的挑战。", "src": "Audio/oscar/oscar_check_03.m4a", "duration": 2.188}, {"id": "oscar_check_04", "role": "oscar", "category": "check", "text": "先处理将军，再谈其余计划。", "src": "Audio/oscar/oscar_check_04.m4a", "duration": 2.875}, {"id": "oscar_player_check_01", "role": "oscar", "category": "player_check", "text": "你的将军，我已收到。", "src": "Audio/oscar/oscar_player_check_01.m4a", "duration": 2.678}, {"id": "oscar_player_check_02", "role": "oscar", "category": "player_check", "text": "看来我的王需要一番调整。", "src": "Audio/oscar/oscar_player_check_02.m4a", "duration": 3.322}, {"id": "oscar_player_check_03", "role": "oscar", "category": "player_check", "text": "这一问有力，我当仔细回应。", "src": "Audio/oscar/oscar_player_check_03.m4a", "duration": 2.756}, {"id": "oscar_player_check_04", "role": "oscar", "category": "player_check", "text": "你施加的压力，值得推敲。", "src": "Audio/oscar/oscar_player_check_04.m4a", "duration": 2.596}, {"id": "oscar_missed_mate_01", "role": "oscar", "category": "missed_mate", "text": "可惜，方才存在一条强制杀棋。", "src": "Audio/oscar/oscar_missed_mate_01.m4a", "duration": 4.326}, {"id": "oscar_missed_mate_02", "role": "oscar", "category": "missed_mate", "text": "结局本可写下，你却另起一行。", "src": "Audio/oscar/oscar_missed_mate_02.m4a", "duration": 4.326}, {"id": "oscar_missed_mate_03", "role": "oscar", "category": "missed_mate", "text": "这次错失，值得完整地复算。", "src": "Audio/oscar/oscar_missed_mate_03.m4a", "duration": 3.73}, {"id": "oscar_missed_mate_04", "role": "oscar", "category": "missed_mate", "text": "杀棋的机会已经过去，不妨记住。", "src": "Audio/oscar/oscar_missed_mate_04.m4a", "duration": 3.708}, {"id": "oscar_blunder_into_mate_01", "role": "oscar", "category": "blunder_into_mate", "text": "这一步，通向了无法避免的将杀。", "src": "Audio/oscar/oscar_blunder_into_mate_01.m4a", "duration": 3.415}, {"id": "oscar_blunder_into_mate_02", "role": "oscar", "category": "blunder_into_mate", "text": "王的退路，在这里被彻底封住。", "src": "Audio/oscar/oscar_blunder_into_mate_02.m4a", "duration": 3.636}, {"id": "oscar_blunder_into_mate_03", "role": "oscar", "category": "blunder_into_mate", "text": "一个疏忽，写定了整盘的结尾。", "src": "Audio/oscar/oscar_blunder_into_mate_03.m4a", "duration": 3.028}, {"id": "oscar_blunder_into_mate_04", "role": "oscar", "category": "blunder_into_mate", "text": "局面从这一着起，失去了转圜。", "src": "Audio/oscar/oscar_blunder_into_mate_04.m4a", "duration": 3.494}, {"id": "oscar_mate_01", "role": "oscar", "category": "mate", "text": "将杀，棋局至此合卷。", "src": "Audio/oscar/oscar_mate_01.m4a", "duration": 3.494}, {"id": "oscar_mate_02", "role": "oscar", "category": "mate", "text": "王已无路，对局结束。", "src": "Audio/oscar/oscar_mate_02.m4a", "duration": 2.381}, {"id": "oscar_mate_03", "role": "oscar", "category": "mate", "text": "终局落定，我们再看其间的得失。", "src": "Audio/oscar/oscar_mate_03.m4a", "duration": 3.814}, {"id": "oscar_mate_04", "role": "oscar", "category": "mate", "text": "这盘棋以将杀画下句点。", "src": "Audio/oscar/oscar_mate_04.m4a", "duration": 3.643}, {"id": "oscar_castling_01", "role": "oscar", "category": "castling", "text": "易位完成，安王与用车得以兼顾。", "src": "Audio/oscar/oscar_castling_01.m4a", "duration": 4.47}, {"id": "oscar_castling_02", "role": "oscar", "category": "castling", "text": "王先安顿，棋子的协调才从容。", "src": "Audio/oscar/oscar_castling_02.m4a", "duration": 3.89}, {"id": "oscar_castling_03", "role": "oscar", "category": "castling", "text": "这一调整，很有必要。", "src": "Audio/oscar/oscar_castling_03.m4a", "duration": 2.345}, {"id": "oscar_castling_04", "role": "oscar", "category": "castling", "text": "王车各得其所，部署更完整了。", "src": "Audio/oscar/oscar_castling_04.m4a", "duration": 3.515}, {"id": "oscar_promotion_01", "role": "oscar", "category": "promotion", "text": "兵抵达底线，完成了升变。", "src": "Audio/oscar/oscar_promotion_01.m4a", "duration": 2.928}, {"id": "oscar_promotion_02", "role": "oscar", "category": "promotion", "text": "漫长的行进，换来新的身份。", "src": "Audio/oscar/oscar_promotion_02.m4a", "duration": 3.05}, {"id": "oscar_promotion_03", "role": "oscar", "category": "promotion", "text": "小兵的价值，在此发生质变。", "src": "Audio/oscar/oscar_promotion_03.m4a", "duration": 3.436}, {"id": "oscar_promotion_04", "role": "oscar", "category": "promotion", "text": "新的子力登场，旧的判断需更新。", "src": "Audio/oscar/oscar_promotion_04.m4a", "duration": 3.98}, {"id": "oscar_queen_early_01", "role": "oscar", "category": "queen_early", "text": "后出得过早，发展因而失衡。", "src": "Audio/oscar/oscar_queen_early_01.m4a", "duration": 3.259}, {"id": "oscar_queen_early_02", "role": "oscar", "category": "queen_early", "text": "贵重的棋子，也会被节奏束缚。", "src": "Audio/oscar/oscar_queen_early_02.m4a", "duration": 4.12}, {"id": "oscar_queen_early_03", "role": "oscar", "category": "queen_early", "text": "其他棋子尚未就位，后便先行了。", "src": "Audio/oscar/oscar_queen_early_03.m4a", "duration": 4.241}, {"id": "oscar_queen_early_04", "role": "oscar", "category": "queen_early", "text": "过早出后，常要为往返付出代价。", "src": "Audio/oscar/oscar_queen_early_04.m4a", "duration": 4.177}, {"id": "oscar_defense_found_01", "role": "oscar", "category": "defense_found", "text": "防守的价值，不逊于进攻。", "src": "Audio/oscar/oscar_defense_found_01.m4a", "duration": 3.43}, {"id": "oscar_defense_found_02", "role": "oscar", "category": "defense_found", "text": "你找到了那条细窄而可靠的路。", "src": "Audio/oscar/oscar_defense_found_02.m4a", "duration": 4.023}, {"id": "oscar_defense_found_03", "role": "oscar", "category": "defense_found", "text": "压力之下，判断仍然清楚。", "src": "Audio/oscar/oscar_defense_found_03.m4a", "duration": 2.889}, {"id": "oscar_defense_found_04", "role": "oscar", "category": "defense_found", "text": "这一着稳住了根本，很好。", "src": "Audio/oscar/oscar_defense_found_04.m4a", "duration": 2.792}, {"id": "oscar_player_missed_tactic_01", "role": "oscar", "category": "player_missed_tactic", "text": "战术的联系，你暂时漏看了。", "src": "Audio/oscar/oscar_player_missed_tactic_01.m4a", "duration": 2.953}, {"id": "oscar_player_missed_tactic_02", "role": "oscar", "category": "player_missed_tactic", "text": "棋子之外，还要观察彼此的关系。", "src": "Audio/oscar/oscar_player_missed_tactic_02.m4a", "duration": 3.2}, {"id": "oscar_player_missed_tactic_03", "role": "oscar", "category": "player_missed_tactic", "text": "这里本有收获，可惜未被兑现。", "src": "Audio/oscar/oscar_player_missed_tactic_03.m4a", "duration": 3.6}, {"id": "oscar_player_missed_tactic_04", "role": "oscar", "category": "player_missed_tactic", "text": "不妨记下此处，再算一次。", "src": "Audio/oscar/oscar_player_missed_tactic_04.m4a", "duration": 2.986}, {"id": "oscar_comeback_01", "role": "oscar", "category": "comeback", "text": "局面被你一点点扳回，难得。", "src": "Audio/oscar/oscar_comeback_01.m4a", "duration": 3.494}, {"id": "oscar_comeback_02", "role": "oscar", "category": "comeback", "text": "坚持精确，终究换来了转机。", "src": "Audio/oscar/oscar_comeback_02.m4a", "duration": 3.551}, {"id": "oscar_comeback_03", "role": "oscar", "category": "comeback", "text": "这一段逆境中的思考，很有价值。", "src": "Audio/oscar/oscar_comeback_03.m4a", "duration": 3.515}, {"id": "oscar_comeback_04", "role": "oscar", "category": "comeback", "text": "优势未必永恒，你已经证明了。", "src": "Audio/oscar/oscar_comeback_04.m4a", "duration": 3.344}, {"id": "meiyi_opening_book_entry_01", "role": "meiyi", "category": "opening_book_entry", "text": "开局走得熟，功课没白做。", "src": "Audio/meiyi/meiyi_opening_book_entry_01.m4a", "duration": 2.604}, {"id": "meiyi_opening_book_entry_02", "role": "meiyi", "category": "opening_book_entry", "text": "这几步挺像样，准备过吧。", "src": "Audio/meiyi/meiyi_opening_book_entry_02.m4a", "duration": 2.481}, {"id": "meiyi_opening_book_entry_03", "role": "meiyi", "category": "opening_book_entry", "text": "熟门熟路的，先稳住。", "src": "Audio/meiyi/meiyi_opening_book_entry_03.m4a", "duration": 2.263}, {"id": "meiyi_opening_book_entry_04", "role": "meiyi", "category": "opening_book_entry", "text": "开头拾掇得利落，往下看。", "src": "Audio/meiyi/meiyi_opening_book_entry_04.m4a", "duration": 2.704}, {"id": "meiyi_opening_book_exit_01", "role": "meiyi", "category": "opening_book_exit", "text": "书翻完了，脑子该接班啦。", "src": "Audio/meiyi/meiyi_opening_book_exit_01.m4a", "duration": 2.792}, {"id": "meiyi_opening_book_exit_02", "role": "meiyi", "category": "opening_book_exit", "text": "接下来没有小抄，自己拿主意。", "src": "Audio/meiyi/meiyi_opening_book_exit_02.m4a", "duration": 2.814}, {"id": "meiyi_opening_book_exit_03", "role": "meiyi", "category": "opening_book_exit", "text": "熟路走到头，别跟着惯性跑。", "src": "Audio/meiyi/meiyi_opening_book_exit_03.m4a", "duration": 2.875}, {"id": "meiyi_opening_book_exit_04", "role": "meiyi", "category": "opening_book_exit", "text": "理论歇一歇，轮到你动真格。", "src": "Audio/meiyi/meiyi_opening_book_exit_04.m4a", "duration": 3.003}, {"id": "meiyi_player_accurate_01", "role": "meiyi", "category": "player_accurate", "text": "这一手细致，我挑不出刺。", "src": "Audio/meiyi/meiyi_player_accurate_01.m4a", "duration": 2.574}, {"id": "meiyi_player_accurate_02", "role": "meiyi", "category": "player_accurate", "text": "走得妥帖，没忘这也没忘那。", "src": "Audio/meiyi/meiyi_player_accurate_02.m4a", "duration": 3.222}, {"id": "meiyi_player_accurate_03", "role": "meiyi", "category": "player_accurate", "text": "心细就对了，棋盘不怕慢。", "src": "Audio/meiyi/meiyi_player_accurate_03.m4a", "duration": 2.986}, {"id": "meiyi_player_accurate_04", "role": "meiyi", "category": "player_accurate", "text": "这一下，账算得明白。", "src": "Audio/meiyi/meiyi_player_accurate_04.m4a", "duration": 2.284}, {"id": "meiyi_player_best_01", "role": "meiyi", "category": "player_best", "text": "就是它，你没挑错。", "src": "Audio/meiyi/meiyi_player_best_01.m4a", "duration": 2.048}, {"id": "meiyi_player_best_02", "role": "meiyi", "category": "player_best", "text": "这手好，算你有眼光。", "src": "Audio/meiyi/meiyi_player_best_02.m4a", "duration": 2.109}, {"id": "meiyi_player_best_03", "role": "meiyi", "category": "player_best", "text": "你把最要紧的事办对了。", "src": "Audio/meiyi/meiyi_player_best_03.m4a", "duration": 2.235}, {"id": "meiyi_player_best_04", "role": "meiyi", "category": "player_best", "text": "好棋，我也得费点心了。", "src": "Audio/meiyi/meiyi_player_best_04.m4a", "duration": 2.517}, {"id": "meiyi_player_brilliant_01", "role": "meiyi", "category": "player_brilliant", "text": "哎哟，这一下真有两把刷子。", "src": "Audio/meiyi/meiyi_player_brilliant_01.m4a", "duration": 3.125}, {"id": "meiyi_player_brilliant_02", "role": "meiyi", "category": "player_brilliant", "text": "你这脑子，今天转得漂亮。", "src": "Audio/meiyi/meiyi_player_brilliant_02.m4a", "duration": 2.662}, {"id": "meiyi_player_brilliant_03", "role": "meiyi", "category": "player_brilliant", "text": "敢下还算得清，难得。", "src": "Audio/meiyi/meiyi_player_brilliant_03.m4a", "duration": 2.747}, {"id": "meiyi_player_brilliant_04", "role": "meiyi", "category": "player_brilliant", "text": "这招够巧，我得另眼相看。", "src": "Audio/meiyi/meiyi_player_brilliant_04.m4a", "duration": 2.635}, {"id": "meiyi_player_brilliant_05", "role": "meiyi", "category": "player_brilliant", "text": "这一手，值得我少念叨两句。", "src": "Audio/meiyi/meiyi_player_brilliant_05.m4a", "duration": 2.491}, {"id": "meiyi_lia_best_move_01", "role": "meiyi", "category": "lia_best_move", "text": "这回我挑了个好办法。", "src": "Audio/meiyi/meiyi_lia_best_move_01.m4a", "duration": 1.798}, {"id": "meiyi_lia_best_move_02", "role": "meiyi", "category": "lia_best_move", "text": "我出个题，看看你怎么解。", "src": "Audio/meiyi/meiyi_lia_best_move_02.m4a", "duration": 2.538}, {"id": "meiyi_lia_best_move_03", "role": "meiyi", "category": "lia_best_move", "text": "这一步你细看，可有讲究。", "src": "Audio/meiyi/meiyi_lia_best_move_03.m4a", "duration": 2.871}, {"id": "meiyi_lia_best_move_04", "role": "meiyi", "category": "lia_best_move", "text": "该我动点心思了。", "src": "Audio/meiyi/meiyi_lia_best_move_04.m4a", "duration": 1.658}, {"id": "meiyi_capture_pawn_01", "role": "meiyi", "category": "capture_pawn", "text": "一兵也是钱，我先收着。", "src": "Audio/meiyi/meiyi_capture_pawn_01.m4a", "duration": 2.424}, {"id": "meiyi_capture_pawn_02", "role": "meiyi", "category": "capture_pawn", "text": "这颗小兵，我不嫌少。", "src": "Audio/meiyi/meiyi_capture_pawn_02.m4a", "duration": 2.148}, {"id": "meiyi_capture_pawn_03", "role": "meiyi", "category": "capture_pawn", "text": "小账不记，大账会乱。", "src": "Audio/meiyi/meiyi_capture_pawn_03.m4a", "duration": 2.753}, {"id": "meiyi_capture_pawn_04", "role": "meiyi", "category": "capture_pawn", "text": "你这兵没人管，我给领走了。", "src": "Audio/meiyi/meiyi_capture_pawn_04.m4a", "duration": 2.596}, {"id": "meiyi_capture_minor_01", "role": "meiyi", "category": "capture_minor", "text": "这枚轻子，归我保管啦。", "src": "Audio/meiyi/meiyi_capture_minor_01.m4a", "duration": 2.499}, {"id": "meiyi_capture_minor_02", "role": "meiyi", "category": "capture_minor", "text": "看着小，马象也金贵。", "src": "Audio/meiyi/meiyi_capture_minor_02.m4a", "duration": 2.614}, {"id": "meiyi_capture_minor_03", "role": "meiyi", "category": "capture_minor", "text": "少个帮手，可别不当回事。", "src": "Audio/meiyi/meiyi_capture_minor_03.m4a", "duration": 2.538}, {"id": "meiyi_capture_minor_04", "role": "meiyi", "category": "capture_minor", "text": "这一口，吃到正经东西了。", "src": "Audio/meiyi/meiyi_capture_minor_04.m4a", "duration": 2.617}, {"id": "meiyi_capture_rook_01", "role": "meiyi", "category": "capture_rook", "text": "你的车让我拿走了。", "src": "Audio/meiyi/meiyi_capture_rook_01.m4a", "duration": 1.595}, {"id": "meiyi_capture_rook_02", "role": "meiyi", "category": "capture_rook", "text": "这一车，可不是什么零头。", "src": "Audio/meiyi/meiyi_capture_rook_02.m4a", "duration": 2.399}, {"id": "meiyi_capture_rook_03", "role": "meiyi", "category": "capture_rook", "text": "重子得看紧，丢了心疼。", "src": "Audio/meiyi/meiyi_capture_rook_03.m4a", "duration": 2.619}, {"id": "meiyi_capture_rook_04", "role": "meiyi", "category": "capture_rook", "text": "我收下这车，你得多想想了。", "src": "Audio/meiyi/meiyi_capture_rook_04.m4a", "duration": 2.96}, {"id": "meiyi_capture_queen_01", "role": "meiyi", "category": "capture_queen", "text": "后都送来了，礼有点大啊。", "src": "Audio/meiyi/meiyi_capture_queen_01.m4a", "duration": 2.578}, {"id": "meiyi_capture_queen_02", "role": "meiyi", "category": "capture_queen", "text": "这么金贵的后，也能忘了管？", "src": "Audio/meiyi/meiyi_capture_queen_02.m4a", "duration": 2.448}, {"id": "meiyi_capture_queen_03", "role": "meiyi", "category": "capture_queen", "text": "你的后我收了，慢慢把账补上。", "src": "Audio/meiyi/meiyi_capture_queen_03.m4a", "duration": 2.832}, {"id": "meiyi_capture_queen_04", "role": "meiyi", "category": "capture_queen", "text": "这一口够重，先别乱了阵脚。", "src": "Audio/meiyi/meiyi_capture_queen_04.m4a", "duration": 2.747}, {"id": "meiyi_player_loses_minor_01", "role": "meiyi", "category": "player_loses_minor", "text": "我的轻子被你顺走啦。", "src": "Audio/meiyi/meiyi_player_loses_minor_01.m4a", "duration": 2.073}, {"id": "meiyi_player_loses_minor_02", "role": "meiyi", "category": "player_loses_minor", "text": "你眼睛挺尖，抓到我这儿了。", "src": "Audio/meiyi/meiyi_player_loses_minor_02.m4a", "duration": 2.62}, {"id": "meiyi_player_loses_minor_03", "role": "meiyi", "category": "player_loses_minor", "text": "这枚子没管好，算我吃亏。", "src": "Audio/meiyi/meiyi_player_loses_minor_03.m4a", "duration": 2.402}, {"id": "meiyi_player_loses_minor_04", "role": "meiyi", "category": "player_loses_minor", "text": "轻子到你手里了，可别糟蹋优势。", "src": "Audio/meiyi/meiyi_player_loses_minor_04.m4a", "duration": 3.064}, {"id": "meiyi_player_loses_rook_01", "role": "meiyi", "category": "player_loses_rook", "text": "我的车，叫你拿去啦。", "src": "Audio/meiyi/meiyi_player_loses_rook_01.m4a", "duration": 2.052}, {"id": "meiyi_player_loses_rook_02", "role": "meiyi", "category": "player_loses_rook", "text": "你这笔买卖做得挺实在。", "src": "Audio/meiyi/meiyi_player_loses_rook_02.m4a", "duration": 2.03}, {"id": "meiyi_player_loses_rook_03", "role": "meiyi", "category": "player_loses_rook", "text": "重子没看紧，我也得认账。", "src": "Audio/meiyi/meiyi_player_loses_rook_03.m4a", "duration": 2.692}, {"id": "meiyi_player_loses_rook_04", "role": "meiyi", "category": "player_loses_rook", "text": "这一车丢得疼，得想法子补。", "src": "Audio/meiyi/meiyi_player_loses_rook_04.m4a", "duration": 3.003}, {"id": "meiyi_player_loses_queen_01", "role": "meiyi", "category": "player_loses_queen", "text": "我的后呀，这下账大了。", "src": "Audio/meiyi/meiyi_player_loses_queen_01.m4a", "duration": 2.66}, {"id": "meiyi_player_loses_queen_02", "role": "meiyi", "category": "player_loses_queen", "text": "你这手够准，偏挑最贵的。", "src": "Audio/meiyi/meiyi_player_loses_queen_02.m4a", "duration": 2.491}, {"id": "meiyi_player_loses_queen_03", "role": "meiyi", "category": "player_loses_queen", "text": "后让你收走，我得打起精神。", "src": "Audio/meiyi/meiyi_player_loses_queen_03.m4a", "duration": 2.753}, {"id": "meiyi_player_loses_queen_04", "role": "meiyi", "category": "player_loses_queen", "text": "这回轮到我心疼棋子了。", "src": "Audio/meiyi/meiyi_player_loses_queen_04.m4a", "duration": 2.342}, {"id": "meiyi_tactic_fork_01", "role": "meiyi", "category": "tactic_fork", "text": "一手盯俩，这活儿真会安排。", "src": "Audio/meiyi/meiyi_tactic_fork_01.m4a", "duration": 2.889}, {"id": "meiyi_tactic_fork_02", "role": "meiyi", "category": "tactic_fork", "text": "双捉来了，顾头顾不了尾。", "src": "Audio/meiyi/meiyi_tactic_fork_02.m4a", "duration": 2.635}, {"id": "meiyi_tactic_fork_03", "role": "meiyi", "category": "tactic_fork", "text": "两个都想留，可没那么容易。", "src": "Audio/meiyi/meiyi_tactic_fork_03.m4a", "duration": 2.617}, {"id": "meiyi_tactic_fork_04", "role": "meiyi", "category": "tactic_fork", "text": "这一下，两边都得操心。", "src": "Audio/meiyi/meiyi_tactic_fork_04.m4a", "duration": 2.363}, {"id": "meiyi_tactic_pin_01", "role": "meiyi", "category": "tactic_pin", "text": "它被牵住啦，走不了清闲路。", "src": "Audio/meiyi/meiyi_tactic_pin_01.m4a", "duration": 3.63}, {"id": "meiyi_tactic_pin_02", "role": "meiyi", "category": "tactic_pin", "text": "身后还护着宝贝，哪能随便动。", "src": "Audio/meiyi/meiyi_tactic_pin_02.m4a", "duration": 2.692}, {"id": "meiyi_tactic_pin_03", "role": "meiyi", "category": "tactic_pin", "text": "一条线拴两个，牵制就在这儿。", "src": "Audio/meiyi/meiyi_tactic_pin_03.m4a", "duration": 3.322}, {"id": "meiyi_tactic_pin_04", "role": "meiyi", "category": "tactic_pin", "text": "前头这枚子，可不是想走就走。", "src": "Audio/meiyi/meiyi_tactic_pin_04.m4a", "duration": 2.875}, {"id": "meiyi_tactic_discovered_attack_01", "role": "meiyi", "category": "tactic_discovered_attack", "text": "前头一让，后头就来劲了。", "src": "Audio/meiyi/meiyi_tactic_discovered_attack_01.m4a", "duration": 2.481}, {"id": "meiyi_tactic_discovered_attack_02", "role": "meiyi", "category": "tactic_discovered_attack", "text": "藏着的招数，终于露面啦。", "src": "Audio/meiyi/meiyi_tactic_discovered_attack_02.m4a", "duration": 2.81}, {"id": "meiyi_tactic_discovered_attack_03", "role": "meiyi", "category": "tactic_discovered_attack", "text": "别只看挪走的，也看后头的。", "src": "Audio/meiyi/meiyi_tactic_discovered_attack_03.m4a", "duration": 2.79}, {"id": "meiyi_tactic_discovered_attack_04", "role": "meiyi", "category": "tactic_discovered_attack", "text": "这条线一开，局面就精神了。", "src": "Audio/meiyi/meiyi_tactic_discovered_attack_04.m4a", "duration": 2.753}, {"id": "meiyi_tactic_zwischenzug_01", "role": "meiyi", "category": "tactic_zwischenzug", "text": "你先插一手，倒挺会抓时候。", "src": "Audio/meiyi/meiyi_tactic_zwischenzug_01.m4a", "duration": 2.889}, {"id": "meiyi_tactic_zwischenzug_02", "role": "meiyi", "category": "tactic_zwischenzug", "text": "回吃不急，这招更要紧。", "src": "Audio/meiyi/meiyi_tactic_zwischenzug_02.m4a", "duration": 2.617}, {"id": "meiyi_tactic_zwischenzug_03", "role": "meiyi", "category": "tactic_zwischenzug", "text": "把次序换一换，便宜就不同了。", "src": "Audio/meiyi/meiyi_tactic_zwischenzug_03.m4a", "duration": 2.968}, {"id": "meiyi_tactic_zwischenzug_04", "role": "meiyi", "category": "tactic_zwischenzug", "text": "中间这一着，细心的人才看得到。", "src": "Audio/meiyi/meiyi_tactic_zwischenzug_04.m4a", "duration": 2.832}, {"id": "meiyi_tactic_sacrifice_01", "role": "meiyi", "category": "tactic_sacrifice", "text": "这枚子舍得有道理。", "src": "Audio/meiyi/meiyi_tactic_sacrifice_01.m4a", "duration": 1.855}, {"id": "meiyi_tactic_sacrifice_02", "role": "meiyi", "category": "tactic_sacrifice", "text": "不怕付出，就怕没算清。", "src": "Audio/meiyi/meiyi_tactic_sacrifice_02.m4a", "duration": 2.747}, {"id": "meiyi_tactic_sacrifice_03", "role": "meiyi", "category": "tactic_sacrifice", "text": "你这次让出去的，换回了好东西。", "src": "Audio/meiyi/meiyi_tactic_sacrifice_03.m4a", "duration": 2.789}, {"id": "meiyi_tactic_sacrifice_04", "role": "meiyi", "category": "tactic_sacrifice", "text": "舍一枚赚个主动，账没糊涂。", "src": "Audio/meiyi/meiyi_tactic_sacrifice_04.m4a", "duration": 3.007}, {"id": "meiyi_key_threat_01", "role": "meiyi", "category": "key_threat", "text": "我这儿有事儿，你可别装没看见。", "src": "Audio/meiyi/meiyi_key_threat_01.m4a", "duration": 2.517}, {"id": "meiyi_key_threat_02", "role": "meiyi", "category": "key_threat", "text": "这个威胁，得先料理。", "src": "Audio/meiyi/meiyi_key_threat_02.m4a", "duration": 2.596}, {"id": "meiyi_key_threat_03", "role": "meiyi", "category": "key_threat", "text": "别光忙自己的，眼前有麻烦。", "src": "Audio/meiyi/meiyi_key_threat_03.m4a", "duration": 3.24}, {"id": "meiyi_key_threat_04", "role": "meiyi", "category": "key_threat", "text": "我下一步要动真格，你看好了。", "src": "Audio/meiyi/meiyi_key_threat_04.m4a", "duration": 2.85}, {"id": "meiyi_check_01", "role": "meiyi", "category": "check", "text": "将军啦，先顾王要紧。", "src": "Audio/meiyi/meiyi_check_01.m4a", "duration": 2.517}, {"id": "meiyi_check_02", "role": "meiyi", "category": "check", "text": "你的王被叫住了，别忙别的。", "src": "Audio/meiyi/meiyi_check_02.m4a", "duration": 2.619}, {"id": "meiyi_check_03", "role": "meiyi", "category": "check", "text": "这一将，得马上接着。", "src": "Audio/meiyi/meiyi_check_03.m4a", "duration": 2.538}, {"id": "meiyi_check_04", "role": "meiyi", "category": "check", "text": "王的事儿排前头，其他等会儿。", "src": "Audio/meiyi/meiyi_check_04.m4a", "duration": 2.662}, {"id": "meiyi_player_check_01", "role": "meiyi", "category": "player_check", "text": "你将军了，我得先接着。", "src": "Audio/meiyi/meiyi_player_check_01.m4a", "duration": 2.152}, {"id": "meiyi_player_check_02", "role": "meiyi", "category": "player_check", "text": "哟，我的王也忙起来了。", "src": "Audio/meiyi/meiyi_player_check_02.m4a", "duration": 2.578}, {"id": "meiyi_player_check_03", "role": "meiyi", "category": "player_check", "text": "这一声听见了，我来回话。", "src": "Audio/meiyi/meiyi_player_check_03.m4a", "duration": 2.42}, {"id": "meiyi_player_check_04", "role": "meiyi", "category": "player_check", "text": "压力给到我，这回不闲着啦。", "src": "Audio/meiyi/meiyi_player_check_04.m4a", "duration": 2.832}, {"id": "meiyi_missed_mate_01", "role": "meiyi", "category": "missed_mate", "text": "刚才能将杀，你给漏过去了。", "src": "Audio/meiyi/meiyi_missed_mate_01.m4a", "duration": 2.42}, {"id": "meiyi_missed_mate_02", "role": "meiyi", "category": "missed_mate", "text": "都到门口了，怎么又拐弯啦。", "src": "Audio/meiyi/meiyi_missed_mate_02.m4a", "duration": 2.714}, {"id": "meiyi_missed_mate_03", "role": "meiyi", "category": "missed_mate", "text": "杀棋没看着，这里要记一笔。", "src": "Audio/meiyi/meiyi_missed_mate_03.m4a", "duration": 3.007}, {"id": "meiyi_missed_mate_04", "role": "meiyi", "category": "missed_mate", "text": "机会来过，可惜没端住。", "src": "Audio/meiyi/meiyi_missed_mate_04.m4a", "duration": 2.617}, {"id": "meiyi_blunder_into_mate_01", "role": "meiyi", "category": "blunder_into_mate", "text": "这步把王送进必杀了。", "src": "Audio/meiyi/meiyi_blunder_into_mate_01.m4a", "duration": 2.596}, {"id": "meiyi_blunder_into_mate_02", "role": "meiyi", "category": "blunder_into_mate", "text": "出口都堵了，这下没法绕。", "src": "Audio/meiyi/meiyi_blunder_into_mate_02.m4a", "duration": 2.875}, {"id": "meiyi_blunder_into_mate_03", "role": "meiyi", "category": "blunder_into_mate", "text": "你这一下，直接把结尾定了。", "src": "Audio/meiyi/meiyi_blunder_into_mate_03.m4a", "duration": 2.478}, {"id": "meiyi_blunder_into_mate_04", "role": "meiyi", "category": "blunder_into_mate", "text": "王走进死胡同，可不容易出来。", "src": "Audio/meiyi/meiyi_blunder_into_mate_04.m4a", "duration": 3.243}, {"id": "meiyi_mate_01", "role": "meiyi", "category": "mate", "text": "将杀，今天这盘收工。", "src": "Audio/meiyi/meiyi_mate_01.m4a", "duration": 2.278}, {"id": "meiyi_mate_02", "role": "meiyi", "category": "mate", "text": "王没路了，咱们复盘说。", "src": "Audio/meiyi/meiyi_mate_02.m4a", "duration": 2.889}, {"id": "meiyi_mate_03", "role": "meiyi", "category": "mate", "text": "这盘结束，得失都记心上。", "src": "Audio/meiyi/meiyi_mate_03.m4a", "duration": 3.143}, {"id": "meiyi_mate_04", "role": "meiyi", "category": "mate", "text": "最后这一将，已经没法解了。", "src": "Audio/meiyi/meiyi_mate_04.m4a", "duration": 2.499}, {"id": "meiyi_castling_01", "role": "meiyi", "category": "castling", "text": "易位搬家，王总算安稳了。", "src": "Audio/meiyi/meiyi_castling_01.m4a", "duration": 2.732}, {"id": "meiyi_castling_02", "role": "meiyi", "category": "castling", "text": "王有着落，车也别闲着。", "src": "Audio/meiyi/meiyi_castling_02.m4a", "duration": 2.635}, {"id": "meiyi_castling_03", "role": "meiyi", "category": "castling", "text": "这次安排挺利索。", "src": "Audio/meiyi/meiyi_castling_03.m4a", "duration": 1.658}, {"id": "meiyi_castling_04", "role": "meiyi", "category": "castling", "text": "王车一调整，家里像样多了。", "src": "Audio/meiyi/meiyi_castling_04.m4a", "duration": 2.832}, {"id": "meiyi_promotion_01", "role": "meiyi", "category": "promotion", "text": "小兵熬出头，升变啦。", "src": "Audio/meiyi/meiyi_promotion_01.m4a", "duration": 2.519}, {"id": "meiyi_promotion_02", "role": "meiyi", "category": "promotion", "text": "一路走到底，总算换了身份。", "src": "Audio/meiyi/meiyi_promotion_02.m4a", "duration": 2.986}, {"id": "meiyi_promotion_03", "role": "meiyi", "category": "promotion", "text": "这枚兵有出息，真走到了。", "src": "Audio/meiyi/meiyi_promotion_03.m4a", "duration": 2.619}, {"id": "meiyi_promotion_04", "role": "meiyi", "category": "promotion", "text": "新棋子来帮忙，账又得重算。", "src": "Audio/meiyi/meiyi_promotion_04.m4a", "duration": 2.747}, {"id": "meiyi_queen_early_01", "role": "meiyi", "category": "queen_early", "text": "后出早了，满场跑腿。", "src": "Audio/meiyi/meiyi_queen_early_01.m4a", "duration": 2.448}, {"id": "meiyi_queen_early_02", "role": "meiyi", "category": "queen_early", "text": "其他子还没起床，后先忙上啦。", "src": "Audio/meiyi/meiyi_queen_early_02.m4a", "duration": 3.046}, {"id": "meiyi_queen_early_03", "role": "meiyi", "category": "queen_early", "text": "这么早出后，亏了几趟工夫。", "src": "Audio/meiyi/meiyi_queen_early_03.m4a", "duration": 2.556}, {"id": "meiyi_queen_early_04", "role": "meiyi", "category": "queen_early", "text": "别让贵重的棋子跑无用的路。", "src": "Audio/meiyi/meiyi_queen_early_04.m4a", "duration": 2.638}, {"id": "meiyi_defense_found_01", "role": "meiyi", "category": "defense_found", "text": "守得好，亏你没着急。", "src": "Audio/meiyi/meiyi_defense_found_01.m4a", "duration": 2.399}, {"id": "meiyi_defense_found_02", "role": "meiyi", "category": "defense_found", "text": "这口子堵上，心里就稳了。", "src": "Audio/meiyi/meiyi_defense_found_02.m4a", "duration": 2.662}, {"id": "meiyi_defense_found_03", "role": "meiyi", "category": "defense_found", "text": "困难时候不乱，才叫本事。", "src": "Audio/meiyi/meiyi_defense_found_03.m4a", "duration": 2.614}, {"id": "meiyi_defense_found_04", "role": "meiyi", "category": "defense_found", "text": "你这一下，把大麻烦挡回去了。", "src": "Audio/meiyi/meiyi_defense_found_04.m4a", "duration": 2.968}, {"id": "meiyi_player_missed_tactic_01", "role": "meiyi", "category": "player_missed_tactic", "text": "战术机会就在这儿，可惜漏了。", "src": "Audio/meiyi/meiyi_player_missed_tactic_01.m4a", "duration": 2.85}, {"id": "meiyi_player_missed_tactic_02", "role": "meiyi", "category": "player_missed_tactic", "text": "别光数棋子，还得看它们搭伙。", "src": "Audio/meiyi/meiyi_player_missed_tactic_02.m4a", "duration": 3.088}, {"id": "meiyi_player_missed_tactic_03", "role": "meiyi", "category": "player_missed_tactic", "text": "这步本来能多赚一笔。", "src": "Audio/meiyi/meiyi_player_missed_tactic_03.m4a", "duration": 2.127}, {"id": "meiyi_player_missed_tactic_04", "role": "meiyi", "category": "player_missed_tactic", "text": "再细看一层，收获就不止这些。", "src": "Audio/meiyi/meiyi_player_missed_tactic_04.m4a", "duration": 3.064}, {"id": "meiyi_comeback_01", "role": "meiyi", "category": "comeback", "text": "你还真把这局面给追回来啦。", "src": "Audio/meiyi/meiyi_comeback_01.m4a", "duration": 2.302}, {"id": "meiyi_comeback_02", "role": "meiyi", "category": "comeback", "text": "没放弃就有机会，这不来了。", "src": "Audio/meiyi/meiyi_comeback_02.m4a", "duration": 2.871}, {"id": "meiyi_comeback_03", "role": "meiyi", "category": "comeback", "text": "这段挺得好，我看着都替你高兴。", "src": "Audio/meiyi/meiyi_comeback_03.m4a", "duration": 3.318}, {"id": "meiyi_comeback_04", "role": "meiyi", "category": "comeback", "text": "重新有了盼头，可别又松手。", "src": "Audio/meiyi/meiyi_comeback_04.m4a", "duration": 2.96}], "labels": {"opening_book_entry": "开局库", "opening_book_exit": "离开开局库", "player_accurate": "精准棋", "player_best": "最佳棋", "player_brilliant": "妙手", "capture_minor": "对手吃轻子", "capture_rook": "对手吃车", "capture_queen": "对手吃后", "player_loses_minor": "玩家吃对手轻子", "player_loses_rook": "玩家吃对手车", "player_loses_queen": "玩家吃对手后", "tactic_fork": "捉双", "tactic_pin": "牵制", "tactic_sacrifice": "弃子", "missed_mate": "错失杀棋", "blunder_into_mate": "走入必杀", "mate": "将杀", "comeback": "扳回局面", "lia_best_move": "对手关键好棋", "capture_pawn": "对手吃兵", "tactic_discovered_attack": "发现攻击", "tactic_zwischenzug": "中间手", "key_threat": "关键威胁", "check": "对手将军", "player_check": "玩家将军", "castling": "王车易位", "promotion": "升变", "queen_early": "过早出后", "defense_found": "关键防守", "player_missed_tactic": "错过战术"}}</script><script>

const roles=Object.fromEntries(data.roles.map(r=>[r.id,r]));
function play(clip){current=clip.id;audio.src=clip.src;$('#now').textContent=roles[clip.role].name+' · '+data.labels[clip.category]+'｜'+clip.text;audio.play().catch(e=>$('#now').textContent+='（请点击播放器重试）')}
function render(){const category=$('#category').value,query=$('#search').value.toLowerCase();shown=data.clips.filter(c=>(comparison||c.role===active)&&(!category||c.category===category)&&(!query||(c.id+c.text).toLowerCase().includes(query)));document.querySelectorAll('.person').forEach(b=>b.classList.toggle('active',!comparison&&b.dataset.role===active));$('#heading').textContent=comparison?'同事件 · 八人比较':roles[active].name+' · '+roles[active].style;$('#info').textContent=comparison?'选一个事件，比较不同角色的表达和声音。':roles[active].rationale+' 音色：'+roles[active].voice;$('#count').textContent='显示 '+shown.length+' 条';$('#list').replaceChildren();for(const c of shown){const row=document.createElement('div');row.className='row';const meta=document.createElement('div');meta.className='meta';meta.textContent=roles[c.role].name+' · '+data.labels[c.category];const code=document.createElement('code');code.textContent=c.id;meta.append(code);const text=document.createElement('div');text.className='text';text.textContent=c.text;const button=document.createElement('button');button.textContent='▶ '+c.duration.toFixed(1)+' 秒';button.onclick=()=>play(c);const label=document.createElement('label');label.className='review';const check=document.createElement('input');check.type='checkbox';check.checked=!!marks[c.id];check.onchange=()=>{marks[c.id]=check.checked;try{localStorage.setItem('chess-cast-review',JSON.stringify(marks))}catch{}};label.append(check,' 待调整');row.append(meta,text,button,label);$('#list').append(row)}}
document.querySelectorAll('.person').forEach(b=>b.onclick=()=>{active=b.dataset.role;comparison=false;render()});$('#category').onchange=render;$('#search').oninput=render;$('#compare').onclick=()=>{comparison=!comparison;if(comparison&&!$('#category').value)$('#category').value='player_brilliant';render()};$('#next').onclick=()=>{if(!shown.length)return;const i=shown.findIndex(c=>c.id===current);play(shown[(i+1)%shown.length])};$('#marked').onclick=()=>{const selected=data.clips.filter(c=>marks[c.id]);$('#export').textContent=selected.map(c=>roles[c.role].name+' '+c.id+' '+c.text).join('\n')||'尚未标记条目';if(navigator.clipboard&&selected.length)navigator.clipboard.writeText($('#export').textContent).catch(()=>{})};render();
