name: maia_native
description: Offline iOS CoreML, Stockfish and audio engines for Maia Coach.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MaiaNativePlugin
