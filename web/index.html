<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#161512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maia教练" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Maia 教练</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title">♞ Maia 教练</div>
        <div class="status" id="status">准备中…</div>
        <button id="btn-settings" class="icon" title="设置">⚙</button>
      </header>

      <main>
        <section class="board-area">
          <div class="player top" id="player-top"></div>
          <div class="board-wrap">
            <div class="evalbar" id="evalbar"><div class="fill" id="evalbar-fill"></div><span id="evalbar-text"></span></div>
            <div class="board-box"><div id="board" class="cg-wrap"></div></div>
          </div>
          <div class="player bottom" id="player-bottom"></div>
          <div class="nav">
            <button data-nav="first">⏮</button>
            <button data-nav="prev">◀</button>
            <button data-nav="next">▶</button>
            <button data-nav="last">⏭</button>
            <button id="btn-flip" title="翻转棋盘">⇅</button>
          </div>
        </section>

        <section class="side">
          <div class="tabs">
            <button data-tab="play" class="active">对弈</button>
            <button data-tab="review">复盘</button>
          </div>

          <div class="tab" id="tab-play">
            <div class="row">
              <button id="btn-new" class="primary">新对局</button>
              <button id="btn-undo">悔棋</button>
              <button id="btn-hint">提示</button>
              <button id="btn-resign">认输</button>
            </div>
            <div class="info" id="play-info"></div>
            <div class="hint" id="hint-box"></div>
          </div>

          <div class="tab hidden" id="tab-review">
            <div class="row">
              <button id="btn-analyse" class="primary">分析整局</button>
              <button id="btn-live">实时分析：关</button>
            </div>
            <div class="progress hidden" id="analyse-progress"><div></div></div>
            <svg id="graph" class="graph" viewBox="0 0 100 40" preserveAspectRatio="none"></svg>
            <div class="summary" id="summary"></div>
            <div class="coach" id="coach-box"></div>
            <div class="lines" id="sf-lines"></div>
          </div>

          <div class="moves" id="moves"></div>

          <div class="row small">
            <button id="btn-pgn-copy">复制 PGN</button>
            <button id="btn-pgn-import">导入 PGN</button>
          </div>
        </section>
      </main>
    </div>

    <dialog id="dlg-settings">
      <form method="dialog">
        <h3>设置</h3>
        <label>Maia 模型
          <select name="model">
            <option value="5m">Maia-3 5M（21MB，最快）</option>
            <option value="23m">Maia-3 23M（91MB，推荐）</option>
            <option value="79m">Maia-3 79M（312MB，最准）</option>
          </select>
        </label>
        <label>等级分（Maia 与我相同） <output name="eloOut"></output>
          <input type="range" name="elo" min="0" max="2600" step="50" />
        </label>
        <label>我执
          <select name="color">
            <option value="w">白棋</option>
            <option value="b">黑棋</option>
            <option value="random">随机</option>
          </select>
        </label>
        <label>Maia 随机性 temperature <output name="tempOut"></output>
          <input type="range" name="temperature" min="0" max="1.5" step="0.05" />
        </label>
        <label>Maia 推理后端
          <select name="backend">
            <option value="wasm">WASM（CPU，最稳）</option>
            <option value="webgpu">WebGPU（若可用）</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" name="thinkDelay" /> 模拟人类思考时间</label>
        <label>Stockfish 每步分析时间（毫秒）
          <input type="number" name="sfMovetime" min="100" max="20000" step="100" />
        </label>
        <label>Stockfish 线程数（多线程需跨源隔离）
          <input type="number" name="sfThreads" min="1" max="16" />
        </label>
        <label>Stockfish Hash（MB）
          <input type="number" name="sfHash" min="16" max="1024" step="16" />
        </label>
        <label class="check"><input type="checkbox" name="lowMemory" /> 省内存模式（切换对弈/复盘时卸载另一个引擎，iPhone 推荐）</label>
        <div class="env" id="env-info"></div>
        <div class="row">
          <button value="cancel">取消</button>
          <button value="ok" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-promo">
      <div class="promo" id="promo-choices"></div>
    </dialog>

    <dialog id="dlg-pgn">
      <form method="dialog">
        <h3>导入 PGN</h3>
        <textarea name="pgn" rows="10" placeholder="粘贴 PGN 或 FEN"></textarea>
        <div class="row">
          <button value="cancel">取消</button>
          <button value="ok" class="primary">导入并复盘</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
